# Textes de l'interface (langues 2/5, AD-19) : servis par GET /api/ui_texts, lus par t() de
# src/wavestack/web/static/i18n.js. Le français est ici ; l'anglais et l'allemand sont sous
# content/i18n/{en,de}/ui.yaml, avec les mêmes clés et les mêmes variables.
# - Clés en anglais, snake_case, hiérarchiques : main.top_bar.reset.
# - Variables {name} ; un nombre passé en variable est formaté dans la langue.
# - Pluriel : une clé .one et une clé .other, choisies par Intl.PluralRules sur {count}.
# - common : les textes partagés, dont la navigation et le thème des cinq pages ; main : l'écran
#   principal (index.html, app.js) ; llm : l'Atelier LLM (llm.html, llm.js) ; rag : l'atelier RAG
#   (rag.html, rag.js) ; diagnostic et models : les pages du diagnostic et des modèles (langues
#   4/5). Les textes des ateliers eux-mêmes sont dans content/llm_lab.yaml et content/rag_lab.yaml.

