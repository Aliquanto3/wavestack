traps:
- id: two_judges
  kind: two_judges
  question_id: q_fact_badge
  criterion: faithfulness
  title_text: Two judges, two verdicts
  explain_text: 'Same question, same answer: the local judge calls it faithful, the cloud judge does not.
    Each has its justification, and both are plausible.'
  answer_text: The badge is deactivated within a week.
  verdicts:
    local:
      verdict: 'yes'
      why_text: 'The answer stays within the context''s theme: a badge deactivated after departure.'
    cloud:
      verdict: 'no'
      why_text: The context says nothing of a week; the rule given is 24 hours, so the duration is made
        up.
- id: variance
  kind: variance
  question_id: q_temporal_taille
  criterion: accuracy
  title_text: Variance of the same judge
  explain_text: 'The same judge, on the same case, twice: two verdicts. Nothing changed in the case; temperature
    and passage order are enough.'
  answer_text: An attachment does not exceed 10 MB.
  causes:
  - temperature
  - passage_order
  passes:
  - verdict: 'yes'
    why_text: The answer gives an attachment size, as expected.
  - verdict: 'no'
    why_text: The size given, 10 MB, is the old version's, not the expected 25 MB.
- id: two_tools
  kind: two_tools
  question_id: q_multi_crise
  title_text: Two tools, two definitions
  explain_text: '« Faithfulness » has no single definition: Ragas counts the claims supported, DeepEval
    those not contradicted. On the same answer the two scores differ; they are recomputed here from the
    same labelled claims.'
  answer_text: Call the single on-call number, 06 07 08 09 10, at any hour. The on-call answers within
    30 minutes. It reports to the finance department.
  claims:
  - text: There is a single on-call number.
    label: supported
  - text: That number is 06 07 08 09 10.
    label: supported
  - text: It can be called at any hour.
    label: supported
  - text: The on-call answers within 30 minutes.
    label: unsupported
  - text: The on-call reports to the finance department.
    label: contradicted
- id: ranking
  kind: ranking
  title_text: The judge changes the ranking
  explain_text: On the same set, the local judge ranks « dense » before « hybrid » and the cloud judge
    the reverse. Choosing the judge is choosing the winner.
