# V1.2 story 20 (CAP-18): the RAG workshop's composed chain exposed as a read-only MCP server.
# Same keys and variables as `content/rag_mcp.yaml`.
server:
  instructions_text: "WaveStack demonstration server: it searches the fictitious Exemplia corpus with the RAG architecture composed in the workshop, and returns cited passages. It writes nothing: you write the answer from the passages, citing them."
tools:
  search_documents:
    description_text: "Searches the fictitious Exemplia corpus (an imaginary company) for the passages closest to a question, with the exposed RAG architecture. Returns at most top_k ranked passages, each with its document, its title, its position, its score and a citation. Read only; documents reserved for HR are never returned."
    question_text: "The question, in natural language (500 characters at most)."
    top_k_text: "The number of passages wanted, from 1 to 10."
  describe_architecture:
    description_text: "Says which RAG architecture this server exposes, its stages, and its limits (fictitious corpus, read only, no generation)."
reasons:
  invalid: "Chain refused by the workshop: {reason}"
  whole_corpus: "“{option}” reads the whole corpus without an index or a search: there is no search tool to expose."
  searches_itself: "“{option}” runs its own search with the generative model: only a chain whose search is done by its stages can be exposed."
  model_stage: "The “{stage}” stage calls the generative model or cannot be exposed yet: remove it to expose the chain."
  head: "Only the RAG brick's head can be exposed (chunking by paragraphs at the shipped size, the brick's embedding model, sqlite-vec): its index is read, never written."
describe:
  composed_label_text: "Composed chain"
  stage_text: "{stage}: {option}"
  header_text: "Exposed architecture: {architecture}."
  corpus_text: "Corpus: Exemplia's fictitious documents shipped with WaveStack, never the workshop's work copy."
  hr_text: "Access profile “everyone”: the passages of documents reserved for HR are removed before the answer, and their number is given."
  frozen_text: "The chain is frozen when the server starts: a change in the workshop counts only after a stop and a start."
  not_run_text: "The server runs the chunking, the embedding, the index and the search; neither the Context nor the Generation runs for you."
  limits:
    - "Read only: no file, index or cache is written."
    - "No generative model and no cloud model is called; only the local embedding and, where relevant, reranking models serve."
    - "One call at a time: if the workshop is busy, the call is refused; try again."
    - "Teaching demonstration: the documents are fictitious."
search:
  citation_text: "{title} ({doc_id}, excerpt {position})"
  passage_text: "{rank}. {citation} — score {score}\n{text}"
  header_text: "{n} passage(s) found with the “{architecture}” architecture."
  removed_text: "{n} passage(s) of a document reserved for HR removed from the list."
  none_text: "No passage."
  no_score_text: "no score"
card:
  title_text: "Expose over MCP"
  hint_text: "Exposes the workshop's chain as a read-only MCP server, on this machine (127.0.0.1): a client such as Claude Code can then search the Exemplia corpus and receive cited passages. The client's model writes the answer."
  state_label_text: "State"
  state_on_text: "exposed"
  state_off_text: "stopped"
  start_text: "Start"
  stop_text: "Stop"
  address_label_text: "Address"
  token_label_text: "Token"
  token_hidden_text: "•••••••• (hidden)"
  reveal_text: "Reveal"
  hide_text: "Hide"
  copy_token_text: "Copy the token"
  copy_command_text: "Copy the command"
  copied_text: "Copied."
  copy_failed_text: "Cannot copy: select the text by hand."
  chain_label_text: "Exposed chain"
  frozen_text: "Frozen at the start: to expose the changed chain, stop then start."
  tools_label_text: "Tools"
  risk_label_text: "Risk"
  rule_label_text: "Rule"
  hidden_tool_text: "not announced (rule other than “allow”)"
  command_label_text: "Plug into Claude Code"
  command_note_text: "Claude Code stores this token in its own configuration; it is no longer valid after the next start."
  copilot_text: "Copilot Studio requires a public HTTPS address: the application provides none (neither a tunnel nor hosting)."
  language_text: "The tools' descriptions are in the language of the start: changing the language stops the server."
  refused_label_text: "Start refused"
