nodes:
- id: L1-mots_de_passe#1
  level: 1
  children: [mots_de_passe#1, mots_de_passe#3]
  sources: [mots_de_passe]
  audience: all
  summary_text: 'At Exemplia, a user account password has at least 14 characters. An automatic check compares each new password with a list of 100,000 common or already leaked passwords: a password on that list is refused, even if it has more than 14 characters.'
  sha256: ba8e839016a23af37a5eb826d57901fc9a146404490b88cbef6928632c05575e
- id: L1-mots_de_passe#2
  level: 1
  children: [mots_de_passe#2, teletravail#1, teletravail#3]
  sources: [mots_de_passe, teletravail]
  audience: all
  summary_text: Remote work days are declared in the HR tool by the previous Friday at the latest. Remote work from abroad is limited to 20 days per calendar year, with the written agreement of the manager and of the human resources department, for tax and social security reasons.
  sha256: 11f0bdf9c8e100c6fcbae9233620bc461815b61642db7c9cde22183919ed78ff
- id: L1-teletravail#2
  level: 1
  children: [teletravail#2, incidents#2]
  sources: [teletravail, incidents]
  audience: all
  summary_text: 'Working on a public Wi-Fi network, on a train, in a café or in a hotel, is allowed only with the VPN on and a privacy filter fitted to the screen. While waiting for CERT-Ex to respond, the suspect workstation is disconnected from the network, cable unplugged and Wi-Fi turned off, but it is not shut down: its RAM holds traces that are useful to the investigation.'
  sha256: 64fb6e55936c6ae08d18401baa9988f12d75039172c48634bb302056a7ccf003
- id: L1-classification#1
  level: 1
  children: [classification#1, classification#2, classification#3, classification#4]
  sources: [classification]
  audience: all
  summary_text: 'All information produced or received by Exemplia carries one of the following 4 classification levels: Public, Internal, Confidential and Secret. The Secret level is reserved for a short list of strategic information, such as acquisition projects or detailed business continuity plans. Confidential and Secret paper documents are stored in a locked cabinet and destroyed with a level P-5 shredder.'
  sha256: 76a2c311a8264b489989c32dfba881b2aaf26346fb9db575ebf64d9fe0293abe
- id: L1-incidents#1
  level: 1
  children: [incidents#1, incidents#4]
  sources: [incidents]
  audience: all
  summary_text: Any employee who notices or suspects an incident reports it within 30 minutes to the response team, CERT-Ex. Each level 2 or 3 incident gives rise to a written lessons-learned report, drafted within 15 working days, which describes the timeline, the cause and the measures taken to prevent it from happening again.
  sha256: 5b76f9abaaffbb8ef383f6d586b90530fadf1ebaa76443566b8c38991f452a98
- id: L1-incidents#3
  level: 1
  children: [incidents#3, gestion_crise#1, astreinte#1, astreinte#2]
  sources: [incidents, gestion_crise, astreinte]
  audience: all
  summary_text: A level 2 incident mobilises CERT-Ex, which informs the chief information security officer within the hour. To know who to call at night, the on-call contacts annex lists the numbers to reach, depending on the time and the area concerned.
  sha256: 3fd9731a697e93f63a20ede79cd1b47a2f6462924a78cd2761f806781f801840
- id: L1-donnees_personnelles#1
  level: 1
  children: [donnees_personnelles#1, donnees_personnelles#3, donnees_personnelles#4]
  sources: [donnees_personnelles]
  audience: all
  summary_text: 'Exemplia''s record of processing activities sets, for each processing activity, an active period, during which departments use the data, then an archiving period, during which only the legal department can access it. Working copies, such as spreadsheet extracts or files sent by email, follow the same periods as the original processing activity: it is up to each person to delete them.'
  sha256: 8ebcde64cbcbbf7abc6fbd11791eecfc6695b9b0f40231701489a2386769d801
- id: L1-donnees_personnelles#2
  level: 1
  children: [donnees_personnelles#2, sauvegardes#1, sauvegardes#2]
  sources: [donnees_personnelles, sauvegardes]
  audience: all
  summary_text: Unsuccessful job applications are kept for 2 years after the last contact with the applicant, who is informed of this and may ask for them to be deleted sooner. Daily backups are kept for 35 days, weekly backups for 12 weeks, and one monthly backup is kept for 7 years for accounting obligations.
  sha256: 190510a55e3384470cf96e79241f2002d741520806e9412a48f439a5da8faaec
- id: L1-ia_generative#1
  level: 1
  children: [ia_generative#1, ia_generative#2]
  sources: [ia_generative]
  audience: all
  summary_text: 'The reference tool is ExempliaGPT, an assistant hosted in Exemplia''s data centre: the texts entrusted to it do not leave the company and are not used to train any model. It is forbidden to paste into them a contract, an extract of Exemplia''s source code, personal data or the minutes of an internal meeting.'
  sha256: 71f68f9527dc7da4b71fb81657ded66cdd95b77b64e27ca76b474ae5a7fc42f4
- id: L1-ia_generative#3
  level: 1
  children: [ia_generative#3, formation_securite#1, formation_securite#2]
  sources: [ia_generative, formation_securite]
  audience: all
  summary_text: Before getting access to ExempliaGPT, each employee takes a 3-hour online training course, then passes a quiz with at least 8 correct answers out of 10. Every Exemplia employee takes a 2-hour online information security training, then passes a quiz with at least 8 correct answers out of 10 to obtain it.
  sha256: ca6bfdbb49146fc8959767c3dbe8bf2669effdb6d7f834b5d97437c0af15d573
- id: L1-deplacements#1
  level: 1
  children: [deplacements#1, deplacements#2, deplacements#3]
  sources: [deplacements]
  audience: all
  summary_text: Air travel is allowed only beyond 4 and a half hours by train, in economy class, and business class is reserved for flights of more than 7 hours. A meal taken while travelling is reimbursed up to 22 euros; a meal with a client is reimbursed on invoice, up to 60 euros per person, with the name of the guest company. After 90 days, an expense is no longer reimbursed.
  sha256: b7f6f7a60878d99255f659e72196fdb79a675be9fd0ed39d15f1ebdd263e7f69
- id: L1-prestataires#1
  level: 1
  children: [prestataires#1, clauses_contrats#1, clauses_contrats#2, registre_sous_traitants#1]
  sources: [prestataires, clauses_contrats, registre_sous_traitants]
  audience: all
  summary_text: 'A standard supplier answers an annual security questionnaire. This register, kept by the supplier unit and cited by the model of security clauses, lists every subcontractor used by an Exemplia supplier: its name, its function, the country where it hosts or processes data, and the tier of the supplier that uses it.'
  sha256: fb1485a49867b5da4ff824f3dda0edfe5d34a9e826ce5a3627b3b9018ec95e86
- id: L1-prestataires#2
  level: 1
  children: [prestataires#2, prestataires#3, registre_sous_traitants#2]
  sources: [prestataires, registre_sous_traitants]
  audience: all
  summary_text: At the end of a contract, the supplier erases Exemplia's data and confirms it in writing within the delay set by the contract's clauses. A subcontractor hosted outside the European Union only appears in the register with the written exception set by the supplier policy, attached to its entry.
  sha256: 748cf2b67d79660800f18d82f05daa1482bd4378761e638a302c6e81050950d8
- id: L1-gestion_crise#2
  level: 1
  children: [gestion_crise#2, gestion_crise#3]
  sources: [gestion_crise]
  audience: all
  summary_text: The crisis unit shares a situation update every 2 hours with the directions concerned, and a single message to employees is approved before any release. The crisis is closed once the unit finds the situation under control and corrective measures under way; the closure is recorded in the crisis log.
  sha256: b5551c8a17255eec0348ffa785df2d86d50ac81220c5363c8461d11c3788574a
- id: L1-charte_messagerie_v1#1
  level: 1
  children: [charte_messagerie_v1#1, charte_messagerie_v2#1, note_changement_messagerie#1, note_changement_messagerie#3]
  sources: [charte_messagerie_v1, charte_messagerie_v2, note_changement_messagerie]
  audience: all
  summary_text: 'This version of the email charter, in force since January 2024, is replaced by version 2: it is kept here as an archive, to understand past decisions. This change led to the revision of the email charter, from its version 1 to its version 2. Version 1 of the charter remains available as an archive, to understand decisions made before this change, but it no longer applies since 1 January 2026.'
  sha256: f849af12c6c79cdbc47de83dfaebf709d8e94d4328968b99a9d6b8053ccf3850
- id: L1-charte_messagerie_v1#2
  level: 1
  children: [charte_messagerie_v1#2, charte_messagerie_v2#2, note_changement_messagerie#2]
  sources: [charte_messagerie_v1, charte_messagerie_v2, note_changement_messagerie]
  audience: all
  summary_text: A message sent by mistake to the wrong external recipient is reported to the incident response team within the hour, especially if it contains confidential information or personal data. A message sent by mistake to the wrong external recipient is still reported to the incident response team within the hour, especially if it contains confidential information or personal data.
  sha256: 294daafdbe974f9f8ddbaeb19dcf7607f61fad271018f5ba8b54dfd0f23225bf
- id: L1-rundschreiben_usb#1
  level: 1
  children: [rundschreiben_usb#1, rundschreiben_usb#2, rundschreiben_usb#3]
  sources: [rundschreiben_usb]
  audience: all
  summary_text: Jede Mitarbeiterin und jeder Mitarbeiter, der einen USB-Speicher benötigt, erhält auf Anfrage einen von der IT-Abteilung ausgegebenen, verschlüsselten USB-Stick mit 256-Bit-Verschlüsselung. Externe Besucher und Lieferanten dürfen an der Zentrale keinen eigenen USB-Speicher anschließen; für einen Datenaustausch steht ein gesicherter Übertragungsdienst zur Verfügung, der vom Empfang vermittelt wird.
  sha256: e654a5dc2f84a2d5e79a7c9eaca2aa3f0b67080987f6754c5105fdae7081babd
- id: L1-uk_visitor_badges#1
  level: 1
  children: [uk_visitor_badges#1, uk_visitor_badges#2, acces_physique#1, acces_physique#2]
  sources: [uk_visitor_badges, acces_physique]
  audience: all
  summary_text: Every visitor to the Manchester office receives a dated visitor badge at reception, after showing a photo ID and signing the visitor register. A visitor who needs access to another floor returns to reception for a new badge. The visitor badge is returned at reception on leaving; the visitor register is kept for 90 days.
  sha256: 27a6edc78017d6180c3d4d604bd7a986cde8f46ac1c28e9d783fa602ebd5ae86
- id: L1-plan_continuite_lyon#1
  level: 1
  children: [plan_continuite_lyon#1, plan_continuite_lyon#2]
  sources: [plan_continuite_lyon]
  audience: all
  summary_text: Si le site principal de Lyon devient inaccessible, pour cause d'incendie, de panne électrique prolongée ou d'évacuation, le site de repli de Villeurbanne est activé dans les 4 heures qui suivent la décision du directeur de site. La liste des équipes prioritaires, celles qui doivent rejoindre le site de repli en premier, est affichée dans chaque bureau du site de Lyon et revue chaque année.
  sha256: 0941410456a8b5dbb2755b8c6859dd78418d94b55a511a7a94d1ec92bf162b9d
- id: L1-grille_remunerations#1
  level: 1
  children: [grille_remunerations#1, grille_remunerations#2, entretiens_annuels#1, entretiens_annuels#2]
  sources: [grille_remunerations, entretiens_annuels]
  audience: hr
  summary_text: Each category matches a gross annual salary range, revised once a year by the compensation committee, made up of general management and human resources management. This document describes Exemplia's annual review, led by each employee's direct manager; it is classed as a human resources document.
  sha256: 972014a72f9ce398fc07b3262b2f53be82f7df09bdaadfad2464c1858118486c
- id: L1-dossier_disciplinaire#1
  level: 1
  children: [dossier_disciplinaire#1, dossier_disciplinaire#2, revue_habilitations#1, revue_habilitations#2]
  sources: [dossier_disciplinaire, revue_habilitations]
  audience: hr
  summary_text: A written warning stays on file for 3 years; past that delay, it is no longer taken into account for a later measure, unless the same breach recurs before it is erased. An external audit may cover the access rights review; the register of reviews for the past two years is then presented as proof of effective access control.
  sha256: b4ef94cef79cd98336b4fa9b7fdfa254c63b37c3994af8def82a3bcf820ad21b
- id: L2-mots_de_passe#1
  level: 2
  children: [L1-mots_de_passe#1, L1-mots_de_passe#2]
  sources: [mots_de_passe, teletravail]
  audience: all
  summary_text: 'It is forbidden to write a password down on paper, in a text file or in the mailbox, and to reuse a work password on a personal website. An automatic check compares each new password with a list of 100,000 common or already leaked passwords: a password on that list is refused, even if it has more than 14 characters.'
  sha256: d902721fe19bfe6aa65ba7150754472bbc7b830a53b966e411da853b4a57d926
