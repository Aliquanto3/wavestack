  summary_text: 'At the end of a contract, the supplier erases Exemplia''s data and confirms it in writing within the delay set by the contract''s clauses. This register, kept by the supplier unit and cited by the model of security clauses, lists every subcontractor used by an Exemplia supplier: its name, its function, the country where it hosts or processes data, and the tier of the supplier that uses it.'
