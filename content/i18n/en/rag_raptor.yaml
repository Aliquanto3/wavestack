  audience: all
  summary_text: It accepts information up to the Confidential level. A message sent by mistake to the wrong external recipient is reported to the incident response team within the hour, especially if it contains confidential information or personal data. Version 1 of the charter remains available as an archive, to understand decisions made before this change, but it no longer applies since 1 January 2026.
  sha256: e216bb380d1ea24df8eac5fa59fa55208efa4320046c5a5f3d08b38871fd717f
