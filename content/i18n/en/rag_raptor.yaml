  summary_text: Any employee who notices or suspects an incident reports it within 30 minutes to the response team, CERT-Ex. A level 2 incident mobilises CERT-Ex, which informs the chief information security officer within the hour. The crisis is closed once the unit finds the situation under control and corrective measures under way; the closure is recorded in the crisis log.
