# Lot 5a: the lines of the sequence. The technical name is the same in the three languages;
# the action and the explanation are in the page's language. Without `explain_text`, the
# focus takes its pipeline stage's.
steps:
  documents:
    label_text: "Documents"
    action_text: "Load the corpus"
    explain_text: >-
      The corpus the RAG makes searchable: the documents of a fictitious company, Exemplia. It
      does not change from one question to the next; that is why all the work on it is done
      once, before the questions: this is indexing.
  chunking:
    label_text: "Chunking"
    action_text: "Cut the documents into chunks"
  embed_passages:
    label_text: "Embedding"
    action_text: "Embed each chunk"
    explain_text: >-
      The embedding model turns each chunk into a vector of numbers. Two texts with a similar
      meaning give close vectors, even with no word in common. This is computed once: the
      vectors of the RAG brick's index are read again, not recomputed. Each model offered
      has its own vector cache. A chunk longer than what the model reads at once (max_tokens)
      is truncated: the step says how many.
  vector_store:
    label_text: "Indexing"
    action_text: "Store the vectors in the vector store"
  lexical_index:
    label_text: "Lexical indexing"
    action_text: "Build the chunks' lexical index (BM25)"
    explain_text: >-
      BM25 has no learned model: it is a statistical algorithm. At indexing time, it splits each
      chunk into terms (letter case, accents and stop words ignored, acronyms kept), counts how often
      each term occurs in it and the chunk's length, then, for each term, how many chunks
      contain it (its document
      frequency): this is the inverted index, like a search engine's (Elasticsearch, Lucene).
      For each question, BM25 reads these counts again instead of going through the text. The
      workshop rebuilds this index at each run (it is fast); a search engine keeps it on disk.
  question:
    label_text: "Question"
    action_text: "Receive the question"
    explain_text: >-
      The question asked in natural language. It goes to the Embedding for a search by meaning,
      as it is to BM25 if the pipeline has one, and finally joins the model's prompt.
  embed_query:
    label_text: "Embedding"
    action_text: "Embed the question"
    explain_text: >-
      The same embedding model turns the question into a vector. It must be the one used for
      the chunks: two different models do not place meanings in the same space, their vectors
      cannot be compared.
  vector_search:
    label_text: "Dense retrieval"
    action_text: "Find the closest chunks"
  lexical_search:
    label_text: "BM25"
    action_text: "Search by keywords"
  fusion:
    label_text: "Fusion (RRF)"
    action_text: "Merge the two rankings"
  rerank:
    label_text: "Reranking"
    action_text: "Reorder the candidates"
  context:
    label_text: "Prompt augmentation"
    action_text: "Build the prompt with the chunks kept"
  generation:
    label_text: "Generation"
    action_text: "Generate the answer"
  query:
    label_text: "Query understanding"
    action_text: "Produce the queries to search"
    note_text: "The workshop has no conversation: the follow-up question reads the questions asked earlier in this session (three at most)."
  cache_prefix:
    label_text: "Prefix caching"
    action_text: "Keep the instruction and the whole corpus in the model's memory"
    explain_text: >-
      The CAG evaluates the start of the prompt once (the instruction and the whole corpus) and
      keeps the model's state that results. At each question, this state is put back in memory:
      the model reads only the question. This prefix is a cut in tokens of the prompt sent, up
      to the last end of line before the question. Any update of the corpus reloads it whole,
      and the state takes memory as long as it is kept.
  # V1.2 story 11: PageIndex's tree built once, gone down at each question; the agent's calls.
  tree_build:
    label_text: "Tree building"
    action_text: "Build the tree of the documents' sections"
    explain_text: "PageIndex builds a tree of the corpus once: the root, a node per document, one per section, each with a title and a short summary. The shipped tree is computed by a rule, without a model; “Rebuild” has the active model write the summaries. Updating a document recomputes its subtree only."
  agent_calls:
    label_text: "Tool calls"
    action_text: "The model picks an action, the tool reads it in the corpus"
    explain_text: "At each round, the model answers with a line ACTION: list_files, grep <words>, read_file <name> or ANSWER. The tools read the work copy in memory, never the disk: a name outside the corpus is refused and said to the model. Each tool result becomes an element of the context. The loop stops on ANSWER, at the 6th round or after two unreadable answers."
  tree_levels:
    label_text: "Tree descent"
    action_text: "The model picks, level by level, the nodes to open"
    explain_text: "At each level, the model reads the numbered list of the children of the nodes kept (title and summary) and answers CHOICE: 3, 7 (two at most) or CHOICE: NONE. One call per level: two on the shipped corpus (the documents, then the sections). The whole text of the sections reached becomes the context."
  # V1.2 story 8 (CAP-6): System One's lines, in the chain's order.
  router:
    label_text: "Strategy router"
    action_text: "Choose the question's search strategy"
  passage_filter:
    label_text: "Passage filter"
    action_text: "Keep or reject each passage"
  grounding_check:
    label_text: "Grounding check"
    action_text: "Check the grounding of each sentence of the answer"
  # V1.2 story 13: GraphRAG's graph built once, then queried at each question.
  graph_build:
    label_text: "Graph building"
    action_text: "Build the graph of the entities, their relations and their communities"
    explain_text: "GraphRAG builds a knowledge graph once: the corpus's entities, their relations, their summarized communities; each entity and relation keeps its evidence (the passage and its fingerprint). The shipped graph is computed by a rule, without a model (key terms, acronyms, codes, co-occurrence in a sentence); « Rebuild » has the active model extract it, one call per passage then one per community. Updating a document redoes its extraction, the merge, the communities and only the summaries touched."
  graph_query:
    label_text: "Graph query"
    action_text: "The model names the question's entities, or reads the closest communities"
    explain_text: "In local mode, one call gives the question's entities (ENTITIES: a, b); the graph links them to their neighbours one hop away, and the evidence passages of these relations become the context. In global mode, the three communities closest to the question each go through a « map » call (POINTS: … or POINTS: NONE); the generation does the « reduce ». No audience is filtered: each element says its own."
  # V1.2 story 12: RAPTOR's tree built once, then searched on every level;
  # Corrective RAG's fallback.
  raptor_build:
    label_text: "Summary tree building"
    action_text: "Cluster the passages and summarize each cluster, level by level"
    explain_text: "RAPTOR builds a tree once: the corpus's passages are clustered by how close their words are, each cluster is summarized, then the summaries are clustered and summarized in turn, up to three levels. The shipped tree is computed by a rule, without a model (extractive summaries: each child's sentence closest to the cluster); “Rebuild” has the active model write each summary, one call per node. Updating a document places its passages in the tree and redoes only the summaries touched."
  raptor_query:
    label_text: "Summary tree search"
    action_text: "Search every level of the tree at once"
    explain_text: "The tree is collapsed: passages and summaries of every level are scored together by BM25, and the five best nodes become the context, without any model call. An overview question finds a summary, a factual one a passage. No audience is filtered: each element states its own."
  fallback:
    label_text: "Corrective fallback"
    action_text: "Rewrite the question and search again when the filter kept nothing"
  # V1.2 story 14: the LLM Wiki compiled once, linted, its index read at each question.
  wiki_build:
    label_text: "Wiki compilation"
    action_text: "Compile the sources into linked wiki pages"
    explain_text: "The LLM Wiki compiles the documents once into Markdown pages: a page per document (synthesis, key facts, concepts), a page per concept several documents name, and the index of every page, linked by [[page]] links. The shipped wiki is compiled by a rule, without a model; “Rebuild” makes the active model write the syntheses. Updating a document recompiles only the pages it feeds."
  wiki_lint:
    label_text: "Wiki lint"
    action_text: "Check the wiki: links, orphan pages, concepts"
    explain_text: "After each compilation, a lint pass reads the wiki again: links to a missing page, pages no other page links to, concepts named by a single source or by none any more, concepts the corpus calls for without a page, stale syntheses. It says what a full recompilation would mend; it fixes nothing itself."
  wiki_lookup:
    label_text: "Wiki lookup"
    action_text: "The model reads the index and picks the pages to read"
    explain_text: "The model reads the numbered index of the pages (title and synthesis) and answers PAGES: 2, 5 (three at most) or PAGES: NONE. A single call; the whole text of the pages picked becomes the context, with their sources."

