# stage, option and param ids, same placeholders. Validated by wavestack.rag.lab.RagLabContent.

title_text: "Document search workshop: the search architecture to handle"
intro_text: >-
  A RAG (Retrieval-Augmented Generation: the model answers from passages found in
  documents) works in two phases. Indexing (build) splits the corpus, the set of documents to
  search, into chunks (pieces of a few paragraphs) once and for all, and stores their vectors
  (lists of numbers that sum up the meaning of a text) in a vector store (a database that
  quickly finds the closest vectors). The query (run), for each question, searches it for
  the useful chunks and places them in the model's prompt. Run the pipeline on a question to see what each step receives,
  produces and costs. This is a sandbox: the workshop's RAG brick does not change.
busy_text: "Unavailable for now: {raison}"

chain_title_text: "The RAG pipeline, step by step"
chain_help_text: >-
  The sequence of steps, the components it calls on and the focus on the chosen step. In Play
  mode, the steps and their components arrive one by one, by hand (◀ ▶) or as a run goes. In
  Compose mode, the steps of the retrieval segment (Dense retrieval: search by meaning;
  BM25: search by keywords; Fusion of the two rankings; Reranking: a new sort by a second
  model) can be removed, added and moved; Generation sends the augmented
  prompt to the workshop's active model, or generates nothing if you choose so.

