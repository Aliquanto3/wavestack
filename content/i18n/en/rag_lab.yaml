# Lot 5b: the ready-made architectures; applying one replaces the retrieval segment only,
# its steps at their shipped settings. The explanation is the tooltip.
presets:
  dense:
    label_text: "Dense RAG"
    explain_text: >-
      A single search, by meaning (Dense retrieval): the simplest RAG. Fast, but it may miss an
      acronym or an exact number.
  hybrid:
    label_text: "Hybrid RAG (BM25 + dense)"
    explain_text: >-
      One search by meaning (Dense retrieval) and one by keywords (BM25), then the Fusion (RRF)
      of their two rankings: the exact acronym and the paraphrase are both found. Two searches
      instead of one: slower than dense RAG. A Reranking can be added by hand after the
      Fusion.
  rerank:
    label_text: "RAG + reranking"
    explain_text: >-
      Dense retrieval keeps candidates, then the Reranker reads them again with the question and
      reorders them: more accurate, slower. Only the retrieval segment goes back to the shipped
      pipeline's: your Chunking, Embedding, vector store and prompt settings are kept.
  long_context:
    label_text: "Long context"
    explain_text: >-
      No index, no search: the whole corpus goes into the prompt, at each question. Nothing to
      build or update, but each request reads the whole corpus again. It needs a window of
      16,384 tokens.
  cag:
    label_text: "CAG (model cache)"
    explain_text: >-
      No index, no search: the corpus is evaluated once and kept in the local model's memory;
      each request evaluates only the question. Any update reloads the whole prefix. It needs a
      local model and a window of 16,384 tokens.
  agentic:
    label_text: "Agentic search"
    explain_text: >-
      No index: the model searches the corpus by itself with three tools (list, search words,
      read a document), one action per round, up to six. Nothing to build or update, but
      several model calls at each query.
  pageindex:
    label_text: "PageIndex"
    explain_text: >-
      No vectors: a tree of the documents and their sections, built once, that the model goes
      down level by level reading titles and summaries. A tree to build and to redo at each
      update, few calls per query.
  graphrag:
    label_text: "GraphRAG"
    explain_text: >-
      No vectors: a graph of the corpus's entities, their relations and their summarized
      communities, built once. Locally, the model names the question's entities and reads the
      evidence of their neighbours; globally, it reads the closest communities. Costly to build
      and to update with a model, several calls per query.
  llm_wiki:
    label_text: "LLM Wiki"
    explain_text: >-
      No vectors: the sources are compiled once into a wiki of Markdown pages (one per
      document, one per shared concept, an index), checked by a lint pass; at each
      question, the model picks in the index the pages to read. Pages to compile and to
      recompile at each update, one call per query.
  raptor:  # V1.2 story 12
    label_text: "RAPTOR"
    explain_text: "No vectors: a tree of summaries built once, the passages clustered and summarized, then the summaries clustered and summarized. The query searches every level at once, without any model call. Costly to build with a model, summaries to redo at each update."
  crag:  # V1.2 story 12
    label_text: "Corrective RAG"
    explain_text: "Hybrid RAG, then System One's passage filter; when the filter keeps nothing, the model rewrites the question and the search runs once more, then the workshop answers “I don't know”. No web search: the workshop is offline."
# V1.2 story 10 (vues.md): the families of architectures, in the order of PRESET_FAMILIES.
preset_families:
  search:
    label_text: "Search"
  structure:
    label_text: "Structure"
  no_index:
    label_text: "No index"

