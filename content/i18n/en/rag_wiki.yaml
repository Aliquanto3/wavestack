- id: source/sauvegardes
  kind: source
  title_text: Backups
  synthesis_text: 'Exemplia''s data follows the 3-2-1 rule: at least 3 copies of each piece of data, on 2 different media, with 1 copy kept away from the main site. This rule applies to file servers, application databases and email.'
  sources:
  - sauvegardes
  audience: all
  sha256: 82a9cde3d595b16901b7e81f186e0e5aa9f51452c23cb1970447ce714f60b9d3
  text: '# Backups


    Exemplia''s data follows the 3-2-1 rule: at least 3 copies of each piece of data, on 2 different media, with 1 copy kept away from the main site. This rule applies to file servers, application databases and email.


    ## Key facts

    - The full backup of the servers takes place every Sunday at 2 am.

    - Every weeknight, at 10 pm, an incremental backup copies only what has changed since the day before.

    - Critical databases, such as accounting and customer management, are also backed up every 4 hours during the day.

    - Daily backups are kept for 35 days, weekly backups for 12 weeks, and one monthly backup is kept for 7 years for accounting obligations.


    ## Concepts

