  title_text: Supplier security policy
  synthesis_text: 'Exemplia places every supplier who handles company information into one of two tiers: critical, when it hosts data or connects to the internal network, or standard for the others. The tier is set by the supplier unit before the contract is signed, and reviewed every year.'
  sources:
