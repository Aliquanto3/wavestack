  audience: all
  sha256: 5e94ea46f10a5dabd43c49b78ad0629c6de39102cb655fc4f2e1be8fa700de3c
  text: '# Use of generative AI


    Exemplia encourages the use of generative artificial intelligence to save time on writing, summarising and translating, in line with this charter. It applies to chat assistants, image generators and code completion tools.


    ## Key facts

    - Before getting access to ExempliaGPT, each employee takes a 3-hour online training course, then passes a quiz with at least 8 correct answers out of 10.

    - A 45-minute refresher is mandatory every year.

    - The AI committee, made up of 6 members from security, legal, human resources and the business units, reviews each new tool before it is adopted, within 6 weeks.


