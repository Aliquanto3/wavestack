- id: source/deplacements
  kind: source
  title_text: Business travel and expense claims
  synthesis_text: All business travel is approved in advance by the manager in the Voyagex booking tool, which automatically applies the rules below. A booking made outside Voyagex is reimbursed only as an exception, with a written justification.
  sources:
  - deplacements
  audience: all
  sha256: 70cfc812f66e6d02141cb05169db5fff9c94b090a4fe9a342bbff49417930db9
  text: '# Business travel and expense claims


    All business travel is approved in advance by the manager in the Voyagex booking tool, which automatically applies the rules below. A booking made outside Voyagex is reimbursed only as an exception, with a written justification.


    ## Key facts

    - The train is mandatory for any journey of less than 4 and a half hours, in second class.

    - First class is allowed for a journey of more than 3 hours booked the day before departure or on the day itself, when it costs no more than 20% above second class.

    - Air travel is allowed only beyond 4 and a half hours by train, in economy class, and business class is reserved for flights of more than 7 hours.

    - A hotel night is reimbursed up to 130 euros in Paris and 95 euros in other cities, breakfast included.


