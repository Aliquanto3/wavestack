  audience: all
  sha256: e5c4295a7d86f190f1759d33a5220be732493e089d6fe801627d5c1ab51e86b8
  text: '# Supplier security policy


    Exemplia places every supplier who handles company information into one of two tiers: critical, when it hosts data or connects to the internal network, or standard for the others. The tier is set by the supplier unit before the contract is signed, and reviewed every year.


    ## Key facts

    - A critical supplier is audited before signature, then every 3 years, and must hold an ISO 27001 certification or equivalent.

    - The supplier unit, reachable on extension 3200, tracks the list of active suppliers and their tier, and ends the relationship if an audit fails twice in a row.


