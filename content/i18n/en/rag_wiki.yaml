  sha256: bf4f39795089c6b422b7d5d55d3bc953b6d8abd4b6336d53471ab734e99eaa6a
  text: '# Annual review procedure


    This document describes Exemplia''s annual review, led by each employee''s direct manager; it is classed as a human resources document. The review takes place every year in the first quarter, between January and March.


    ## Key facts

    - The employee first fills in a self-assessment, within the 2 weeks before the set date, then the review is held with only the direct manager present, for at least 45 minutes.

    - The minutes, written by the manager and reviewed by the employee, are signed by both parties within 10 working days after the review.

    - Minutes are kept for 3 years by human resources, to track how an employee''s goals and training needs evolve over several years.


    ## Concepts

