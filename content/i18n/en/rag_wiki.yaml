  title_text: Remote work agreement
  synthesis_text: Any employee on a permanent contract may work remotely up to 3 days a week, after an onboarding period of 2 months. Interns and work-study students are limited to 1 day a week, to keep in touch with their mentor.
  sources:
  - teletravail
  audience: all
  sha256: 65d149131f4d386c571c5b9bdaaa37fce717b636716d78051aee052f5b6165f7
  text: '# Remote work agreement


    Any employee on a permanent contract may work remotely up to 3 days a week, after an onboarding period of 2 months. Interns and work-study students are limited to 1 day a week, to keep in touch with their mentor.


    ## Key facts

    - A manager may request exceptional attendance with 48 hours'' notice.

    - Exemplia pays an allowance of €2.50 per day worked remotely, up to 55 euros a month.

    - Equipment is provided on request: a 27-inch screen, a keyboard, a mouse and a headset.

    - Remote work from abroad is limited to 20 days per calendar year, with the written agreement of the manager and of the human resources department, for tax and social security reasons.


