  sha256: 4ab4fa14f9aef623ba4630901bde754624a1dc9360b86a68ce29f6ffbc08b5fa
  text: '# Email change note


    This note explains the move from version 1 to version 2 of the email charter, effective since 1 January 2026. Exemplia changed its email provider on 1 January 2026, after a tender run in 2025.


    ## Key facts

    - This change led to the revision of the email charter, from its version 1 to its version 2.

    - First, the maximum size of a message rises from 10 Mo to 25 Mo.

    - Second, the retention period in the main mailbox rises from 1 year to 3 years, to meet a new regulatory obligation of the sector.

    - The migration of mailboxes took place over three weekends in December 2025, with no message loss reported.


    ## Concepts

