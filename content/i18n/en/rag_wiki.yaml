- id: source/mots_de_passe
  kind: source
  title_text: Password policy
  synthesis_text: 'At Exemplia, a user account password has at least 14 characters. Length matters more than complexity: a passphrase of four or five unrelated words is recommended, for example a series of randomly drawn words separated by hyphens.'
  sources:
  - mots_de_passe
  audience: all
  sha256: 9f328e849cd6992a3165c5dc20cf0828dd800542954a2c2567b4c8174175532c
  text: '# Password policy


    At Exemplia, a user account password has at least 14 characters. Length matters more than complexity: a passphrase of four or five unrelated words is recommended, for example a series of randomly drawn words separated by hyphens.


    ## Key facts

    - Administration accounts, for their part, require at least 20 characters, and their password is generated by the operations team''s vault.

    - In these cases, the change must take place within 12 hours of the security team''s alert.

    - After 5 failed login attempts, an account is locked for 15 minutes.

    - On the third lockout in the same day, the account stays blocked until the support desk steps in, reachable on extension 3100.


    ## Concepts

