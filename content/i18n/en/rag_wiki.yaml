  title_text: Information classification
  synthesis_text: 'All information produced or received by Exemplia carries one of the following 4 classification levels: Public, Internal, Confidential and Secret. By default, an unmarked document is treated as Internal.'
  sources:
  - classification
  audience: all
  sha256: 1857640dcb1cb56f51887fa70150dd3655c5d86d7f0bb4f98e53315bbb5664af
  text: '# Information classification


    All information produced or received by Exemplia carries one of the following 4 classification levels: Public, Internal, Confidential and Secret. By default, an unmarked document is treated as Internal.


    ## Key facts

    - A Confidential document leaves Exemplia''s network only encrypted, through the secure sharing tool Transvault; the sharing link expires after 7 days.

    - Confidential and Secret paper documents are stored in a locked cabinet and destroyed with a level P-5 shredder.

    - Every year, in January, the head of each department reviews the classification of the 20 most consulted documents in their scope.


