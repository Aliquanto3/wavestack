  text: '# Disciplinary procedure


    This document describes the steps of a disciplinary procedure at Exemplia; it is classed confidential and its access is reserved to human resources, management and, for a file concerning them, the employee themselves. A behavioural issue or a breach leads, depending on its severity, to one of these…


    ## Key facts

    - The meeting is called in writing at least 5 working days before its date, with the reason for the meeting.

    - The decision is notified in writing within 10 working days after the meeting, with the internal appeal routes.

    - A written warning stays on file for 3 years; past that delay, it is no longer taken into account for a later measure, unless the same breach recurs before it is erased.

    - An employee''s full disciplinary file is kept for 5 years after they leave Exemplia, then anonymised, in line with the personal data retention policy.


