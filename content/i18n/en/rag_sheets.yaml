      - id: generation
        class: depends_on_provider
      - id: judge
        class: depends_on_provider
      - id: trace_export
        class: depends_on_provider
    copies:
      level: high
      text: 'The wiki pages rewrite the sources and cite each other: a piece of information can live in several pages in different forms.'
    erasure:
      level: high
      text: The touched pages must be recompiled, then the wiki check run to make sure nothing survives in the pages that cite them.
      demo: rag-erasure-card
    rights:
