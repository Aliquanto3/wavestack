# Overlay of content/rag_sheets.yaml: same ids, levels, classes, demos, stories, hypotheses and URLs; only the texts differ.

texts:
  title_text: Component and architecture sheets
  hint_text: 'For each component or architecture: what it is for, what it costs, what the literature says, and for an architecture its compliance risks on seven axes.'
  banner_text: Educational grid, not legal advice; to be reviewed with your organisation's legal counsel or DPO.
  levels_note_text: 'Exposure levels: proposal, to be reviewed.'
  level_hint_text: 'The level states an exposure (low: little exposed, high: very exposed), never a compliance verdict.'
  bench_empty_text: Not measured yet
  upcoming_text: architecture coming to the workshop (story {story})
  pending_text: 'Sheets to come (story 19b): {kinds}'
  components_title_text: Components
  architectures_title_text: Architectures
  list_label_text: Available sheets
  error_text: Sheet unavailable.
  sources_title_text: Sources
  compliance_title_text: Compliance sheet
  places_title_text: Places to rebuild in order to erase
  update_title_text: To put the copies back in order
  update_unmeasured_text: Duration and cost not measured yet.
  components_located_text: Components and where the data goes
  no_level_text: no level (questions to ask)
  before_yes_text: A check before the search is possible for this architecture.
  before_no_text: A check before the search is hard for this architecture.
  blocks:
    purpose: What it is for
    when: When to use or avoid it
    cost: What it costs (build, update, query)
    literature: What the literature says
    bench: What the bench measured
  axes:
