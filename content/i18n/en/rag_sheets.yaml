- id: crag
  story: 12
  hypotheses:
  - H7
  - H12
  purpose_text: After a hybrid search, judge each passage; if the passages are not enough, rewrite the question and search again, or answer "I don't know".
  when_text: 'Use it when a wrong answer is costly and a refusal is preferred. Avoid it if the decision model lets unsupported claims through: the filter reassures wrongly.'
  cost_text: 'Build: the hybrid RAG''s. Update: the hybrid RAG''s. Query: the hybrid search, one judgement per passage, then if needed a rewrite and a second search.'
  literature_text: 'H7 (a decision model replaces LLM judges without loss): not demonstrated. H12 (derived architectures complicate erasure and access rights, and widen the attack surface): partially supported.'
  bench_text: ''
  sources:
  - label_text: Towards AI
    url: https://pub.towardsai.net/jev-as-a-judge-for-rag-claim-verification-7b356619814c
  - label_text: arXiv 2508.04276
    url: https://arxiv.org/abs/2508.04276
  - label_text: Microsoft Research
    url: https://www.microsoft.com/en-us/research/publication/enterprise-ai-must-enforce-participant-aware-access-control
  axes:
    location:
      level: low
      text: 'Documents and indexes run inside the workshop. Jev, the decision model mentioned, is proprietary with no local hosting: calling it sends the passages to its provider. Generation can also go to a provider.'
      components:
      - id: documents
        class: local
      - id: index
        class: local
      - id: generation
        class: depends_on_provider
      - id: judge
        class: depends_on_provider
      - id: trace_export
        class: depends_on_provider
    copies:
      level: mid
      text: The same copies as hybrid, plus the judgement kept for each passage in the run.
    erasure:
      level: mid
      text: 'Hybrid RAG''s: remove the passages from the store and the BM25 index. The judge keeps nothing between two queries.'
      demo: rag-erasure-card
    rights:
      level: mid
      text: 'The judge reads the passages before deciding: without a check before the search, it reads forbidden passages. The filter must stay upstream of the search.'
      demo: rag-access-card
      before_search: true
    injection:
      level: mid
      text: A booby-trapped passage is read by the judge too, which can be influenced; the fallback (rewrite, new search) gives the booby-trapped text a second chance to come back.
