  summary_text: 'UK visitor badges ; Physical access to premises ; Lyon site business continuity plan (French-only document) : Every visitor to the Manchester office receives a dated visitor badge at reception, after showing a photo ID and signing the visitor register. A visitor badge is valid only for the day it is issued and the specific floor stated on it. Every visitor receives a temporary badge at reception,…'
  sha256: fb4cd5c0e1221407ec02abd673f91412b4f863ea754046aa95cec3fce22a9a62
- id: access-rights
  entities: [access-rights, reviews, rights, rights-review]
  audience: all
  sources: [revue_habilitations, acces_physique, formation_securite, classification, donnees_personnelles, ia_generative]
  summary_text: 'Access rights review ; Physical access to premises ; Security training : Every access, badge accepted or refused, is logged and kept for 6 months, consulted during a security investigation or an access rights review. Every manager reviews, each quarter, the list of access rights of their team: they confirm those still needed and flag those to withdraw, for example after a role change. An employee…'
  sha256: 4e4b948c1e46e66ddca6d87adc6db75034e4ed976c24bd14e399490aa58b9039
