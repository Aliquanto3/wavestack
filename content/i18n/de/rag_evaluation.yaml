traps:
- id: two_judges
  kind: two_judges
  question_id: q_fact_badge
  criterion: faithfulness
  title_text: Zwei Richter, zwei Urteile
  explain_text: 'Gleiche Frage, gleiche Antwort: Der lokale Richter hält sie für treu, der Cloud-Richter
    nicht. Jeder hat seine Begründung, beide sind plausibel.'
  answer_text: Der Ausweis wird innerhalb einer Woche deaktiviert.
  verdicts:
    local:
      verdict: 'yes'
      why_text: 'Die Antwort bleibt im Thema des Kontexts: ein nach dem Weggang deaktivierter Ausweis.'
    cloud:
      verdict: 'no'
      why_text: Der Kontext sagt nichts von einer Woche; die gelieferte Regel lautet 24 Stunden, die Dauer
        ist also erfunden.
- id: variance
  kind: variance
  question_id: q_temporal_taille
  criterion: accuracy
  title_text: Varianz desselben Richters
  explain_text: 'Derselbe Richter, derselbe Fall, zweimal: zwei Urteile. Am Fall hat sich nichts geändert;
    Temperatur und Passagenreihenfolge genügen.'
  answer_text: Ein Anhang darf 10 MB nicht überschreiten.
  causes:
  - temperature
  - passage_order
  passes:
  - verdict: 'yes'
    why_text: Die Antwort nennt eine Anhangsgröße, wie erwartet.
  - verdict: 'no'
    why_text: Die genannte Größe, 10 MB, stammt aus der alten Version, nicht die erwarteten 25 MB.
- id: two_tools
  kind: two_tools
  question_id: q_multi_crise
  title_text: Zwei Werkzeuge, zwei Definitionen
  explain_text: '„Treue“ hat keine einheitliche Definition: Ragas zählt die gestützten Aussagen, DeepEval
    die nicht widerlegten. Bei derselben Antwort unterscheiden sich die Werte; sie werden hier aus denselben
    etikettierten Aussagen neu berechnet.'
  answer_text: Rufen Sie die einheitliche Bereitschaftsnummer 06 07 08 09 10 zu jeder Zeit an. Die Bereitschaft
    antwortet innerhalb von 30 Minuten. Sie untersteht der Finanzabteilung.
  claims:
  - text: Es gibt eine einheitliche Bereitschaftsnummer.
    label: supported
  - text: Diese Nummer ist 06 07 08 09 10.
    label: supported
  - text: Man kann sie zu jeder Zeit anrufen.
    label: supported
  - text: Die Bereitschaft antwortet innerhalb von 30 Minuten.
    label: unsupported
  - text: Die Bereitschaft untersteht der Finanzabteilung.
    label: contradicted
