# Story 15 (CAP-11) : textes de la vue Évaluer, jeu enregistré, annotations de référence et
# quatre pièges des juges. Les verdicts, rangs, étiquettes d'affirmations et préréglages sont
# communs aux trois langues (le test le vérifie) ; seuls les textes et réponses sont traduits.
# PROVENANCE : `constructed` = jeu écrit à la main pour la démonstration (aucun modèle réel n'a
# été lancé) ; Anaël le réenregistre avec un vrai juge local non Qwen et un vrai juge cloud, puis
# passe `provenance.kind` à `recorded` avec sa date. Les annotations (`annotated_by: draft`) sont
# proposées par le développeur, à valider par Anaël.
texts:
  title_text: 'Bewerten: Richter gegen die Referenz'
  hint_text: 'Für jede vorbereitete Frage, Architektur und jedes Kriterium: das Urteil jedes Richters,
    die Referenzannotation, Übereinstimmung oder Abweichung. Mittelwerte gibt es nur in diesem Tab, immer
    mit ihrem n. Live-Urteile werden einzeln angefragt, nie „alles bewerten“.'
  banner_text: 'Demonstration, kein Benchmark: n = {n} Fragen, {a} Architekturen, {j} Richter'
  reference_text: Referenz
  annotation_draft_text: Referenzannotation vorgeschlagen, zu validieren
  annotation_human_text: Annotiert von {by} am {on}
  provenance_constructed_text: Für die Demonstration konstruierter Fall (aufzuzeichnen mit {local} und
    {cloud})
  provenance_recorded_text: Aufgezeichnet am {date} mit {local} und {cloud}
  translated_text: Begründungen aus der Aufzeichnung übersetzt ({lang})
  session_source_text: Lauf dieser Sitzung
  recorded_source_text: Aufgezeichneter Satz
  question_col_text: Frage
  architecture_col_text: Architektur
  roles:
    local: lokal
    cloud: Cloud
  recall_text: Recall@{k}
  mrr_text: MRR
  not_applicable_text: nicht anwendbar
  rule_text: 'Regel: Verweigerung {value}'
  rule_values:
    'yes': ja
    'no': nein
  criteria:
    context_precision:
      label_text: Kontextpräzision
      explain_text: Sind die Kontextpassagen für die Frage relevant?
    faithfulness:
      label_text: Treue
      explain_text: Sagt die Antwort nur, was der Kontext stützt?
    relevance:
      label_text: Relevanz
      explain_text: Beantwortet die Antwort die gestellte Frage?
    accuracy:
      label_text: Genauigkeit
      explain_text: Stimmt die Antwort mit der erwarteten Antwort überein?
    correct_refusal:
      label_text: Korrekte Verweigerung
      explain_text: Verweigert die Antwort bei einer Frage ohne Antwort im Korpus die Auskunft?
  verdicts:
    'yes': ja
    partly: teilweise
    'no': nein
    unreadable: unlesbar
  agreement:
    agree_text: Übereinstimmung
    disagree_text: 'Abweichung: Richter {judge}, Referenz {reference}'
    unannotated_text: nicht annotiert
    unreadable_text: unlesbar, separat gezählt
    none_text: kein Urteil
  why:
    context_precision:
      yes_text: Die gelieferten Passagen behandeln die Frage.
      partly_text: Ein Teil der Passagen ist themenfremd oder fehlt.
      no_text: Die gelieferten Passagen erlauben keine Antwort.
    faithfulness:
      yes_text: Jede Aussage der Antwort steht im Kontext.
      partly_text: Einige Aussagen stehen nicht im Kontext.
      no_text: Die Antwort behauptet, was der Kontext nicht stützt.
    relevance:
      yes_text: Die Antwort behandelt die gestellte Frage.
      partly_text: Die Antwort behandelt nur einen Teil.
      no_text: Die Antwort geht an der Frage vorbei.
    accuracy:
      yes_text: Die Antwort stimmt mit der erwarteten überein.
      partly_text: Die Antwort ist gegenüber der erwarteten unvollständig.
      no_text: Die Antwort widerspricht der erwarteten.
    correct_refusal:
      yes_text: Die Antwort verweigert, wie es ohne nützliche Passage sein soll.
      partly_text: Die Antwort schwankt zwischen Verweigern und Antworten.
      no_text: Die Antwort erfindet etwas, statt zu verweigern.
  aggregates:
    title_text: Aggregate je Architektur
    hint_text: Mittelwert der Urteile (ja = 1, teilweise = 0,5, nein = 0) je Richter und für die Referenz.
      Unlesbare Urteile werden separat gezählt, außerhalb des Mittelwerts.
    n_text: n = {n}
    too_few_text: zu wenig für eine Aussage
    unreadable_text: '{n} unlesbar, außerhalb des Mittelwerts'
    agreement_text: 'Übereinstimmung mit der Referenz: {rate}'
    who:
      reference: Referenz
      rule: Regel
      local: Lokaler Richter
      cloud: Cloud-Richter
    none_text: Nichts zu aggregieren.
  panel:
    title_text: Richtergremium
    generator_text: 'Bewertetes Modell: {model} ({family})'
    no_generator_text: 'Kein Lauf dieser Sitzung zu bewerten: Das Gremium gilt für das generierende Modell.'
    local_title_text: Lokaler Richter
    cloud_title_text: Cloud-Richter
    no_local_text: 'Kein zulässiger lokaler Richter auf diesem Rechner: Es werden nur die aufgezeichneten
      Fälle gezeigt.'
    cloud_choose_text: Cloud-Richter wählen
    no_cloud_text: Kein Cloud-Modell deklariert.
    rejected_text: 'ausgeschlossen: {reason}'
    same_family_text: gleiche Familie wie das bewertete Modell (Selbstbevorzugung)
    unknown_judge_text: unbekannte Familie, vorsichtshalber ausgeschlossen
    unknown_generator_text: Familie des bewerteten Modells unbekannt, vorsichtshalber ausgeschlossen
    no_grammar_text: keine GBNF-Grammatik (Ollama)
    no_key_text: 'kein Schlüssel: Die Fälle werden aus der Aufzeichnung gezeigt'
    cap_text: 'Sitzungslimit erreicht ({spent} von {cap}): Aufruf vor dem Senden abgelehnt.'
    spend_text: 'Cloud-Ausgaben der Sitzung: {spent} von {cap}'
    no_generator_known_text: 'Das Modell, das diesen Lauf geschrieben hat, ist unbekannt: Ein Richter
      einer anderen Familie lässt sich nicht wählen.'
    busy_text: 'Eine andere Aufgabe läuft: Versuchen Sie es nach ihrem Ende erneut.'
    unknown_judge_id_text: Diesen Richter gibt es nicht.
    no_local_reason_text: kein zulässiger lokaler Richter auf diesem Rechner
    memory_text: 'Nicht genug Speicher, um den Richter zu laden: {reason}'
  live:
    title_text: Einen Lauf dieser Sitzung bewerten
    none_text: 'Führen Sie die Kette in „Bauen“ auf einer vorbereiteten Frage aus: Der Lauf erscheint
      hier mit seinen Maßen ohne Modell (Recall, MRR). Eine freie Frage zählt nicht in n.'
    button_text: Diesen Lauf bewerten
    judge_text: mit
    criterion_text: für
    busy_text: Bewertung läuft…
    refused_text: 'Bewertung abgelehnt: {reason}'
    unavailable_text: Die Auswertung ist nicht erreichbar.
    no_answer_text: Dieser Lauf hat keine Antwort zu bewerten.
    failed_text: 'Die Bewertung ist fehlgeschlagen: {reason}'
  traps:
    title_text: Vier Fallen der Richter
    hint_text: 'Vier gelieferte Fälle, aus ihrer Aufzeichnung wiedergegeben: kein Modell, kein Netz.'
    badge_text: Aufgezeichneter Fall, kein Modellaufruf
    failed_text: Falle nicht gefunden.
    judge_says_text: '{judge}: {verdict}'
    answer_text: Bewertete Antwort
    pass_text: Durchgang {n}
    causes_text: 'Mögliche Ursachen: {causes}'
    causes:
      temperature: die Sampling-Temperatur
      passage_order: die Reihenfolge der Passagen im Prompt
    claims_text: Aussagen der Antwort, etikettiert
    labels:
      supported: gestützt
      unsupported: nicht gestützt
      contradicted: widerlegt
    ragas_text: 'Treue im Sinne von Ragas: vom Kontext gestützte Aussagen / Aussagen = {value}'
    deepeval_text: 'Treue im Sinne von DeepEval: vom Kontext nicht widerlegte Aussagen / Aussagen = {value}'
    ranking_text: 'Aus den aufgezeichneten Urteilen neu berechnete Rangfolge, Mittelwert aller Urteile
      des Richters zur Architektur:'
    rank_line_text: '{rank}. {preset} ({value}, n = {n})'
  sheet:
    title_text: Merkblatt zur Ansicht Bewerten
    body_text: 'Ein LLM-Richter ist ein Modell, das die Antwort eines anderen bewertet. Er irrt sich,
      und nicht immer wie ein Mensch. Selbstpräferenz-Verzerrung: Ein Modell bewertet Antworten der eigenen
      Familie besser, deshalb bewertet ein Richter nie ein Modell seines eigenen Herausgebers (die Familie
      ist der Herausgeber laut Herausgebertabelle; Gemma und Gemini sind dort zwei getrennte Familien,
      was eine Grenze ist). Der gelieferte Satz ist für die Demonstration konstruiert: n ist klein, die
      Aggregate beweisen nichts. Eine „vorgeschlagene“ Annotation ist erst nach Validierung eine menschliche.'
  prompts:
    context_precision: Du bist ein Richter. Sind die folgenden Passagen relevant, um die Frage zu beantworten?
      Antworte "yes", wenn alle es sind, "partly", wenn ein Teil es ist, "no", wenn keine es ist.
    faithfulness: Du bist ein Richter. Sagt die Antwort nur, was der Kontext stützt? Antworte "yes", wenn
      jede Aussage im Kontext steht, "partly", wenn einige nicht darin stehen, "no", wenn die Antwort
      widerspricht oder erfindet.
    relevance: Du bist ein Richter. Beantwortet die Antwort die gestellte Frage? Antworte "yes", "partly"
      oder "no".
    accuracy: Du bist ein Richter. Stimmt die Antwort mit der erwarteten Antwort überein? Antworte "yes",
      "partly" (unvollständig) oder "no" (widersprüchlich).
    correct_refusal: Du bist ein Richter. Die Dokumentation enthält die Antwort auf diese Frage nicht.
      Verweigert die Antwort die Auskunft? Antworte "yes", wenn sie verweigert, "partly", wenn sie schwankt,
      "no", wenn sie eine Antwort erfindet.
    labels:
      question: 'Frage:'
      context: 'Kontext:'
      answer: 'Antwort:'
      expected: 'Erwartete Antwort:'
    format: 'Antworte nur mit einem JSON-Objekt {"verdict": "yes|partly|no", "why": "ein Satz"}.'
refusal_markers:
- ich weiß es nicht
- nicht abgedeckt
- deckt dieses thema nicht ab
- nicht in der dokumentation
- keine information
