# German translation of content/memory/memory.yaml (languages 1/5, AD-19): same fields,
# same `{max_chars}` placeholder, as many demonstration entries (fictitious, NFR-11).
file_label_text: Globales Gedächtnis

intro: >-
  Globales Gedächtnis: Informationen aus früheren Unterhaltungen mit dem Benutzer.
  Berücksichtige sie, wenn sie nützlich sind, ohne sie zu wiederholen.

remember:
  label_text: Schreiben ins Gedächtnis
  description: >-
    Merkt sich eine dauerhafte Information über den Benutzer (Vorliebe, Vorname,
    Arbeitskontext) für die nächsten Unterhaltungen. Rufe dieses Tool auf, wenn der Benutzer
    darum bittet, sich etwas zu merken. Speichere darin niemals ein Geheimnis: Passwort,
    Schlüssel, sensible oder vertrauliche personenbezogene Daten.
  text: Die zu merkende Information, in einem kurzen, eigenständigen Satz.

drawer:
  empty_text: >-
    Keine Information im globalen Gedächtnis. Das Modell kann welche schreiben.
  empty_no_parser_text: >-
    Keine Information im globalen Gedächtnis. Das aktive Modell kann keine Tools aufrufen:
    Es kann keine schreiben.

demo:
  - Der Benutzer heißt Pascal.
  - Pascal ist Berater für Cybersicherheit.
  - Pascal bereitet eine Schulung über KI-Agenten vor.
