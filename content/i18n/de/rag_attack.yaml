  guard_missing_text: "Injektions-Leitplanke in dieser Sitzung nicht geladen: Ein aufgezeichnetes Urteil steht neben dem fehlenden. Die Karte lädt das Modell nie und lädt es nie herunter."
  guard_link_text: "Baustein Leitplanken öffnen"
