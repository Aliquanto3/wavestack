    constructed_text: "für die Demonstration konstruierter Fall (aufzuzeichnen mit {model})"
    recorded_text: "aufgezeichnet am {date} mit {model}"
  limits_title_text: "Was Leitplanken nicht sehen"
  limits:
    - "Prompt Guard 2 sucht die Form einer Injektion (eine an ein Modell gerichtete Anweisung), nicht die Wahrheit eines Satzes."
    - "Der Angreifer nähert seinen Text der anvisierten Frage an, mit ihren Wörtern: Genau das lässt ihn im Top-k aufsteigen. Die Injektions-Passage dieses Korpus wurde so geschrieben."
    - "Markieren hindert das Modell nicht am Lesen: Nur das Entfernen der Passage aus dem Kontext tut das."
  poisoning:
    limit_text: "Keine inhaltliche Leitplanke erkennt diese Behauptung: Es ist ein gewöhnlicher Satz, die falsche Passage kommt durch, selbst im Modus Blockieren, und die Antwort bleibt falsch."
    helps_title_text: "Was hilft, mit seinen Grenzen"
    helps:
      - "Verankerungsprüfung (CAP-6): vergleicht die Antwort mit den gelesenen Passagen; sie sieht nicht, dass eine gelesene Passage falsch ist, die Antwort ist ihr treu."
      - "Vielfalt der Quellen: mehrere unabhängige Dokumente verlangen; die falsche Behauptung steht dann allein gegen die legitime Passage, aber zwei Quellen, die sich auf eine Unwahrheit einigen, schlagen sie."
