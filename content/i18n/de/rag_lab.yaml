# Lot 5a: the lines of the sequence. The technical name is the same in the three languages;
# the action and the explanation are in the page's language. Without `explain_text`, the
# focus takes its chain stage's.
steps:
  documents:
    label_text: "Documents"
    action_text: "Den Korpus laden"
    explain_text: >-
      Der Korpus, den das RAG durchsuchbar macht: die Dokumente eines fiktiven Unternehmens,
      Exemplia. Er ändert sich von einer Frage zur nächsten nicht; deshalb geschieht die ganze
      Arbeit an ihm einmal, vor den Fragen: Das ist die Indexierung.
  chunking:
    label_text: "Chunking"
    action_text: "Die Dokumente in Chunks zerlegen"
  embed_passages:
    label_text: "Embedding"
    action_text: "Jeden Chunk vektorisieren"
    explain_text: >-
      Das Embedding-Modell wandelt jeden Chunk in einen Zahlenvektor um. Zwei Texte mit
      ähnlicher Bedeutung ergeben nahe Vektoren, auch ohne gemeinsames Wort. Das wird einmal
      berechnet: Die Vektoren des Index des RAG-Bausteins werden neu gelesen, nicht neu
      berechnet. Jedes angebotene Modell hat seinen eigenen Vektor-Cache. Ein Chunk, der länger
      ist, als das Modell auf einmal liest (max_tokens), wird gekürzt: Der Schritt sagt, wie
      viele.
  vector_store:
    label_text: "Indexing"
    action_text: "Die Vektoren im Vector Store ablegen"
  lexical_index:
    label_text: "Lexical indexing"
    action_text: "Den lexikalischen Index (BM25) der Chunks aufbauen"
    explain_text: >-
      BM25 hat kein gelerntes Modell: Es ist ein statistischer Algorithmus. Bei der Indexierung
      zerlegt er jeden Chunk in Begriffe (Groß-/Kleinschreibung, Akzente und Füllwörter
      ignoriert, Kürzel bleiben), zählt, wie oft jeder Begriff darin vorkommt, und die Länge
      des Chunks, dann für jeden Begriff, wie
      viele Chunks ihn enthalten (seine Dokumenthäufigkeit): Das ist der invertierte Index, wie
      bei einer Suchmaschine (Elasticsearch, Lucene). Bei jeder Frage liest BM25 diese
      Zählungen erneut, statt den Text zu durchlaufen. Die Werkstatt baut diesen Index bei jeder
      Ausführung neu auf (das geht schnell); eine Suchmaschine hält ihn auf der Festplatte.
  question:
    label_text: "Frage"
    action_text: "Die Frage empfangen"
    explain_text: >-
      Die in natürlicher Sprache gestellte Frage. Sie geht zum Embedding für eine Suche nach
      Bedeutung, unverändert zu BM25, falls die Kette eines hat, und landet schließlich im
      Prompt des Modells.
  embed_query:
    label_text: "Embedding"
    action_text: "Die Frage vektorisieren"
    explain_text: >-
      Dasselbe Embedding-Modell wandelt die Frage in einen Vektor um. Es muss dasselbe sein wie
      für die Chunks: Zwei verschiedene Modelle ordnen Bedeutungen nicht im selben Raum an, ihre
      Vektoren lassen sich nicht vergleichen.
  vector_search:
    label_text: "Dense retrieval"
    action_text: "Die nächstgelegenen Chunks suchen"
  lexical_search:
    label_text: "BM25"
    action_text: "Nach Schlüsselwörtern suchen"
  fusion:
    label_text: "Fusion (RRF)"
    action_text: "Die beiden Rankings zusammenführen"
  rerank:
    label_text: "Reranking"
    action_text: "Die Kandidaten neu ordnen"
  context:
    label_text: "Prompt augmentation"
    action_text: "Den Prompt mit den behaltenen Chunks bauen"
  generation:
    label_text: "Generation"
    action_text: "Die Antwort generieren"
  query:
    label_text: "Query understanding"
    action_text: "Die zu suchenden Anfragen erzeugen"
    note_text: "Die Werkstatt hat kein Gespräch: Die Nachfrage liest die früher in dieser Sitzung gestellten Fragen (höchstens drei)."
  cache_prefix:
    label_text: "Prefix caching"
    action_text: "Die Anweisung und den ganzen Korpus im Speicher des Modells halten"
    explain_text: >-
      CAG wertet den Anfang des Prompts einmal aus (die Anweisung und den ganzen Korpus) und
      behält den daraus entstehenden Zustand des Modells. Bei jeder Frage wird dieser Zustand
      wieder in den Speicher gelegt: Das Modell liest nur noch die Frage. Dieses Präfix ist ein
      Schnitt in Tokens des gesendeten Prompts, bis zum letzten Zeilenende vor der Frage. Jede
      Aktualisierung des Korpus lädt es vollständig neu, und der Zustand belegt Speicher,
      solange er behalten wird.
  # V1.2 story 11: PageIndex's tree built once, gone down at each question; the agent's calls.
  tree_build:
    label_text: "Tree building"
    action_text: "Den Abschnittsbaum der Dokumente aufbauen"
    explain_text: "PageIndex baut einmal einen Baum des Korpus: die Wurzel, ein Knoten je Dokument, einer je Abschnitt, jeder mit Titel und kurzer Zusammenfassung. Der mitgelieferte Baum ist nach einer Regel berechnet, ohne Modell; „Neu aufbauen“ lässt das aktive Modell die Zusammenfassungen schreiben. Die Aktualisierung eines Dokuments berechnet nur seinen Teilbaum neu."
  agent_calls:
    label_text: "Tool calls"
    action_text: "Das Modell wählt eine Aktion, das Werkzeug liest sie im Korpus"
    explain_text: "In jeder Runde antwortet das Modell mit einer Zeile ACTION: list_files, grep <Wörter>, read_file <Name> oder ANSWER. Die Werkzeuge lesen die Arbeitskopie im Speicher, nie die Festplatte: Ein Name außerhalb des Korpus wird abgelehnt und dem Modell gesagt. Jedes Werkzeugergebnis wird ein Element des Kontexts. Die Schleife endet bei ANSWER, in der 6. Runde oder nach zwei unlesbaren Antworten."
  tree_levels:
    label_text: "Tree descent"
    action_text: "Das Modell wählt Ebene für Ebene die zu öffnenden Knoten"
    explain_text: "Auf jeder Ebene liest das Modell die nummerierte Liste der Kinder der behaltenen Knoten (Titel und Zusammenfassung) und antwortet CHOICE: 3, 7 (höchstens zwei) oder CHOICE: NONE. Ein Aufruf je Ebene: zwei beim mitgelieferten Korpus (die Dokumente, dann die Abschnitte). Der ganze Text der erreichten Abschnitte wird der Kontext."
  # V1.2 story 8 (CAP-6): System One's lines, in the chain's order.
  router:
    label_text: "Strategy router"
    action_text: "Die Suchstrategie der Frage wählen"
  passage_filter:
    label_text: "Passage filter"
    action_text: "Jede Passage behalten oder verwerfen"
  grounding_check:
    label_text: "Grounding check"
    action_text: "Die Verankerung jedes Satzes der Antwort prüfen"
  # V1.2 story 13: GraphRAG's graph built once, then queried at each question.
  graph_build:
    label_text: "Graph building"
    action_text: "Den Graphen der Entitäten, ihrer Beziehungen und ihrer Communities aufbauen"
    explain_text: "GraphRAG baut einmal einen Wissensgraphen: die Entitäten des Korpus, ihre Beziehungen, ihre zusammengefassten Communities; jede Entität und Beziehung behält ihre Belege (die Passage und ihren Fingerabdruck). Der mitgelieferte Graph ist per Regel berechnet, ohne Modell (Schlüsselbegriffe, Abkürzungen, Codes, gemeinsames Vorkommen in einem Satz); « Neu aufbauen » lässt ihn vom aktiven Modell extrahieren, ein Aufruf pro Passage, dann einer pro Community. Eine Dokumentaktualisierung wiederholt seine Extraktion, die Zusammenführung, die Communities und nur die betroffenen Zusammenfassungen."
  graph_query:
    label_text: "Graph query"
    action_text: "Das Modell nennt die Entitäten der Frage oder liest die nächsten Communities"
    explain_text: "Im lokalen Modus liefert ein Aufruf die Entitäten der Frage (ENTITIES: a, b); der Graph verbindet sie mit ihren Nachbarn einen Schritt entfernt, und die Belegpassagen dieser Beziehungen werden zum Kontext. Im globalen Modus durchlaufen die drei der Frage nächsten Communities je einen « map »-Aufruf (POINTS: … oder POINTS: NONE); die Generierung übernimmt das « reduce ». Keine Zielgruppe wird gefiltert: Jedes Element nennt seine eigene."

