# Lot 5b: die fertigen Architekturen; eine anwenden ersetzt nur das Retrieval-Segment, seine
# Schritte mit den ausgelieferten Einstellungen. Die Erklärung ist der Tooltip.
presets:
  dense:
    label_text: "Dense-RAG"
    explain_text: >-
      Eine einzige Suche nach der Bedeutung (Dense retrieval): das einfachste RAG. Schnell, aber
      es kann ein Kürzel oder eine genaue Zahl verfehlen.
  hybrid:
    label_text: "Hybrides RAG (BM25 + dense)"
    explain_text: >-
      Eine Suche nach der Bedeutung (Dense retrieval) und eine nach Stichwörtern (BM25), dann
      die Fusion (RRF) ihrer beiden Rangfolgen: das genaue Kürzel und die Umschreibung werden
      beide gefunden. Zwei Suchen statt einer: langsamer als Dense-RAG. Ein Reranking lässt
      sich von Hand nach der Fusion hinzufügen.
  rerank:
    label_text: "RAG + Reranking"
    explain_text: >-
      Das Dense retrieval behält Kandidaten, dann liest der Reranker sie mit der Frage erneut
      und ordnet sie neu: genauer, langsamer. Nur das Retrieval-Segment kehrt zu dem der
      ausgelieferten Kette zurück: Ihre Einstellungen für Chunking, Embedding, Vector store und
      Prompt bleiben erhalten.
  long_context:
    label_text: "Langer Kontext"
    explain_text: >-
      Kein Index, keine Suche: Der ganze Korpus kommt bei jeder Frage in den Prompt. Nichts
      aufzubauen oder zu aktualisieren, aber jede Anfrage liest den ganzen Korpus erneut. Es
      braucht ein Fenster von 16.384 Tokens.
  cag:
    label_text: "CAG (Cache des Modells)"
    explain_text: >-
      Kein Index, keine Suche: Der Korpus wird einmal ausgewertet und im Speicher des lokalen
      Modells behalten; jede Anfrage wertet nur die Frage aus. Jede Aktualisierung lädt das
      ganze Präfix neu. Es braucht ein lokales Modell und ein Fenster von 16.384 Tokens.
  agentic:
    label_text: "Agentische Suche"
    explain_text: >-
      Kein Index: Das Modell durchsucht den Korpus selbst mit drei Werkzeugen (auflisten, Wörter
      suchen, ein Dokument lesen), eine Aktion je Runde, bis zu sechs. Nichts aufzubauen oder
      zu aktualisieren, aber mehrere Modellaufrufe bei jeder Anfrage.
  pageindex:
    label_text: "PageIndex"
    explain_text: >-
      Keine Vektoren: ein Baum der Dokumente und ihrer Abschnitte, einmal aufgebaut, den das
      Modell Ebene für Ebene hinabsteigt und dabei Titel und Zusammenfassungen liest. Ein Baum
      zum Aufbauen und bei jeder Aktualisierung neu, wenige Aufrufe je Anfrage.
  graphrag:
    label_text: "GraphRAG"
    explain_text: >-
      Keine Vektoren: ein Graph der Entitäten des Korpus, ihrer Beziehungen und ihrer
      zusammengefassten Communities, einmal aufgebaut. Lokal nennt das Modell die Entitäten der
      Frage und liest die Belege ihrer Nachbarn; global liest es die nächsten Communities. Teuer
      im Aufbau und in der Aktualisierung mit einem Modell, mehrere Aufrufe je Anfrage.
