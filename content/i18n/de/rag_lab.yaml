# Lot 5a: the lines of the sequence. The technical name is the same in the three languages;
# the action and the explanation are in the page's language. Without `explain_text`, the
# focus takes its chain stage's.
steps:
  documents:
    label_text: "Documents"
    action_text: "Den Korpus laden"
    explain_text: >-
      Der Korpus, den das RAG durchsuchbar macht: die Dokumente eines fiktiven Unternehmens,
      Exemplia. Er ändert sich von einer Frage zur nächsten nicht; deshalb geschieht die ganze
      Arbeit an ihm einmal, vor den Fragen: Das ist die Indexierung.
  chunking:
    label_text: "Chunking"
    action_text: "Die Dokumente in Chunks zerlegen"
  embed_passages:
    label_text: "Embedding"
    action_text: "Jeden Chunk vektorisieren"
    explain_text: >-
      Das Embedding-Modell wandelt jeden Chunk in einen Zahlenvektor um. Zwei Texte mit
      ähnlicher Bedeutung ergeben nahe Vektoren, auch ohne gemeinsames Wort. Das wird einmal
      berechnet: Die Vektoren des Index des RAG-Bausteins werden neu gelesen, nicht neu
      berechnet. Jedes angebotene Modell hat seinen eigenen Vektor-Cache. Ein Chunk, der länger
      ist, als das Modell auf einmal liest (max_tokens), wird gekürzt: Der Schritt sagt, wie
      viele.
  vector_store:
    label_text: "Indexing"
    action_text: "Die Vektoren im Vector Store ablegen"
  lexical_index:
    label_text: "Lexical indexing"
    action_text: "Den lexikalischen Index (BM25) der Chunks aufbauen"
    explain_text: >-
      BM25 hat kein gelerntes Modell: Es ist ein statistischer Algorithmus. Bei der Indexierung
      zerlegt er jeden Chunk in Begriffe (Groß-/Kleinschreibung, Akzente und Füllwörter
      ignoriert, Kürzel bleiben), zählt, wie oft jeder Begriff darin vorkommt, und die Länge
      des Chunks, dann für jeden Begriff, wie
      viele Chunks ihn enthalten (seine Dokumenthäufigkeit): Das ist der invertierte Index, wie
      bei einer Suchmaschine (Elasticsearch, Lucene). Bei jeder Frage liest BM25 diese
      Zählungen erneut, statt den Text zu durchlaufen. Die Werkstatt baut diesen Index bei jeder
      Ausführung neu auf (das geht schnell); eine Suchmaschine hält ihn auf der Festplatte.
  question:
    label_text: "Frage"
    action_text: "Die Frage empfangen"
    explain_text: >-
      Die in natürlicher Sprache gestellte Frage. Sie geht zum Embedding für eine Suche nach
      Bedeutung, unverändert zu BM25, falls die Kette eines hat, und landet schließlich im
      Prompt des Modells.
  embed_query:
    label_text: "Embedding"
    action_text: "Die Frage vektorisieren"
    explain_text: >-
      Dasselbe Embedding-Modell wandelt die Frage in einen Vektor um. Es muss dasselbe sein wie
      für die Chunks: Zwei verschiedene Modelle ordnen Bedeutungen nicht im selben Raum an, ihre
      Vektoren lassen sich nicht vergleichen.
  vector_search:
    label_text: "Dense retrieval"
    action_text: "Die nächstgelegenen Chunks suchen"
  lexical_search:
    label_text: "BM25"
    action_text: "Nach Schlüsselwörtern suchen"
  fusion:
    label_text: "Fusion (RRF)"
    action_text: "Die beiden Rankings zusammenführen"
  rerank:
    label_text: "Reranking"
    action_text: "Die Kandidaten neu ordnen"
  context:
    label_text: "Prompt augmentation"
    action_text: "Den Prompt mit den behaltenen Chunks bauen"
  generation:
    label_text: "Generation"
    action_text: "Die Antwort generieren"
  query:
    label_text: "Query understanding"
    action_text: "Die zu suchenden Anfragen erzeugen"
    note_text: "Die Werkstatt hat kein Gespräch: Die Nachfrage liest die früher in dieser Sitzung gestellten Fragen (höchstens drei)."

