# German translation of content/rag_lab.yaml (languages 4/5, AD-19): same keys, same stage,
# option and param ids, same placeholders.

title_text: "Werkstatt Dokumentensuche: die Suchmaschinen-Architektur zum Ausprobieren"
intro_text: >-
  Ein RAG (Retrieval-Augmented Generation: Das Modell antwortet anhand von Passagen, die in
  Dokumenten gefunden wurden) arbeitet in zwei Phasen. Die Indexierung (Build) zerlegt den
  Korpus, die Gesamtheit der zu durchsuchenden Dokumente, ein für alle Mal in Chunks (Stücke
  von einigen Absätzen) und legt ihre Vektoren (Listen von Zahlen, die den Sinn eines Textes
  zusammenfassen) in einem Vector Store ab (eine Datenbank, die die nächstgelegenen Vektoren
  schnell findet). Die Anfrage (Run) sucht darin bei jeder Frage die nützlichen Chunks und
  setzt sie in den Prompt des Modells. Starten Sie die Kette mit einer Frage, um zu sehen,
  was jeder Schritt erhält, was er erzeugt und was er kostet. Das ist eine Spielwiese: Der
  RAG-Baustein der Werkstatt ändert sich nicht.
busy_text: "Derzeit nicht verfügbar: {raison}"

chain_title_text: "Die RAG-Kette, Schritt für Schritt"
chain_help_text: >-
  Die Sequenz der Schritte, die Komponenten, die sie anspricht, und der Fokus auf dem gewählten
  Schritt. Im Modus Abspielen erscheinen die Schritte und ihre Komponenten nacheinander, von
  Hand (◀ ▶) oder im Lauf einer Ausführung. Im Modus Zusammenstellen lassen sich die Schritte des Retrieval-Segments
  (Dense retrieval: Suche nach dem Sinn; BM25: Suche nach Schlüsselwörtern; Fusion der
  beiden Ranglisten; Reranking: neue Sortierung durch ein zweites Modell) entfernen, hinzufügen und verschieben; die
  Generation sendet den erweiterten Prompt an das aktive Modell der Werkstatt, oder generiert
  nichts, wenn Sie es so wählen.

