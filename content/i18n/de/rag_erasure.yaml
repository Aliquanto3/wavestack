    label_text: "Langer Kontext, ohne Suche"
    update_text: "keine Kopie des Korpus neu aufzubauen, außer dem zwischengespeicherten Präfix, das neu geladen wird."
  - id: cag
    available: false
    story: 10
    label_text: "CAG"
    update_text: "den ganzen Cache des Modells neu laden, weil das Präfix das Dokument enthält."
  - id: agentic
    available: false
    story: 11
    label_text: "Agentische Suche"
    update_text: "keine: die Quelle wird bei jeder Anfrage neu gelesen."
  - id: pageindex
    available: false
    story: 11
    label_text: "PageIndex"
    update_text: "den Baum des geänderten Dokuments und seiner Abschnitte neu berechnen."
  - id: raptor
    available: false
    story: 12
    label_text: "RAPTOR"
    update_text: "die Zusammenfassungen der betroffenen Zweige neu erstellen, dann die, die sie zusammenfassen."
  - id: graphrag
    available: false
    story: 13
    label_text: "Vereinfachtes GraphRAG"
    update_text: "Entitäten neu extrahieren, zusammenführen, dann Gemeinschaften und ihre Zusammenfassungen neu berechnen."
  - id: llm_wiki
    available: false
    story: 14
    label_text: "LLM-Wiki"
    update_text: "die betroffenen Seiten neu kompilieren, dann die Prüfung des Wikis durchlaufen."
  - id: crag
    available: false
    story: 12
    label_text: "Corrective RAG"
    update_text: "die des hybriden RAG: die Passagen aus dem Speicher und dem BM25-Index entfernen."

