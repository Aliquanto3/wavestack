    available: true
    label_text: "Dichtes RAG"
    update_text: "die Passagen des Dokuments per Kennung aus dem Speicher entfernen; der Vektor geht mit seiner Passage."
  - id: hybrid
    available: true
    label_text: "Hybrides RAG"
    update_text: "die Passagen aus dem Speicher und dem BM25-Index entfernen, per Dokumentkennung."
  - id: rerank
    available: true
    label_text: "RAG mit Reranking"
    update_text: "die Passagen per Kennung aus dem Speicher entfernen; das Reranking behält nichts."
