# V1.2 story 18 (CAP-14), Reiter Angreifen, Karte "Löschung": Texte, Architekturen, Orte, an denen
# die Sentinel überlebt, und konstruierte Inhalte der Ableitungen, die noch nicht existieren. IDs,
# Löschmodi, Herkunft und Stories sind in den drei Sprachen gleich; nur die Texte unterscheiden sich.
#
# Der Code ORN-7731-QZ ist fiktiv (ausgelieferter Text des Sentinel-Dokuments). Ein "gemessener" Ort
# wird hier ohne Modell nachgebaut; ein "konstruierter" Ort ist für die Demonstration geschrieben,
# als illustrativ markiert, mit der Story, die ihn ersetzt (10 bis 14). Keine Kosten- oder
# Dauerangabe: die Wiederherstellung der Konformität wird in Worten gesagt.

chunk_max_chars: 700
top_k: 3
doc_id: projet_orion
code: ORN-7731-QZ

architectures:
