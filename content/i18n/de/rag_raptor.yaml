  sources: [charte_messagerie_v1, charte_messagerie_v2, note_changement_messagerie]
  audience: all
  summary_text: Eine versehentlich an einen falschen externen Empfänger gesendete Nachricht wird innerhalb einer Stunde dem Reaktionsteam für Vorfälle gemeldet, besonders wenn sie vertrauliche Informationen oder personenbezogene Daten enthält. Schließlich wird eine gelegentliche und angemessene private Nutzung des beruflichen Postfachs, die zuvor nicht geduldet wurde, nun akzeptiert.
  sha256: db10060f5d80318d8ba509ef6a357f9376052c7371c3d8ee6766683674f34090
- id: L1-rundschreiben_usb#1
  level: 1
  children: [rundschreiben_usb#1, rundschreiben_usb#2]
  sources: [rundschreiben_usb]
  audience: all
  summary_text: Nicht von der IT-Abteilung ausgegebene USB-Speichermedien werden an jedem Arbeitsplatz der Zentrale automatisch durch die Sicherheitssoftware blockiert; ein Versuch, ein solches Gerät anzuschließen, wird protokolliert und an die Sicherheitsabteilung gemeldet.
  sha256: 1bba9b0895dae0ec0f0c6824f49e67aa4319ee7441580cbc9bc99c556ea7fb65
- id: L1-rundschreiben_usb#3
  level: 1
  children: [rundschreiben_usb#3, acces_physique#2]
  sources: [rundschreiben_usb, acces_physique]
  audience: all
  summary_text: Externe Besucher und Lieferanten dürfen an der Zentrale keinen eigenen USB-Speicher anschließen; für einen Datenaustausch steht ein gesicherter Übertragungsdienst zur Verfügung, der vom Empfang vermittelt wird. Ein verlorenes Abzeichen wird sofort dem Empfang gemeldet, der es innerhalb einer Stunde deaktiviert; ein neues Abzeichen wird nach einer Identitätsprüfung ausgestellt.
  sha256: 9654bdd88992bce94035b856859ec60c923501e082fc6663e2e3e13ee9f0c74f
- id: L1-uk_visitor_badges#1
  level: 1
  children: [uk_visitor_badges#1, uk_visitor_badges#2]
  sources: [uk_visitor_badges]
  audience: all
  summary_text: The badge must be worn visibly at all times on site, and the visitor must be escorted by an Exemplia employee in any restricted or secure zone, exactly as in the general physical access policy. A visitor badge is valid only for the day it is issued and the specific floor stated on it.
  sha256: ab67ba725cb3bb384ca50c368bb90393d7662f43a067ef2154fe8a9e279f8dcf
- id: L1-plan_continuite_lyon#1
  level: 1
  children: [plan_continuite_lyon#1, plan_continuite_lyon#2]
  sources: [plan_continuite_lyon]
  audience: all
  summary_text: Si le site principal de Lyon devient inaccessible, pour cause d'incendie, de panne électrique prolongée ou d'évacuation, le site de repli de Villeurbanne est activé dans les 4 heures qui suivent la décision du directeur de site. L'activation du plan est décidée par le directeur de site de Lyon, ou par la cellule de crise si l'incident dépasse ce seul site.
  sha256: 0941410456a8b5dbb2755b8c6859dd78418d94b55a511a7a94d1ec92bf162b9d
- id: L1-grille_remunerations#1
  level: 1
  children: [grille_remunerations#1, grille_remunerations#2, grille_remunerations#3, dossier_disciplinaire#1]
  sources: [grille_remunerations, dossier_disciplinaire]
  audience: hr
  summary_text: Dieses Dokument beschreibt die Schritte eines Disziplinarverfahrens bei Exemplia; es ist als vertraulich eingestuft, und der Zugang ist der Personalabteilung, der Geschäftsleitung und, bei einer eigenen Akte, der betroffenen Person selbst vorbehalten.
  sha256: 328cb016ec7a1d00be20b79e2e54f5d6e5ad2c3f80ab851a6b9bc63e2229833f
- id: L1-dossier_disciplinaire#2
  level: 1
  children: [dossier_disciplinaire#2, entretiens_annuels#1, entretiens_annuels#2]
  sources: [dossier_disciplinaire, entretiens_annuels]
  audience: hr
  summary_text: Jeder Maßnahme außer der mündlichen Ermahnung geht ein Gespräch voraus, bei dem sich die betroffene Person von einer Person ihrer Wahl begleiten lassen kann. Die Person füllt zunächst innerhalb der 2 Wochen vor dem festgelegten Termin eine Selbsteinschätzung aus; danach findet das Gespräch für mindestens 45 Minuten nur mit der direkten Führungskraft statt.
  sha256: 5f2a8b0cd3aae24f781692245fd10ce3407cbd54d74530c5e93b4b1d807ef106
- id: L1-acces_physique#1
  level: 1
  children: [acces_physique#1, acces_physique#3, revue_habilitations#1, revue_habilitations#3]
  sources: [acces_physique, revue_habilitations]
  audience: all
  summary_text: Jeder Zugang, ob gewährt oder verweigert, wird protokolliert und 6 Monate aufbewahrt, einsehbar bei einer Sicherheitsuntersuchung oder einer Überprüfung der Berechtigungen. Ein externes Audit kann die Überprüfung der Berechtigungen umfassen; dabei wird das Register der Überprüfungen der letzten zwei Jahre als Nachweis der wirksamen Zugangskontrolle vorgelegt.
  sha256: 26eeadc20916bd327248203e073d17a4f85ecb9bcdd7760974aa26e81de48881
- id: L2-mots_de_passe#3
  level: 2
  children: [L1-mots_de_passe#3, L1-grille_remunerations#1, L1-acces_physique#1]
  sources: [mots_de_passe, grille_remunerations, dossier_disciplinaire, acces_physique, revue_habilitations]
  audience: hr
  summary_text: Dieses Dokument beschreibt die Schritte eines Disziplinarverfahrens bei Exemplia; es ist als vertraulich eingestuft, und der Zugang ist der Personalabteilung, der Geschäftsleitung und, bei einer eigenen Akte, der betroffenen Person selbst vorbehalten.
  sha256: d9c4e65697c8c11d9e3e2879076a3aae3ca32f473837581f6174eee1a496a5b4
- id: L2-teletravail#1
  level: 2
  children: [L1-teletravail#1, L1-teletravail#2]
  sources: [teletravail, deplacements, sauvegardes]
  audience: all
  summary_text: Die Telearbeitstage werden spätestens am Freitag der Vorwoche im HR-Tool angemeldet. Eine Mahlzeit auf Reisen wird bis zu 22 Euro erstattet; ein Essen mit einem Kunden wird gegen Rechnung bis zu 60 Euro pro Person erstattet, mit dem Namen des eingeladenen Unternehmens.
  sha256: d994f3c4444894b78256e1729b8bea62b5b7329c8d00a42302384e2645e691d7
- id: L2-classification#1
  level: 2
  children: [L1-classification#1, L1-classification#3]
  sources: [classification, ia_generative]
  audience: all
  summary_text: 'Ausdrucke dieser Stufen laufen über den sicheren Druck: Das Dokument kommt erst heraus, nachdem der Ausweis am Drucker vorgezeigt wurde. Informationen der Stufe Geheim werden keinem KI-Tool anvertraut, auch keinem internen.'
  sha256: 86f6d204ffa4a6c277940a52035cc0729c3f2257acca9e8cc998a70ae4c05a92
- id: L2-incidents#3
  level: 2
  children: [L1-incidents#3, L1-incidents#4]
  sources: [incidents, sauvegardes, gestion_crise, astreinte]
  audience: all
  summary_text: Ein Vorfall der Stufe 2 mobilisiert die CERT-Ex, die innerhalb einer Stunde den Informationssicherheitsbeauftragten informiert. Jeder Bereitschaftsanruf wird mit Uhrzeit, Grund und erreichter Person im Register des Betriebsteams festgehalten, das beim Erfahrungsbericht nach jedem Vorfall der Stufe 2 oder 3 herangezogen wird.
  sha256: c674219fffd41320bfa3e27cef0e61e6a11908fc0979a89864639090cc49f8b0
- id: L2-donnees_personnelles#1
  level: 2
  children: [L1-donnees_personnelles#1, L1-donnees_personnelles#2]
  sources: [donnees_personnelles, sauvegardes, gestion_crise, dossier_disciplinaire, entretiens_annuels]
  audience: hr
  summary_text: Der Krisenstab umfasst mindestens den Informationssicherheitsbeauftragten, den Kommunikationsdirektor, den Datenschutzbeauftragten, wenn personenbezogene Daten betroffen sind, und einen Vertreter der Rechtsabteilung. Die Protokolle werden 3 Jahre von der Personalabteilung aufbewahrt, um die Entwicklung der Ziele und des Weiterbildungsbedarfs einer Person über mehrere Jahre zu verfolgen.
  sha256: ae1765960b3dc1e6af7048beac3b2a18eb9cb4784ba7924de2c0cb401d78f1f8
- id: L2-ia_generative#3
  level: 2
  children: [L1-ia_generative#3, L1-dossier_disciplinaire#2]
  sources: [ia_generative, dossier_disciplinaire, entretiens_annuels, formation_securite]
  audience: hr
  summary_text: Der KI-Ausschuss aus 6 Mitgliedern aus Sicherheit, Recht, Personalwesen und Fachbereichen prüft jedes neue Tool vor seiner Einführung innerhalb von 6 Wochen. Die Person füllt zunächst innerhalb der 2 Wochen vor dem festgelegten Termin eine Selbsteinschätzung aus; danach findet das Gespräch für mindestens 45 Minuten nur mit der direkten Führungskraft statt.
  sha256: f8b21dd60fc7f0a6f88d14fc58db2c8b650985c9f3e6d604e40e7c150511589f
- id: L2-prestataires#1
  level: 2
  children: [L1-prestataires#1, L1-prestataires#2, L1-prestataires#3, L1-prestataires#4]
  sources: [prestataires, clauses_contrats, registre_sous_traitants]
  audience: all
  summary_text: Ein kritischer Dienstleister wird vor der Unterzeichnung und danach alle 3 Jahre auditiert und muss eine ISO-27001-Zertifizierung oder gleichwertig vorweisen. Ein Dienstleister vergibt nicht ohne Zustimmung von Exemplia selbst Unteraufträge; jeder eingesetzte Unterauftragnehmer wird im Register der Unterauftragnehmer erfasst, das die Dienstleister-Einheit führt.
  sha256: dcb367d655c51df8b18d9e9de9b0e17901724cbf5ceb60f772321a843511875e
- id: L2-charte_messagerie_v1#1
  level: 2
  children: [L1-charte_messagerie_v1#1, L1-charte_messagerie_v1#2]
  sources: [charte_messagerie_v1, charte_messagerie_v2, note_changement_messagerie]
  audience: all
  summary_text: 'Diese Version der E-Mail-Richtlinie, gültig seit Januar 2024, wird durch Version 2 ersetzt: Sie wird hier als Archiv aufbewahrt, um frühere Entscheidungen nachvollziehen zu können. Die automatische Weiterleitung an eine private Adresse bleibt verboten, ebenso die Nutzung eines privaten Postfachs für einen beruflichen Austausch.'
  sha256: f7d82df7614b4fd9bef1758c428eacede33ff03f7e91fef65f23d01533171fdd
