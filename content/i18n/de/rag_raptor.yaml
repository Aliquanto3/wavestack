  audience: all
  summary_text: 'Diese Version der E-Mail-Richtlinie, gültig seit Januar 2024, wird durch Version 2 ersetzt: Sie wird hier als Archiv aufbewahrt, um frühere Entscheidungen nachvollziehen zu können. Diese Version ersetzt Version 1 seit dem 1. Version 1 der Richtlinie bleibt als Archiv einsehbar, um frühere Entscheidungen nachvollziehen zu können, gilt aber seit dem 1.'
