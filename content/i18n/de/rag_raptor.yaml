  audience: all
  summary_text: 'Die Länge zählt mehr als die Komplexität: Empfohlen wird eine Passphrase aus vier oder fünf Wörtern ohne Bezug zueinander, zum Beispiel eine Folge zufällig gewählter Wörter, getrennt durch Bindestriche. Es ist verboten, ein Passwort auf Papier, in einer Textdatei oder im E-Mail-Postfach zu notieren und ein berufliches Passwort auf einer privaten Website wiederzuverwenden.'
  sha256: ce621f599bdf275664924c7c823a22242ab77e07dc91221975b495270da35440
- id: L1-mots_de_passe#3
  level: 1
  children: [mots_de_passe#3, revue_habilitations#2]
  sources: [mots_de_passe, revue_habilitations]
  audience: all
  summary_text: Das Konto einer Person, die Exemplia verlässt, wird am Tag ihres Austritts deaktiviert, und ihre Berechtigungen werden innerhalb von 48 Stunden entzogen; ein Konto ohne erkennbaren Inhaber, ein sogenanntes verwaistes Konto, wird sofort bei Entdeckung gesperrt und nach Prüfung gelöscht.
  sha256: fcf4a3e6e993665b3a7746cf6f238f121f6f59eeceddc9fe91f22403361d5c39
- id: L1-mots_de_passe#4
  level: 1
  children: [mots_de_passe#4, donnees_personnelles#4]
  sources: [mots_de_passe, donnees_personnelles]
  audience: all
  summary_text: 'Der IT-Support fragt nie nach einem Passwort, weder am Telefon noch per E-Mail. Arbeitskopien, Auszüge in einer Tabellenkalkulation oder per E-Mail versandte Dateien unterliegen denselben Fristen wie die ursprüngliche Verarbeitung: Alle sind selbst für ihre Löschung verantwortlich.'
  sha256: 76e155f16d5d50d5ef472a39383df5d35f254a8ee95339dd4c616658020461ff
- id: L1-teletravail#1
  level: 1
  children: [teletravail#1, teletravail#3, sauvegardes#1]
  sources: [teletravail, sauvegardes]
  audience: all
  summary_text: Die Telearbeitstage werden spätestens am Freitag der Vorwoche im HR-Tool angemeldet. Telearbeit aus dem Ausland ist aus steuerlichen und sozialversicherungsrechtlichen Gründen auf 20 Tage pro Kalenderjahr begrenzt und braucht die schriftliche Zustimmung der Führungskraft und der Personalabteilung.
  sha256: 318cb3d40f6e06855c1718f633cd3b0564ab9c30d66822d35698b7cfdbb53547
- id: L1-teletravail#2
  level: 1
  children: [teletravail#2, deplacements#1, deplacements#3, deplacements#4]
  sources: [teletravail, deplacements]
  audience: all
  summary_text: Exemplia zahlt eine Pauschale von 2,50 Euro pro Telearbeitstag, höchstens 55 Euro pro Monat. Eine Buchung außerhalb von Voyagex wird nur ausnahmsweise erstattet, mit schriftlicher Begründung. Eine Mahlzeit auf Reisen wird bis zu 22 Euro erstattet; ein Essen mit einem Kunden wird gegen Rechnung bis zu 60 Euro pro Person erstattet, mit dem Namen des eingeladenen Unternehmens.
  sha256: 1ee0f453508f4f17ca27f12019219cc3724423fc09ccd1576b9edaafd6ec4c04
- id: L1-classification#1
  level: 1
  children: [classification#1, classification#2, ia_generative#1, ia_generative#2]
  sources: [classification, ia_generative]
  audience: all
  summary_text: 'Jede Information, die Exemplia erzeugt oder erhält, trägt eine der folgenden 4 Klassifizierungsstufen: Öffentlich, Intern, Vertraulich und Geheim. Informationen der Stufe Geheim werden keinem KI-Tool anvertraut, auch keinem internen. Öffentliche KI-Dienste, die über einen Browser erreichbar sind, erhalten nur Informationen der Stufe Öffentlich.'
  sha256: 38377a16e5587c3825734fee3c3cba3605317b38ea4b3ee1e4a2aa9058c42f95
- id: L1-classification#3
  level: 1
  children: [classification#3, classification#4]
  sources: [classification]
  audience: all
  summary_text: 'Ein geheimes Dokument wird nie per E-Mail versendet: Es wird ausschließlich im Datenraum eingesehen, an einem Rechner ohne Internetverbindung, und jede Einsichtnahme wird in ein unterschriebenes Register eingetragen. Ausdrucke dieser Stufen laufen über den sicheren Druck: Das Dokument kommt erst heraus, nachdem der Ausweis am Drucker vorgezeigt wurde.'
  sha256: cc322c5b35222f3259fe10b3885578488786f02d111392b7f5d8c85b0d963775
- id: L1-incidents#2
  level: 1
  children: [incidents#2, astreinte#2]
  sources: [incidents, astreinte]
  audience: all
  summary_text: 'Bis zur Antwort der CERT-Ex wird der verdächtige Rechner vom Netz getrennt, Kabel gezogen und WLAN ausgeschaltet, aber nicht heruntergefahren: Der Arbeitsspeicher enthält Spuren, die für die Untersuchung nützlich sind. Infrastrukturbereitschaft, bei einem Server- oder Netzwerkausfall: Durchwahl 4100, dann 06 11 12 13 14, wenn innerhalb von 15 Minuten keine Antwort erfolgt.'
  sha256: 1ec576e4ec2fdc17cc2675e210fe9373fcab8953e6e85f1992ae657fdd6b461b
- id: L1-incidents#3
  level: 1
  children: [incidents#3, gestion_crise#1, astreinte#1]
  sources: [incidents, gestion_crise, astreinte]
  audience: all
  summary_text: Ein Vorfall der Stufe 2 mobilisiert die CERT-Ex, die innerhalb einer Stunde den Informationssicherheitsbeauftragten informiert. Diese Anlage zum Krisenmanagementverfahren listet die Kontakte, die außerhalb der Geschäftszeiten, Tag und Nacht, je nach betroffenem Bereich zu erreichen sind.
  sha256: 769a019f83c4d60176f2710463b05b3cfe0da1cf4368d81d984a28736672cb4c
- id: L1-incidents#4
  level: 1
  children: [incidents#4, sauvegardes#3, astreinte#3]
  sources: [incidents, sauvegardes, astreinte]
  audience: all
  summary_text: Das Ergebnis jedes Tests wird im Register des Betriebsteams festgehalten; ein Fehlschlag wird als Vorfall der Stufe 2 behandelt. Jeder Bereitschaftsanruf wird mit Uhrzeit, Grund und erreichter Person im Register des Betriebsteams festgehalten, das beim Erfahrungsbericht nach jedem Vorfall der Stufe 2 oder 3 herangezogen wird.
  sha256: ab9c85fdcd979d5f163545bc5bd627fa27f29d8ecc617a96d9511602968dfab2
- id: L1-donnees_personnelles#1
  level: 1
  children: [donnees_personnelles#1, donnees_personnelles#3, gestion_crise#2]
  sources: [donnees_personnelles, gestion_crise]
  audience: all
  summary_text: Eine Abteilung, die Daten länger behalten muss, etwa wegen eines laufenden Rechtsstreits, braucht vor der Bereinigung eine schriftliche Ausnahmegenehmigung der Rechtsabteilung. Der Krisenstab umfasst mindestens den Informationssicherheitsbeauftragten, den Kommunikationsdirektor, den Datenschutzbeauftragten, wenn personenbezogene Daten betroffen sind, und einen Vertreter der Rechtsabteilung.
  sha256: a67bfdbbdbc2520abb968d00c66db8028b894996c330bc59bdcf4f981852fb81
- id: L1-donnees_personnelles#2
  level: 1
  children: [donnees_personnelles#2, sauvegardes#2, dossier_disciplinaire#3, entretiens_annuels#3]
  sources: [donnees_personnelles, sauvegardes, dossier_disciplinaire, entretiens_annuels]
  audience: hr
  summary_text: Tägliche Sicherungen werden 35 Tage aufbewahrt, wöchentliche Sicherungen 12 Wochen, und eine monatliche Sicherung wird wegen der Buchhaltungspflichten 7 Jahre lang behalten. Die Protokolle werden 3 Jahre von der Personalabteilung aufbewahrt, um die Entwicklung der Ziele und des Weiterbildungsbedarfs einer Person über mehrere Jahre zu verfolgen.
  sha256: 8650ece1e0c7c853f794b3e6422416b890c8c0ccf94ee9ade06496b982cc612a
- id: L1-ia_generative#3
  level: 1
  children: [ia_generative#3, formation_securite#1]
  sources: [ia_generative, formation_securite]
  audience: all
  summary_text: Der KI-Ausschuss aus 6 Mitgliedern aus Sicherheit, Recht, Personalwesen und Fachbereichen prüft jedes neue Tool vor seiner Einführung innerhalb von 6 Wochen. Jede Person bei Exemplia nimmt an einer zweistündigen Online-Schulung zur Informationssicherheit teil und besteht anschließend einen Fragebogen mit mindestens 8 richtigen Antworten von 10, um sie zu erhalten.
  sha256: 6ead80145b804adac95e7dcdf082fb1620eeb319e397c3135dc43cbf08ab0aa9
- id: L1-prestataires#1
  level: 1
  children: [prestataires#1, clauses_contrats#1, registre_sous_traitants#1]
  sources: [prestataires, clauses_contrats, registre_sous_traitants]
  audience: all
  summary_text: 'Dieses von der Dienstleister-Einheit geführte und im Klauselmuster genannte Register listet jeden Unterauftragnehmer, den ein Dienstleister von Exemplia einsetzt: seinen Namen, seine Funktion, das Land, in dem er Daten hostet oder verarbeitet, und die Stufe des beauftragenden Dienstleisters.'
  sha256: 4ec24105fba2a292b81b26dbde7cff006d45a988dea413c417fc3ba03f589367
- id: L1-prestataires#2
  level: 1
  children: [prestataires#2, clauses_contrats#2, registre_sous_traitants#2]
  sources: [prestataires, clauses_contrats, registre_sous_traitants]
  audience: all
  summary_text: Ein kritischer Dienstleister wird vor der Unterzeichnung und danach alle 3 Jahre auditiert und muss eine ISO-27001-Zertifizierung oder gleichwertig vorweisen. NuageSud, Hosting der Buchhaltungsserver, Frankreich, kritischer Dienstleister.
  sha256: b52fd86dc912d4f1a17ea4f01e61fd516211ff97f136ee5d8d5e02890115f575
- id: L1-prestataires#3
  level: 1
  children: [prestataires#3, registre_sous_traitants#3, registre_sous_traitants#4]
  sources: [prestataires, registre_sous_traitants]
  audience: all
  summary_text: Ein außerhalb der Europäischen Union gehosteter Unterauftragnehmer erscheint im Register nur mit der in der Dienstleisterrichtlinie vorgesehenen schriftlichen Ausnahme, die seinem Eintrag beigefügt ist.
  sha256: 9a551e17603fe5a44338a21704e5334a60e5e4fd24aae0458237973832c09c18
- id: L1-prestataires#4
  level: 1
  children: [prestataires#4, clauses_contrats#3]
  sources: [prestataires, clauses_contrats]
  audience: all
  summary_text: Am Ende eines Vertrags löscht der Dienstleister die Daten von Exemplia und bestätigt dies schriftlich innerhalb der im Vertrag festgelegten Frist.
  sha256: 3b4ba22dc1f95f8cc651980957397f555e0e051f9c5750bf5fa6b7ee3c1cc4f6
- id: L1-charte_messagerie_v1#1
  level: 1
