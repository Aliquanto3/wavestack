    url: https://arxiv.org/abs/2508.04276
  - label_text: Microsoft Research
    url: https://www.microsoft.com/en-us/research/publication/enterprise-ai-must-enforce-participant-aware-access-control
  axes:
    location:
      level: low
      text: Dokumente, Index und Reranker laufen in der Werkstatt. Die Generierung kann zu einem Anbieter gehen, wenn das aktive Modell ein Cloud-Modell ist.
      components:
      - id: documents
        class: local
      - id: index
        class: local
      - id: generation
        class: depends_on_provider
      - id: trace_export
        class: depends_on_provider
    copies:
      level: mid
      text: Dieselben Kopien wie bei Dense; der Reranker speichert nichts, er bewertet die Kandidaten zur Anfragezeit.
    erasure:
      level: mid
      text: Es genügt, die Passagen aus dem Speicher zu entfernen, der Reranker behält nichts. Kopien außerhalb der Architektur sind zu prüfen.
      demo: rag-erasure-card
    rights:
      level: mid
      text: 'Der Reranker liest die Kandidaten vor jedem Zielgruppenfilter, wenn es keine Prüfung vor der Suche gibt: Eine verbotene Passage kann also gelesen und dann verworfen werden.'
      demo: rag-access-card
      before_search: true
    injection:
      level: mid
      text: Eine gut formulierte präparierte Passage kann im Reranking aufsteigen, weil das Modell ihre Nähe zur Frage beurteilt.
      demo: rag-atk-title
    traceability:
      level: low
      text: 'Die Ränge vor und nach dem Reranking stehen im Lauf: Man sieht, was der Reranker geändert hat.'
    regulatory:
      text: 'Fragen, kein Urteil. DSGVO: welche Rechtsgrundlage, welche Datenminimierung und wie wird das Recht auf Löschung auf die Vektoren und Passagen im Speicher ausgeübt? AI Act: welche Einstufung je nach Verwendung? DORA oder NIS2: je nach Sektor der Organisation. Anbieterabhängigkeit: was verlässt die Werkstatt bei der Nutzung vom Generierungsmodell?'
- id: long_context
  hypotheses:
  - H11
  - H12
  purpose_text: 'Nicht suchen: den ganzen Korpus in den Prompt legen und das Modell die Antwort darin finden lassen.'
  when_text: 'Geeignet für einen kleinen Korpus, der ins Fenster passt: nichts aufzubauen. Zu vermeiden, sobald der Korpus wächst oder das Modell klein ist: Alles wird bei jeder Anfrage neu gelesen.'
  cost_text: 'Aufbau: keiner. Aktualisierung: keine. Anfrage: der ganze Korpus im Prompt, etwa 12 000 Tokens bei jeder Frage.'
  literature_text: 'H11 (langer Kontext ist bei kleinem Korpus eine schwer zu schlagende Baseline): mit starkem Modell gestützt. H12 (abgeleitete Architekturen erschweren Löschung und Zugriffsrechte und vergrößern die Angriffsfläche): teilweise gestützt.'
  bench_text: ''
  sources:
