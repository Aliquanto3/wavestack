    url: https://www.microsoft.com/en-us/research/publication/enterprise-ai-must-enforce-participant-aware-access-control
  axes:
    location:
      level: low
      text: 'Die Dokumente bleiben in der Werkstatt. Jeder von einem Werkzeug gelesene Auszug geht in jeder Runde zum aktiven Modell: zu einem Anbieter, wenn es ein Cloud-Modell ist.'
      components:
      - id: documents
        class: local
      - id: generation
        class: depends_on_provider
      - id: trace_export
        class: depends_on_provider
    copies:
      level: low
      text: 'Keine Kopie und keine Ableitung: Die Quelle wird unverändert gelesen. Der Zustand beschränkt sich auf den Verlauf der Schleife, je Anfrage.'
    erasure:
      level: low
      text: 'Nichts neu aufzubauen: Es genügt, das Dokument aus der Quelle zu entfernen, die nächste Anfrage findet es nicht mehr.'
      demo: rag-erasure-card
    rights:
      level: mid
      text: 'Die Rechte beruhen auf den Berechtigungen der Werkzeuge: Ein Werkzeug, das den ganzen Ordner liest, liest auch die verbotenen Dokumente. Eine Prüfung vor dem Werkzeug ist möglich.'
      demo: rag-access-card
      before_search: true
    injection:
      level: high
      text: 'Das ist die am stärksten exponierte Architektur: Ein von einem Werkzeug gelesener präparierter Text kann das Modell dazu bringen, weitere Werkzeuge aufzurufen oder Daten abfließen zu lassen.'
      demo: rag-atk-title
    traceability:
      level: low
      text: 'Jeder Werkzeugaufruf und jedes Lesen ist ein Ereignis im Journal: Der gesamte Leseweg lässt sich rekonstruieren.'
    regulatory:
      text: 'Fragen, kein Urteil. DSGVO: welche Rechtsgrundlage, welche Datenminimierung und wie wird das Recht auf Löschung auf den Verlauf der Werkzeugschleife ausgeübt? AI Act: welche Einstufung je nach Verwendung? DORA oder NIS2: je nach Sektor der Organisation. Anbieterabhängigkeit: was verlässt die Werkstatt bei der Nutzung vom Modell, das die Auszüge in jeder Runde liest?'
- id: pageindex
  hypotheses:
  - H4
  - H12
  purpose_text: Einen Baum der Abschnitte des Dokuments (Überschriften, Kurzzusammenfassungen) aufbauen und das Modell bis zum passenden Abschnitt absteigen lassen, ohne Vektoren.
  when_text: 'Geeignet für lange, strukturierte Dokumente (Berichte, Verträge). Zu vermeiden bei kurzen oder überschriftenlosen Texten: Der Baum bringt nichts und kostet Modellaufrufe.'
  cost_text: 'Aufbau: der Abschnittsbaum mit vom Modell geschriebenen Zusammenfassungen. Aktualisierung: den Baum des geänderten Dokuments neu berechnen. Anfrage: ein Abstieg durch den Baum, durch das Modell.'
  literature_text: 'H4 (PageIndex gewinnt bei langen, strukturierten Dokumenten): teilweise gestützt, vor allem vom Anbieter. H12 (abgeleitete Architekturen erschweren Löschung und Zugriffsrechte und vergrößern die Angriffsfläche): teilweise gestützt.'
  bench_text: ''
  sources:
