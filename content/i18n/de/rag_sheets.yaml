  literature_text: 'H2 (GraphRAG gewinnt nur bei globalen und Multi-Hop-Fragen): gestützt. H12 (abgeleitete Architekturen erschweren Löschung und Zugriffsrechte und vergrößern die Angriffsfläche): teilweise gestützt. H13 (GraphRAG und das LLM Wiki kosten mehr bei Indexierung und Aktualisierung): teilweise gestützt.'
