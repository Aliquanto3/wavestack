    url: https://www.microsoft.com/en-us/research/publication/enterprise-ai-must-enforce-participant-aware-access-control
  axes:
    location:
      level: low
      text: 'Dokumente und Baum laufen in der Werkstatt. Die Zusammenfassungen des Baums und der Abstieg stammen vom aktiven Modell: bei einem Anbieter, wenn es ein Cloud-Modell ist.'
      components:
      - id: documents
        class: local
      - id: derived
        class: local
      - id: generation
        class: depends_on_provider
      - id: trace_export
        class: depends_on_provider
    copies:
      level: mid
      text: 'Die Zusammenfassungen des Baums sind abgeleitete Kopien des Textes, von einem Modell geschrieben: Sie können Informationen behalten, die das Dokument nicht mehr enthält.'
    erasure:
