  when_text: 'Geeignet für globale oder Multi-Hop-Fragen auf einem stabilen Korpus. Zu vermeiden bei einfachen Fakten oder einem sich ändernden Korpus: Es verliert bei einfachen Fakten, und seine Aktualisierung ist teuer.'
