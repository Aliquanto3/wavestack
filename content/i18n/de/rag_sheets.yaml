  - label_text: Microsoft Research
    url: https://www.microsoft.com/en-us/research/publication/enterprise-ai-must-enforce-participant-aware-access-control
  axes:
    location:
      level: low
      text: 'Dokumente und Präfix-Cache laufen in der Werkstatt. Der gesamte Korpus geht mit jeder Frage zum aktiven Modell: zu einem Anbieter, wenn es ein Cloud-Modell ist.'
      components:
      - id: documents
        class: local
      - id: cache
        class: local
      - id: generation
        class: depends_on_provider
      - id: trace_export
        class: depends_on_provider
    copies:
      level: low
      text: 'Kein Index, keine Ableitung: Der einzige Zustand ist das vom Motor zwischengespeicherte Präfix. Wenige Kopien, aber der ganze Korpus reist mit.'
    erasure:
      level: low
      text: Außer dem zwischengespeicherten Präfix, das neu geladen wird, ist nichts neu aufzubauen. Wird das Dokument aus der Quelle entfernt, fehlt es im nächsten Prompt.
      demo: rag-erasure-card
    rights:
      level: high
      text: 'Alle Dokumente stehen im Prompt: Ohne Vorauswahl ist kein Filter nach Zielgruppe möglich. Das Modell sieht alles.'
      demo: rag-access-card
      before_search: false
    injection:
      level: high
      text: 'Ein präpariertes Dokument wird mit allem anderen gelesen, ohne dass eine Suche es sortiert hätte: Die Angriffsfläche ist der gesamte Korpus.'
      demo: rag-atk-title
    traceability:
      level: mid
      text: 'Man kann nicht sagen, welche Passage genutzt wurde: Alles stand im Prompt. Die Quellennachverfolgung beschränkt sich auf „den ganzen Korpus“.'
    regulatory:
      text: 'Fragen, kein Urteil. DSGVO: welche Rechtsgrundlage, welche Datenminimierung und wie wird das Recht auf Löschung auf das zwischengespeicherte Präfix ausgeübt? AI Act: welche Einstufung je nach Verwendung? DORA oder NIS2: je nach Sektor der Organisation. Anbieterabhängigkeit: was verlässt die Werkstatt bei der Nutzung vom Modell, das den ganzen Korpus liest?'
- id: cag
  hypotheses:
  - H11
  - H12
  purpose_text: Den Korpus einmal in den Cache des Modells vorladen und danach nur noch die Frage hinter diesem Präfix stellen.
  when_text: 'Geeignet für einen kleinen, stabilen Korpus, der oft abgefragt wird: Die Anfrage kostet fast nichts. Zu vermeiden, wenn sich Dokumente ändern: Der ganze Cache wird neu geladen.'
  cost_text: 'Aufbau: Korpus in den Cache vorgeladen (Präfix). Aktualisierung: den ganzen Cache neu laden. Anfrage: nur die Frage hinter dem zwischengespeicherten Präfix.'
  literature_text: 'H11 (langer Kontext ist bei kleinem Korpus eine schwer zu schlagende Baseline): mit starkem Modell gestützt. H12 (abgeleitete Architekturen erschweren Löschung und Zugriffsrechte und vergrößern die Angriffsfläche): teilweise gestützt.'
  bench_text: ''
  sources:
  - label_text: arXiv 2407.16833
    url: https://arxiv.org/html/2407.16833v1
  - label_text: LaRA
    url: https://arxiv.org/html/2502.09977v1
  - label_text: arXiv 2508.04276
    url: https://arxiv.org/abs/2508.04276
  - label_text: Microsoft Research
    url: https://www.microsoft.com/en-us/research/publication/enterprise-ai-must-enforce-participant-aware-access-control
  axes:
    location:
      level: low
      text: 'Dokumente und Modell-Cache laufen in der Werkstatt. Das Präfix wird dem aktiven Modell erneut übergeben: bei einem Anbieter, wenn es ein Cloud-Modell ist.'
      components:
      - id: documents
        class: local
      - id: cache
        class: local
      - id: generation
        class: depends_on_provider
      - id: trace_export
        class: depends_on_provider
    copies:
      level: mid
      text: 'Der Modell-Cache enthält den Korpus in einer Form, die niemand liest: eine abgeleitete Kopie des gesamten Korpus.'
    erasure:
      level: high
      text: 'Der ganze Cache muss neu geladen werden, weil das Präfix das Dokument enthält: Wer einen einzigen Text entfernt, muss alles neu berechnen.'
      demo: rag-erasure-card
    rights:
      level: high
      text: 'Ein einziger Cache für alle: Alles darin kann jede Frage beantworten, egal welches Profil. Ein Cache je Profil vervielfacht die Kosten.'
      demo: rag-access-card
      before_search: false
    injection:
      level: high
      text: Ein präpariertes Dokument gelangt ins Präfix und bleibt dort für alle folgenden Fragen, bis der Cache neu geladen wird.
      demo: rag-atk-title
    traceability:
      level: mid
      text: Wie beim langen Kontext lässt sich nicht sagen, welche Passage genutzt wurde; zudem ist der Cache ein verborgener Zustand zwischen zwei Anfragen.
    regulatory:
      text: 'Fragen, kein Urteil. DSGVO: welche Rechtsgrundlage, welche Datenminimierung und wie wird das Recht auf Löschung auf den Modell-Cache, der den ganzen Korpus enthält ausgeübt? AI Act: welche Einstufung je nach Verwendung? DORA oder NIS2: je nach Sektor der Organisation. Anbieterabhängigkeit: was verlässt die Werkstatt bei der Nutzung vom Modell, das das Präfix erneut verarbeitet?'
- id: agentic
  hypotheses:
  - H5
  - H12
  purpose_text: Das Modell selbst in den Korpusdateien mit Werkzeugen suchen lassen (auflisten, Muster suchen, lesen), in einer Schleife, bis es antwortet.
  when_text: 'Geeignet, wenn sich Dokumente oft ändern: Die Quelle wird bei jeder Anfrage neu gelesen. Zu vermeiden, wenn Latenz und Tokens zählen: Die Schleife kostet mehr als RAG.'
  cost_text: 'Aufbau: keiner. Aktualisierung: keine. Anfrage: eine Schleife aus Werkzeug- und Modellaufrufen über mehrere Runden, weit mehr Tokens als eine einfache Suche.'
  literature_text: 'H5 (agentische Suche hält mit RAG mit, kostet aber mehr): teilweise gestützt. H12 (abgeleitete Architekturen erschweren Löschung und Zugriffsrechte und vergrößern die Angriffsfläche): teilweise gestützt.'
  bench_text: ''
  sources:
  - label_text: arXiv 2601.07711
