architectures:
- id: dense
  hypotheses:
  - H1
  - H12
  purpose_text: Die Passagen suchen, deren Vektor dem der Frage am nächsten liegt, und sie dem Modell geben.
  when_text: 'Als Ausgangspunkt geeignet: einfach, günstig, ein einziger Index. Zu vermeiden, wenn Fragen auf exakte Begriffe (Codes, Namen) zielen, die der Sinn nicht findet.'
  cost_text: 'Aufbau: Korpus zerlegen und vektorisieren. Aktualisierung: Passagen des Dokuments entfernen und hinzufügen. Anfrage: Frage vektorisieren und einmal suchen.'
  literature_text: 'H1 (Hybrid mit Reranker schlägt Dense allein): teilweise gestützt. H12 (abgeleitete Architekturen erschweren Löschung und Zugriffsrechte und vergrößern die Angriffsfläche): teilweise gestützt.'
  bench_text: ''
  sources:
  - label_text: arXiv 2604.01733
    url: https://arxiv.org/html/2604.01733
  - label_text: arXiv 2609.22770
    url: https://arxiv.org/abs/2609.22770
  - label_text: arXiv 2508.04276
    url: https://arxiv.org/abs/2508.04276
  - label_text: Microsoft Research
    url: https://www.microsoft.com/en-us/research/publication/enterprise-ai-must-enforce-participant-aware-access-control
  axes:
    location:
      level: low
      text: 'Dokumente, Index und Vektoren laufen in der Werkstatt. Die Generierung nutzt das aktive Modell: Bei einem Cloud-Modell gehen Passagen und Frage zum Anbieter.'
      components:
      - id: documents
        class: local
      - id: index
        class: local
      - id: generation
        class: depends_on_provider
      - id: trace_export
        class: depends_on_provider
    copies:
      level: mid
      text: 'Jede Passage existiert zweimal: Text und Vektor im Speicher. Eine Kopie mehr, aber jede lässt sich per Kennung entfernen.'
    erasure:
      level: mid
      text: 'Es genügt, die Passagen des Dokuments zu entfernen: Der Vektor verschwindet mit seiner Passage. Kopien außerhalb der Architektur (neu berechnete Kontexte, Sicherungen) sind zu prüfen.'
      demo: rag-erasure-card
    rights:
      level: mid
      text: 'Ohne Prüfung vor der Suche werden verbotene Passagen gelesen und dann entfernt: Sie haben das Ranking schon beeinflusst. Ein Filter auf dem Index vor der Suche ist möglich.'
      demo: rag-access-card
      before_search: true
    injection:
      level: mid
      text: Eine präparierte Passage, die die Suche findet, gelangt unverändert in den Prompt. Es gibt kein Werkzeug zu kapern, aber das Modell liest die versteckte Anweisung.
      demo: rag-atk-title
    traceability:
      level: low
      text: 'Die behaltenen Passagen und ihre Scores stehen im Journal des Laufs: Man kann sagen, welche Quellen die Antwort gespeist haben.'
    regulatory:
      text: 'Fragen, kein Urteil. DSGVO: welche Rechtsgrundlage, welche Datenminimierung und wie wird das Recht auf Löschung auf die Vektoren und Passagen im Speicher ausgeübt? AI Act: welche Einstufung je nach Verwendung? DORA oder NIS2: je nach Sektor der Organisation. Anbieterabhängigkeit: was verlässt die Werkstatt bei der Nutzung vom Generierungsmodell?'
- id: hybrid
  hypotheses:
  - H1
  - H12
  purpose_text: Suche nach Sinn und Suche nach exakten Wörtern (BM25) kombinieren und beide Rankings per Reciprocal Rank zusammenführen.
  when_text: 'Geeignet, wenn der Korpus Fließtext und exakte Begriffe (Codes, Kürzel) mischt. Zu vermeiden, wenn ein Index genügt: Eine ungetunte Fusion kann schlechter sein als Dense.'
  cost_text: 'Aufbau: Vektorindex und BM25-Index. Aktualisierung: Passagen aus beiden entfernen. Anfrage: zwei Suchen und eine Fusion, ohne zusätzlichen Modellaufruf.'
  literature_text: 'H1 (Hybrid mit Reranker schlägt Dense allein): teilweise gestützt. H12 (abgeleitete Architekturen erschweren Löschung und Zugriffsrechte und vergrößern die Angriffsfläche): teilweise gestützt.'
  bench_text: ''
  sources:
  - label_text: arXiv 2604.01733
    url: https://arxiv.org/html/2604.01733
  - label_text: arXiv 2609.22770
    url: https://arxiv.org/abs/2609.22770
  - label_text: arXiv 2508.04276
    url: https://arxiv.org/abs/2508.04276
  - label_text: Microsoft Research
    url: https://www.microsoft.com/en-us/research/publication/enterprise-ai-must-enforce-participant-aware-access-control
  axes:
    location:
      level: low
      text: Dokumente, beide Indizes und die Fusion laufen in der Werkstatt. Nur die Generierung kann zu einem Anbieter gehen, wenn das aktive Modell ein Cloud-Modell ist.
      components:
      - id: documents
        class: local
      - id: index
        class: local
      - id: generation
        class: depends_on_provider
      - id: trace_export
        class: depends_on_provider
    copies:
      level: mid
      text: 'Der Text liegt in zwei Indizes: dem der Vektoren und dem der Wörter. Zwei Stellen zu pflegen, beide per Kennung entfernbar.'
    erasure:
      level: mid
      text: Das Dokument muss aus beiden Indizes entfernt werden; vergisst man einen, bleibt der Text durchsuchbar. Das Aufräumen bleibt günstig.
      demo: rag-erasure-card
    rights:
      level: mid
      text: 'Wie bei Dense: Ohne Prüfung vor der Suche lesen beide Rankings verbotene Passagen. Der Filter muss auf beide Indizes wirken.'
      demo: rag-access-card
      before_search: true
    injection:
      level: mid
      text: Eine präparierte Passage kann über beide Rankings auftauchen, und die Suche nach exakten Wörtern findet leicht einen Text, der die Wörter der Frage zitiert.
      demo: rag-atk-title
    traceability:
      level: low
      text: 'Beide Rankings und die Fusion sind im Lauf sichtbar: Man kann sagen, auf welchem Weg eine Quelle kam.'
    regulatory:
      text: 'Fragen, kein Urteil. DSGVO: welche Rechtsgrundlage, welche Datenminimierung und wie wird das Recht auf Löschung auf die beiden Indizes (Vektoren und Wörter) ausgeübt? AI Act: welche Einstufung je nach Verwendung? DORA oder NIS2: je nach Sektor der Organisation. Anbieterabhängigkeit: was verlässt die Werkstatt bei der Nutzung vom Generierungsmodell?'
- id: rerank
  hypotheses:
  - H1
  - H12
  purpose_text: Breit nach Sinn suchen, dann die Kandidaten mit einem Modell neu ordnen, das Frage und Passage gemeinsam liest.
  when_text: Geeignet, wenn die richtigen Passagen unter den ersten Kandidaten, aber schlecht sortiert sind. Zu vermeiden, wenn die Antwortzeit wichtiger ist als die Präzision.
  cost_text: 'Aufbau: wie Dense. Aktualisierung: Passagen entfernen, der Reranker behält nichts. Anfrage: eine Suche plus ein Reranker-Durchlauf je Kandidat.'
  literature_text: 'H1 (Hybrid mit Reranker schlägt Dense allein): teilweise gestützt. H12 (abgeleitete Architekturen erschweren Löschung und Zugriffsrechte und vergrößern die Angriffsfläche): teilweise gestützt.'
  bench_text: ''
  sources:
  - label_text: arXiv 2604.01733
    url: https://arxiv.org/html/2604.01733
  - label_text: arXiv 2609.22770
    url: https://arxiv.org/abs/2609.22770
