# German translation of content/rag.yaml (languages 1/5 and 4/5, AD-19): same fields, same
# placeholders. `documents` keeps the French ids and files (the corpus is translated under
# content/i18n/de/corpus/, same names); only the titles change, and the index of this
# language (data/rag_index.de.sqlite) holds them.
notice_text: >-
  Fiktive Texte, geschrieben für WaveStack: Exemplia ist eine erfundene Organisation,
  ihre Regeln beschreiben kein reales Unternehmen.

intro_text: >-
  Auszüge aus der internen Dokumentation von Exemplia, die der Harness zu dieser Frage
  gefunden hat. Sie sind nicht unbedingt alle relevant: Stütze dich auf die, die
  antworten, und nenne das verwendete Dokument.

excerpt_format_text: "Auszug {position} — {title_text}:\n{text}"

placement_text: In der Nachricht des Benutzers in dieser Runde, vor der Frage

phase_label_text: Suche im Korpus…

index_label_text: "RAG-Index (rag_index.de.sqlite)"

download_label_text: "Embedding-Modell herunterladen (≈ {size_mb} MB)"

build_label_text: Index erstellen

rerank_label_text: Reranking

rerank_phase_label_text: Reranking der Auszüge…

rerank_search_placement_text: >-
  Keiner direkt: Diese {candidates} Kandidaten gehen ins Reranking, das nur {keep}
