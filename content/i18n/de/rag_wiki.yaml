  text: '# Aufbewahrung personenbezogener Daten


    Personenbezogene Daten werden nur so lange aufbewahrt, wie es der Zweck erfordert, für den sie erhoben wurden. Das Verarbeitungsverzeichnis von Exemplia legt für jede Verarbeitung eine aktive Frist fest, in der die Abteilungen die Daten nutzen, und danach eine Archivierungsfrist, in der nur die Rec…


    ## Kernpunkte

    - Nicht berücksichtigte Bewerbungen werden 2 Jahre nach dem letzten Kontakt mit dem Bewerber aufbewahrt; er wird darüber informiert und kann ihre frühere Löschung verlangen.

    - Die Daten von Interessenten, die nie geantwortet haben, werden nach 3 Jahren ohne Kontakt gelöscht.

    - Kundendaten werden während der gesamten Vertragsbeziehung aufbewahrt und danach 5 Jahre nach Vertragsende archiviert.

    - Anmeldeprotokolle der Anwendungen werden 12 Monate aufbewahrt, Aufnahmen der Videoüberwachung der Räume 30 Tage, und deaktivierte Zutrittsausweise werden 3 Monate nach dem Ausscheiden des Mitarbeiters gelöscht.


