  text: '# Nutzung generativer KI


    Exemplia fördert die Nutzung generativer künstlicher Intelligenz, um beim Verfassen, Zusammenfassen und Übersetzen Zeit zu sparen, unter Einhaltung dieser Leitlinien. Sie gelten für Chat-Assistenten, Bildgeneratoren und Tools zur Code-Vervollständigung.


    ## Kernpunkte

    - Vor dem Zugang zu ExempliaGPT absolvieren alle Mitarbeitenden eine 3-stündige Online-Schulung und bestehen dann einen Fragebogen mit mindestens 8 von 10 richtigen Antworten.

    - Eine 45-minütige Auffrischung ist jedes Jahr Pflicht.

    - Der KI-Ausschuss aus 6 Mitgliedern aus Sicherheit, Recht, Personalwesen und Fachbereichen prüft jedes neue Tool vor seiner Einführung innerhalb von 6 Wochen.


