  text: '# Sicherheitsvorfälle


    Ein Sicherheitsvorfall ist jedes Ereignis, das die Vertraulichkeit, Integrität oder Verfügbarkeit der Informationen von Exemplia bedroht: eine geöffnete Phishing-E-Mail, ein verlorener Laptop, ein entdecktes Virus, ein vertrauliches Dokument an den falschen Empfänger, eine verdächtige Anmeldung. Al…


    ## Kernpunkte

    - Es ist rund um die Uhr unter der internen Nummer 4242 erreichbar oder über die eigene E-Mail-Adresse, die im Intranet angegeben ist.

    - Die CERT-Ex stuft jeden Vorfall in eine von 3 Schweregradstufen ein.

    - Ein Vorfall der Stufe 1 wird noch am selben Tag vom Support-Team bearbeitet.

    - Ein Vorfall der Stufe 2 mobilisiert die CERT-Ex, die innerhalb einer Stunde den Informationssicherheitsbeauftragten informiert.


