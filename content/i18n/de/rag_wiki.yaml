  sha256: 3c40a8e21f843ec2e85bd0b77f0fcb7177def2bd8b47c56db6976a58ac2f4c13
  text: '# Vereinbarung zur Telearbeit


    Alle Mitarbeitenden mit unbefristetem Vertrag können nach einer Einarbeitungszeit von 2 Monaten bis zu 3 Tage pro Woche in Telearbeit arbeiten. Praktikanten und Auszubildende sind auf 1 Tag pro Woche begrenzt, damit sie den Kontakt zu ihrem Betreuer halten.


    ## Kernpunkte

    - Eine Führungskraft kann mit einer Vorankündigung von 48 Stunden ausnahmsweise Anwesenheit verlangen.

    - Exemplia zahlt eine Pauschale von 2,50 Euro pro Telearbeitstag, höchstens 55 Euro pro Monat.

    - Auf Anfrage wird Ausstattung gestellt: ein 27-Zoll-Bildschirm, eine Tastatur, eine Maus und ein Headset.

    - Telearbeit aus dem Ausland ist aus steuerlichen und sozialversicherungsrechtlichen Gründen auf 20 Tage pro Kalenderjahr begrenzt und braucht die schriftliche Zustimmung der Führungskraft und der Personalabteilung.


