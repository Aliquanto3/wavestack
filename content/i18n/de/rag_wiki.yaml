  text: '# Überprüfung der Berechtigungen


    Eine Berechtigung ist ein Zugangsrecht zu einer Anwendung, einem gemeinsamen Ordner oder einer physischen Zone, wie in der Zugangsrichtlinie für Räumlichkeiten beschrieben. Dieses Dokument legt die Regeln für ihre regelmäßige Überprüfung fest.


    ## Kernpunkte

    - Das Konto einer Person, die Exemplia verlässt, wird am Tag ihres Austritts deaktiviert, und ihre Berechtigungen werden innerhalb von 48 Stunden entzogen; ein Konto ohne erkennbaren Inhaber, ein sogenanntes verwaistes Konto, wird sofort bei…

    - Festgestellte Abweichungen werden innerhalb von 15 Arbeitstagen korrigiert.


