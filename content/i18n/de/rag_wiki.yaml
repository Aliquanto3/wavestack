  text: '# Rundschreiben zu USB-Speichermedien


    Dieses Rundschreiben der deutschen Zentrale von Exemplia in Frankfurt gilt nur für Mitarbeitende an diesem Standort; es existiert nur auf Deutsch, da das lokale Team in dieser Sprache arbeitet. Private USB-Speichermedien dürfen an keinem Arbeitsplatz der Zentrale angeschlossen werden.


    ## Kernpunkte

    - Jede Mitarbeiterin und jeder Mitarbeiter, der einen USB-Speicher benötigt, erhält auf Anfrage einen von der IT-Abteilung ausgegebenen, verschlüsselten USB-Stick mit 256-Bit-Verschlüsselung.

    - Ein von der IT-Abteilung ausgegebener USB-Stick wird nach spätestens 2 Jahren gegen ein neues Modell ausgetauscht, unabhängig von seinem Zustand.

    - Ein verlorener oder gestohlener USB-Stick wird innerhalb von 24 Stunden der Sicherheitsabteilung gemeldet, genau wie ein verlorenes Notebook nach der allgemeinen Richtlinie zu Sicherheitsvorfällen.


