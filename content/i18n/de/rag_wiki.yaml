  sha256: 8be504097bb424770690745318d6af1ee6b1f5c46aeb62f2ff5e5dbb52f3022e
  text: '# Passwortrichtlinie


    Bei Exemplia hat ein Passwort für ein Benutzerkonto mindestens 14 Zeichen. Die Länge zählt mehr als die Komplexität: Empfohlen wird eine Passphrase aus vier oder fünf Wörtern ohne Bezug zueinander, zum Beispiel eine Folge zufällig gewählter Wörter, getrennt durch Bindestriche.


    ## Kernpunkte

    - Administratorkonten verlangen dagegen mindestens 20 Zeichen, und ihr Passwort wird vom Tresor des Betriebsteams erzeugt.

    - In diesen Fällen muss die Änderung innerhalb von 12 Stunden nach der Warnung des Sicherheitsteams erfolgen.

    - Nach 5 fehlgeschlagenen Anmeldeversuchen wird ein Konto für 15 Minuten gesperrt.

    - Bei der dritten Sperre am selben Tag bleibt das Konto gesperrt, bis der Support eingreift, erreichbar unter der Durchwahl 3100.


    ## Begriffe

    [[concept/durchwahl]] · [[concept/geschaftsleitung]] · [[concept/gesperrt]] · [[concept/konto]]


