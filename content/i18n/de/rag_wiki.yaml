  text: '# Dienstreisen und Spesenabrechnungen


    Jede Dienstreise wird vorab von der Führungskraft im Buchungstool Voyagex genehmigt, das die folgenden Regeln automatisch anwendet. Eine Buchung außerhalb von Voyagex wird nur ausnahmsweise erstattet, mit schriftlicher Begründung.


    ## Kernpunkte

    - Die erste Klasse ist erlaubt für eine Fahrt von mehr als 3 Stunden, die am Vortag der Abreise oder am selben Tag gebucht wird, wenn sie höchstens 20 % mehr kostet als die zweite.

    - Das Flugzeug ist erst ab viereinhalb Stunden Bahnfahrt erlaubt, in der Economy Class; die Business Class ist Flügen von mehr als 7 Stunden vorbehalten.

    - Eine Hotelübernachtung wird bis zu 130 Euro in Paris und 95 Euro in anderen Städten erstattet, Frühstück inbegriffen.

    - Eine Mahlzeit auf Reisen wird bis zu 22 Euro erstattet; ein Essen mit einem Kunden wird gegen Rechnung bis zu 60 Euro pro Person erstattet, mit dem Namen des eingeladenen Unternehmens.


