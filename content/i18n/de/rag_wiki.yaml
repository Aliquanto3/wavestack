  text: '# register


    Ein geheimes Dokument wird nie per E-Mail versendet: Es wird ausschließlich im Datenraum eingesehen, an einem Rechner ohne Internetverbindung, und jede Einsichtnahme wird in ein unterschriebenes Register eingetragen.


    ## Was die Quellen sagen

    - Ein geheimes Dokument wird nie per E-Mail versendet: Es wird ausschließlich im Datenraum eingesehen, an einem Rechner ohne Internetverbindung, und jede Einsichtnahme wird in ein unterschriebenes Register eingetragen. ([[source/classification]])

    - Das Ergebnis jedes Tests wird im Register des Betriebsteams festgehalten; ein Fehlschlag wird als Vorfall der Stufe 2 behandelt. ([[source/sauvegardes]])

    - Ein Dienstleister vergibt nicht ohne Zustimmung von Exemplia selbst Unteraufträge; jeder eingesetzte Unterauftragnehmer wird im Register der Unterauftragnehmer erfasst, das die Dienstleister-Einheit führt. ([[source/prestataires]])

    - Unterauftragsklausel: Der Dienstleister informiert Exemplia, bevor er einen Unterauftragnehmer einsetzt, der dann in das Register der Unterauftragnehmer aufgenommen wird und dieselben Klauseln trägt. ([[source/clauses_contrats]])

    - Dieses von der Dienstleister-Einheit geführte und im Klauselmuster genannte Register listet jeden Unterauftragnehmer, den ein Dienstleister von Exemplia einsetzt: seinen Namen, seine Funktion, das Land, in dem er Daten hostet oder verarbei… ([[source/registre_sous_traitants]])

    - Jeder Bereitschaftsanruf wird mit Uhrzeit, Grund und erreichter Person im Register des Betriebsteams festgehalten, das beim Erfahrungsbericht nach jedem Vorfall der Stufe 2 oder 3 herangezogen wird. ([[source/astreinte]])

    - Every visitor to the Manchester office receives a dated visitor badge at reception, after showing a photo ID and signing the visitor register. ([[source/uk_visitor_badges]])

    - Ein externes Audit kann die Überprüfung der Berechtigungen umfassen; dabei wird das Register der Überprüfungen der letzten zwei Jahre als Nachweis der wirksamen Zugangskontrolle vorgelegt. ([[source/revue_habilitations]])'
