  synthesis_text: 'Ein geheimes Dokument wird nie per E-Mail versendet: Es wird ausschließlich im Datenraum eingesehen, an einem Rechner ohne Internetverbindung, und jede Einsichtnahme wird in ein unterschriebenes Register eingetragen.'
