  text: '# Datensicherungen


    Die Daten von Exemplia folgen der 3-2-1-Regel: mindestens 3 Kopien aller Daten, auf 2 verschiedenen Datenträgern, davon 1 Kopie außerhalb des Hauptstandorts. Diese Regel gilt für die Dateiserver, die Datenbanken der Anwendungen und die E-Mail.


    ## Kernpunkte

    - Die Vollsicherung der Server läuft jeden Sonntag um 2 Uhr morgens.

    - In jeder Nacht unter der Woche kopiert um 22 Uhr eine inkrementelle Sicherung nur, was sich seit dem Vortag geändert hat.

    - Kritische Datenbanken, etwa Buchhaltung und Kundenverwaltung, werden tagsüber zusätzlich alle 4 Stunden gesichert.

    - Tägliche Sicherungen werden 35 Tage aufbewahrt, wöchentliche Sicherungen 12 Wochen, und eine monatliche Sicherung wird wegen der Buchhaltungspflichten 7 Jahre lang behalten.


