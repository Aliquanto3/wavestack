  text: '# E-Mail-Richtlinie, Version 1 (2024)


    Diese Version der E-Mail-Richtlinie, gültig seit Januar 2024, wird durch Version 2 ersetzt: Sie wird hier als Archiv aufbewahrt, um frühere Entscheidungen nachvollziehen zu können. Das berufliche Postfach von Exemplia ist ausschließlich der beruflichen Nutzung vorbehalten; eine gelegentliche privat…


    ## Kernpunkte

    - Jede Nachricht darf mit ihren Anhängen 10 MB nicht überschreiten; darüber hinaus ist ein temporärer Freigabelink zu verwenden.

    - Gesendete und empfangene Nachrichten werden 1 Jahr im Postfach aufbewahrt, danach automatisch archiviert und aus dem Hauptpostfach entfernt.

    - Eine versehentlich gelöschte Nachricht kann vom Support innerhalb von 30 Tagen nach der Löschung wiederhergestellt werden, danach ist sie verloren.


