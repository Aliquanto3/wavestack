  text: '# Disziplinarverfahren


    Dieses Dokument beschreibt die Schritte eines Disziplinarverfahrens bei Exemplia; es ist als vertraulich eingestuft, und der Zugang ist der Personalabteilung, der Geschäftsleitung und, bei einer eigenen Akte, der betroffenen Person selbst vorbehalten. Ein Verhaltensproblem oder ein Verstoß führt je…


