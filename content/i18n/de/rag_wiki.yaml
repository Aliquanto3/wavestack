  sha256: 94c913da23a8614f3873d71c0df2331c196c05c2aa4ed3c656d0bf606a0da8e5
  text: '# Verfahren der Jahresgespräche


    Dieses Dokument beschreibt das Jahresgespräch von Exemplia, das von der direkten Führungskraft jeder Person geführt wird; es ist als Personaldokument eingestuft. Das Gespräch findet jedes Jahr im ersten Quartal statt, zwischen Januar und März.


    ## Kernpunkte

    - Die Person füllt zunächst innerhalb der 2 Wochen vor dem festgelegten Termin eine Selbsteinschätzung aus; danach findet das Gespräch für mindestens 45 Minuten nur mit der direkten Führungskraft statt.

    - Das von der Führungskraft verfasste und von der Person gelesene Protokoll wird innerhalb von 10 Arbeitstagen nach dem Gespräch von beiden Seiten unterschrieben.

    - Die Protokolle werden 3 Jahre von der Personalabteilung aufbewahrt, um die Entwicklung der Ziele und des Weiterbildungsbedarfs einer Person über mehrere Jahre zu verfolgen.


    ## Begriffe

    [[concept/gesprach]] · [[concept/person]]


