  text: '# Physischer Zugang zu den Räumlichkeiten


    Jeder Standort von Exemplia ist in 3 Zonen unterteilt: normal (Empfang, Großraumbüro), eingeschränkt (sensible Besprechungsräume, technische Räume) und gesichert (Serverraum, Krisenraum). Ein persönliches Zugangsabzeichen, das jeder Person ab ihrem ersten Tag ausgestellt wird, gewährt Zugang zu den…


    ## Kernpunkte

    - Das Besucherabzeichen wird beim Verlassen am Empfang zurückgegeben; das Besucherregister wird 90 Tage aufbewahrt.

    - Das Abzeichen einer Person, die Exemplia verlässt, wird innerhalb von 24 Stunden nach ihrem Austritt deaktiviert.

    - Jeder Zugang, ob gewährt oder verweigert, wird protokolliert und 6 Monate aufbewahrt, einsehbar bei einer Sicherheitsuntersuchung oder einer Überprüfung der Berechtigungen.


    ## Begriffe

