  synthesis_text: Dieses Dokument beschreibt das Jahresgespräch von Exemplia, das von der direkten Führungskraft jeder Person geführt wird; es ist als Personaldokument eingestuft. Das Gespräch findet jedes Jahr im ersten Quartal statt, zwischen Januar und März.
