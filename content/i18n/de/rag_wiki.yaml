    - Ein Sicherheitsvorfall ist jedes Ereignis, das die Vertraulichkeit, Integrität oder Verfügbarkeit der Informationen von Exemplia bedroht: eine geöffnete Phishing-E-Mail, ein verlorener Laptop, ein entdecktes Virus, ein vertrauliches Dokume… ([[source/incidents]])

