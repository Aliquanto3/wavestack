    - Die vollständige Disziplinarakte einer Person wird 5 Jahre nach deren Austritt aus Exemplia aufbewahrt und dann anonymisiert, gemäß der Richtlinie zur Aufbewahrung personenbezogener Daten. ([[source/dossier_disciplinaire]])'
