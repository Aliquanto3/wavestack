  text: '# person


    Jede Person kann ihre Rechte auf Auskunft, Berichtigung und Löschung geltend machen, indem sie dem Datenschutzbeauftragten schreibt.


    ## Was die Quellen sagen

    - Jede Person kann ihre Rechte auf Auskunft, Berichtigung und Löschung geltend machen, indem sie dem Datenschutzbeauftragten schreibt. ([[source/donnees_personnelles]])

    - Eine Mahlzeit auf Reisen wird bis zu 22 Euro erstattet; ein Essen mit einem Kunden wird gegen Rechnung bis zu 60 Euro pro Person erstattet, mit dem Namen des eingeladenen Unternehmens. ([[source/deplacements]])

    - Sicherheitsbereitschaft, zuerst zu kontaktieren bei jedem größeren Vorfall nachts oder am Wochenende: Die einheitliche Bereitschaftsnummer ist 06 07 08 09 10, gefolgt von einem Anrufbeantworter, der zur Person der Wochenbereitschaft weiter… ([[source/astreinte]])

    - Dieses Dokument beschreibt die Schritte eines Disziplinarverfahrens bei Exemplia; es ist als vertraulich eingestuft, und der Zugang ist der Personalabteilung, der Geschäftsleitung und, bei einer eigenen Akte, der betroffenen Person selbst… ([[source/dossier_disciplinaire]])

    - Dieses Dokument beschreibt das Jahresgespräch von Exemplia, das von der direkten Führungskraft jeder Person geführt wird; es ist als Personaldokument eingestuft. ([[source/entretiens_annuels]])

    - Ein persönliches Zugangsabzeichen, das jeder Person ab ihrem ersten Tag ausgestellt wird, gewährt Zugang zu den für ihre Stelle notwendigen Zonen. ([[source/acces_physique]])

    - Das Konto einer Person, die Exemplia verlässt, wird am Tag ihres Austritts deaktiviert, und ihre Berechtigungen werden innerhalb von 48 Stunden entzogen; ein Konto ohne erkennbaren Inhaber, ein sogenanntes verwaistes Konto, wird sofort bei… ([[source/revue_habilitations]])

    - Jede Person bei Exemplia nimmt an einer zweistündigen Online-Schulung zur Informationssicherheit teil und besteht anschließend einen Fragebogen mit mindestens 8 richtigen Antworten von 10, um sie zu erhalten. ([[source/formation_securite]])'
