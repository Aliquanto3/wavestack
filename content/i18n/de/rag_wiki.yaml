  sha256: 90721162812ee2e032f8e4fe446cf84c001d0adb946f87887ff10434ee45dc65
  text: '# Klassifizierung von Informationen


    Jede Information, die Exemplia erzeugt oder erhält, trägt eine der folgenden 4 Klassifizierungsstufen: Öffentlich, Intern, Vertraulich und Geheim. Ein Dokument ohne Kennzeichnung wird standardmäßig als Intern behandelt.


    ## Kernpunkte

    - Ein vertrauliches Dokument verlässt das Netz von Exemplia nur verschlüsselt, mit dem sicheren Austauschwerkzeug Transvault; der Freigabelink läuft nach 7 Tagen ab.

    - Vertrauliche und geheime Papierdokumente werden in einem verschlossenen Schrank aufbewahrt und im Aktenvernichter der Stufe P-5 vernichtet.

    - Jedes Jahr im Januar überprüft die Leitung jeder Abteilung die Klassifizierung der 20 meistgelesenen Dokumente ihres Bereichs.


