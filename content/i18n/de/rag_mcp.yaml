# V1.2 story 20 (CAP-18): die zusammengestellte Kette der RAG-Werkstatt als MCP-Server, nur lesend.
# Dieselben Schlüssel und Variablen wie `content/rag_mcp.yaml`.
server:
  instructions_text: "Demonstrationsserver von WaveStack: Er durchsucht das fiktive Exemplia-Korpus mit der in der Werkstatt zusammengestellten RAG-Architektur und liefert zitierte Passagen. Er schreibt nichts: Sie verfassen die Antwort aus den Passagen und zitieren sie."
tools:
  search_documents:
    description_text: "Sucht im fiktiven Exemplia-Korpus (ein erfundenes Unternehmen) die Passagen, die einer Frage am nächsten sind, mit der freigegebenen RAG-Architektur. Liefert höchstens top_k gereihte Passagen, jede mit Dokument, Titel, Position, Score und Zitat. Nur lesend; der Personalabteilung vorbehaltene Dokumente werden nie geliefert."
    question_text: "Die Frage in natürlicher Sprache (höchstens 500 Zeichen)."
    top_k_text: "Die gewünschte Anzahl Passagen, von 1 bis 10."
  describe_architecture:
    description_text: "Sagt, welche RAG-Architektur dieser Server freigibt, ihre Schritte und ihre Grenzen (fiktives Korpus, nur lesend, keine Generierung)."
reasons:
  invalid: "Von der Werkstatt abgelehnte Kette: {reason}"
  whole_corpus: "„{option}“ liest das ganze Korpus ohne Index und ohne Suche: Es gibt kein Suchwerkzeug freizugeben."
  searches_itself: "„{option}“ führt seine eigene Suche mit dem generativen Modell: Freigeben lässt sich nur eine Kette, deren Suche ihre Schritte erledigen."
  model_stage: "Der Schritt „{stage}“ ruft das generative Modell auf oder ist noch nicht freigebbar: Entfernen Sie ihn, um die Kette freizugeben."
  head: "Freigeben lässt sich nur der Kopf des RAG-Bausteins (Aufteilung nach Absätzen in der ausgelieferten Größe, Embedding-Modell des Bausteins, sqlite-vec): Sein Index wird gelesen, nie geschrieben."
describe:
  composed_label_text: "Zusammengestellte Kette"
  stage_text: "{stage}: {option}"
  header_text: "Freigegebene Architektur: {architecture}."
  corpus_text: "Korpus: die mit WaveStack ausgelieferten fiktiven Dokumente von Exemplia, nie die Arbeitskopie der Werkstatt."
  hr_text: "Zugriffsprofil „alle“: Die Passagen der Personalabteilung vorbehaltener Dokumente werden vor der Antwort entfernt, ihre Anzahl wird genannt."
  frozen_text: "Die Kette wird beim Start des Servers eingefroren: Eine Änderung in der Werkstatt zählt erst nach einem Stopp und einem Start."
  not_run_text: "Der Server führt die Aufteilung, das Embedding, den Index und die Suche aus; weder der Kontext noch die Generierung laufen für Sie."
  limits:
    - "Nur lesend: Keine Datei, kein Index und kein Cache wird geschrieben."
    - "Weder ein generatives noch ein Cloud-Modell wird aufgerufen; nur die lokalen Modelle für Embedding und gegebenenfalls Reranking dienen."
    - "Ein Aufruf nach dem anderen: Ist die Werkstatt belegt, wird der Aufruf abgelehnt; versuchen Sie es erneut."
    - "Didaktische Demonstration: Die Dokumente sind fiktiv."
search:
  citation_text: "{title} ({doc_id}, Auszug {position})"
  passage_text: "{rank}. {citation} — Score {score}\n{text}"
  header_text: "{n} Passage(n) gefunden mit der Architektur „{architecture}“."
  removed_text: "{n} Passage(n) eines der Personalabteilung vorbehaltenen Dokuments aus der Liste entfernt."
  none_text: "Keine Passage."
  no_score_text: "ohne Score"
card:
  title_text: "Über MCP freigeben"
  hint_text: "Gibt die Kette der Werkstatt als nur lesenden MCP-Server auf diesem Rechner frei (127.0.0.1): Ein Client wie Claude Code kann dann im Exemplia-Korpus suchen und zitierte Passagen erhalten. Die Antwort schreibt das Modell des Clients."
  state_label_text: "Zustand"
  state_on_text: "freigegeben"
  state_off_text: "gestoppt"
  start_text: "Starten"
  stop_text: "Stoppen"
  address_label_text: "Adresse"
  token_label_text: "Token"
  token_hidden_text: "•••••••• (verborgen)"
  reveal_text: "Anzeigen"
  hide_text: "Verbergen"
  copy_token_text: "Token kopieren"
  copy_command_text: "Befehl kopieren"
  copied_text: "Kopiert."
  copy_failed_text: "Kopieren nicht möglich: Markieren Sie den Text von Hand."
  chain_label_text: "Freigegebene Kette"
  frozen_text: "Beim Start eingefroren: Um die geänderte Kette freizugeben, stoppen und dann starten."
  tools_label_text: "Werkzeuge"
  risk_label_text: "Risiko"
  rule_label_text: "Regel"
  hidden_tool_text: "nicht angekündigt (Regel nicht „erlauben“)"
  command_label_text: "In Claude Code einbinden"
  command_note_text: "Claude Code speichert dieses Token in seiner eigenen Konfiguration; nach dem nächsten Start gilt es nicht mehr."
  copilot_text: "Copilot Studio verlangt eine öffentliche HTTPS-Adresse: Die Anwendung stellt keine bereit (weder Tunnel noch Hosting)."
