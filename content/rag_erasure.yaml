  sentinel_active_text: "active, dans cette page seulement"
  sentinel_inactive_text: "inactive"
  scope_text: "L'activation vit dans cette page et part avec chaque requête : le corpus livré, l'index, la copie de travail et les contextes ne changent pas."
  code_text: "Code recherché : {code}"
