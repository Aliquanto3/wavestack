  summary_text: Un avertissement écrit reste au dossier 3 ans ; passé ce délai, il n'est plus pris en compte pour une mesure ultérieure, sauf récidive du même manquement avant son effacement. Les comptes rendus sont conservés 3 ans par les ressources humaines, pour suivre l'évolution des objectifs et des besoins de formation d'un collaborateur sur plusieurs années.
  sha256: 559cc1d7ac38e265b4cab483ce4f748c2dc3db70a0eac619a4be7d04efc97b0f
- id: L1-acces_physique#1
  level: 1
  children: [acces_physique#1, acces_physique#2, revue_habilitations#1, revue_habilitations#2]
  sources: [acces_physique, revue_habilitations]
  audience: all
  summary_text: Une fois par an, l'équipe sécurité mène une revue complète de toutes les habilitations sensibles, celles qui donnent accès aux données personnelles, à la comptabilité ou aux zones sécurisées, indépendamment des revues trimestrielles des responsables.
  sha256: 2f48021689ed973fac4d3008a215fae696924bf3c2b9b7bcf3a3856c2b7477c8
- id: L2-teletravail#1
  level: 2
  children: [L1-teletravail#1, L1-teletravail#2, L1-deplacements#2]
  sources: [teletravail, donnees_personnelles, deplacements, sauvegardes]
  audience: all
  summary_text: Exemplia verse une indemnité de 2,50 euros par jour télétravaillé, dans la limite de 55 euros par mois. La première classe est admise pour un trajet de plus de 3 heures réservé la veille du départ ou le jour même, quand elle ne coûte pas plus de 20 % de plus que la seconde. Pour un déplacement de plus de 5 jours, une avance sur frais peut être demandée, dans la limite de 800 euros.
  sha256: 0f2846ef06ed5fff90fad30bb1ce70e44f9349242252db3712cc094b4c870ee9
- id: L2-classification#1
  level: 2
