  audience: all
  summary_text: Un incident de niveau 2 mobilise la CERT-Ex, qui informe le responsable de la sécurité des systèmes d'information dans l'heure. L'activation du plan est décidée par le directeur de site de Lyon, ou par la cellule de crise si l'incident dépasse ce seul site.
