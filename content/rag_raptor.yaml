- id: L1-mots_de_passe#1
  level: 1
  children: [mots_de_passe#1, mots_de_passe#2, mots_de_passe#4]
  sources: [mots_de_passe]
  audience: all
  summary_text: 'Il est interdit de noter un mot de passe sur papier, dans un fichier texte ou dans la messagerie, et de réutiliser un mot de passe professionnel sur un site personnel. Un contrôle automatique compare chaque nouveau mot de passe à une liste de 100 000 mots de passe courants ou déjà divulgués : un mot de passe présent dans cette liste est refusé, même s''il compte plus de 14 caractères.'
  sha256: 9ac50984c25d4dc647d0edda38a6369065757d574c763e2b2a3b499103668e9d
- id: L1-teletravail#1
  level: 1
  children: [teletravail#1, donnees_personnelles#2, deplacements#1, deplacements#4]
  sources: [teletravail, donnees_personnelles, deplacements]
  audience: all
  summary_text: Tout déplacement professionnel est validé à l'avance par le manager dans l'outil de réservation Voyagex, qui applique automatiquement les règles ci-dessous. Les notes de frais sont saisies dans l'application NotaFrais au plus tard 30 jours après la dépense, avec la photo de chaque justificatif.
  sha256: c515054cd45cf1aea88674aec60f063c2968fecb65ed513192b370c89dca1db3
- id: L1-teletravail#2
  level: 1
  children: [teletravail#2, deplacements#3]
  sources: [teletravail, deplacements]
  audience: all
  summary_text: Exemplia verse une indemnité de 2,50 euros par jour télétravaillé, dans la limite de 55 euros par mois. Un repas pris en déplacement est remboursé jusqu'à 22 euros ; le repas pris avec un client est remboursé sur facture, à hauteur de 60 euros par personne, avec le nom de l'entreprise invitée.
  sha256: fd54cb05bac8b2d36020446cf81325f7d78665ac8e844f622a50e6c6d4daa50c
- id: L1-classification#1
  level: 1
  children: [classification#1, classification#3, classification#4, incidents#1]
  sources: [classification, incidents]
  audience: all
  summary_text: 'Toute information produite ou reçue par Exemplia porte l''un des 4 niveaux de classification suivants : Public, Interne, Confidentiel et Secret. Une erreur de classification n''est pas une faute, mais une information Secret diffusée par erreur doit être signalée comme un incident de sécurité.'
  sha256: e2d04d1f71783f7a0325f81ec8a131437495872e41f14da2759dac0dfbb0f9a1
- id: L1-classification#2
  level: 1
  children: [classification#2, ia_generative#1, ia_generative#2]
  sources: [classification, ia_generative]
  audience: all
  summary_text: 'Le niveau Confidentiel protège ce dont la divulgation nuirait à Exemplia ou à ses clients : contrats, données personnelles, résultats financiers avant publication. Les informations de niveau Secret ne sont confiées à aucun outil d''IA, même interne. Il est interdit d''y coller un contrat, un extrait de code source d''Exemplia, des données personnelles ou un compte rendu de réunion interne.'
  sha256: 199ba132590a17bf95466d944189839cfd85d3c612255cf489ddea977f2d0c7b
- id: L1-incidents#3
  level: 1
  children: [incidents#3, gestion_crise#1, astreinte#1, astreinte#2]
  sources: [incidents, gestion_crise, astreinte]
  audience: all
  summary_text: Un incident de niveau 2 mobilise la CERT-Ex, qui informe le responsable de la sécurité des systèmes d'information dans l'heure. Cette annexe de la procédure de gestion de crise liste les contacts à joindre en dehors des heures ouvrées, jour et nuit, selon le domaine concerné.
  sha256: a3f831e07fbf83d6057f77b256abd88e97c0981d30a2141c7bede1395febcebb
- id: L1-incidents#4
  level: 1
  children: [incidents#4, sauvegardes#3, registre_sous_traitants#3, astreinte#3]
  sources: [incidents, sauvegardes, registre_sous_traitants, astreinte]
  audience: all
  summary_text: Le résultat de chaque test est consigné dans le registre de l'équipe d'exploitation ; un échec est traité comme un incident de niveau 2. Chaque appel d'astreinte est consigné, avec l'heure, le motif et la personne jointe, dans le registre tenu par l'équipe d'exploitation, consulté lors du retour d'expérience qui suit tout incident de niveau 2 ou 3.
  sha256: 7f2f8b58e8fcb0575f84351ace6b72f8d38b0e1b74e5ee4f62145bc7ead63f38
- id: L1-donnees_personnelles#1
  level: 1
  children: [donnees_personnelles#1, donnees_personnelles#3]
  sources: [donnees_personnelles]
  audience: all
  summary_text: Le registre des traitements d'Exemplia fixe pour chaque traitement une durée active, pendant laquelle les services utilisent la donnée, puis une durée d'archivage, pendant laquelle seul le service juridique peut y accéder. Un service qui a besoin de garder une donnée plus longtemps, par exemple pour un litige en cours, doit obtenir une dérogation écrite du service juridique avant la purge.
  sha256: 17562c0d1a7858dbcfdb8c34d1156433dbdb8a054aff9ce6aa2a1517811f2b39
- id: L1-ia_generative#3
  level: 1
  children: [ia_generative#3, entretiens_annuels#1, formation_securite#1, formation_securite#2]
  sources: [ia_generative, entretiens_annuels, formation_securite]
  audience: hr
  summary_text: Avant d'obtenir l'accès à ExempliaGPT, chaque collaborateur suit une formation en ligne de 3 heures, puis valide un questionnaire avec au moins 8 bonnes réponses sur 10. Chaque collaborateur d'Exemplia suit une formation à la sécurité de l'information de 2 heures, en ligne, puis valide un questionnaire d'au moins 8 bonnes réponses sur 10 pour l'obtenir.
  sha256: ea22e4f547248d3055b4d7d3f51fd0ffd8d852db25e7932ebb4a231286495a67
- id: L1-deplacements#2
  level: 1
  children: [deplacements#2, sauvegardes#1, sauvegardes#2]
  sources: [deplacements, sauvegardes]
  audience: all
  summary_text: La première classe est admise pour un trajet de plus de 3 heures réservé la veille du départ ou le jour même, quand elle ne coûte pas plus de 20 % de plus que la seconde. Pour les applications critiques, la perte de données maximale admise est de 4 heures et le service doit repartir en moins de 8 heures.
  sha256: dc665c90e595356deed5e99162350e8adb6d88c09e677e77da079e1ed9b38810
- id: L1-prestataires#1
  level: 1
  children: [prestataires#1, prestataires#2, clauses_contrats#1, registre_sous_traitants#1]
  sources: [prestataires, clauses_contrats, registre_sous_traitants]
  audience: all
  summary_text: 'Ce registre, tenu par la cellule fournisseurs et cité par le modèle de clauses de sécurité, liste chaque sous-traitant utilisé par un prestataire d''Exemplia : son nom, sa fonction, le pays où il héberge ou traite les données, et le niveau du prestataire qui le mandate.'
  sha256: 20d1f58fec94bd9cba4ad6bc6f59a122e6ab2a2b09a749a91ecc565d802d3039
- id: L1-prestataires#3
  level: 1
  children: [prestataires#3, clauses_contrats#2, clauses_contrats#3, registre_sous_traitants#2]
  sources: [prestataires, clauses_contrats, registre_sous_traitants]
  audience: all
  summary_text: À la fin d'un contrat, le prestataire efface les données d'Exemplia et le confirme par écrit dans un délai fixé par les clauses du contrat. ImpressionPro, impression des documents de communication, France, prestataire standard.
  sha256: e347c397d4c85dc7da1af8512582be63dfa1e66943416f58917393aadefdbbee
- id: L1-gestion_crise#2
  level: 1
  children: [gestion_crise#2, gestion_crise#3]
  sources: [gestion_crise]
  audience: all
  summary_text: La cellule de crise comprend, au minimum, le responsable de la sécurité des systèmes d'information, le directeur de la communication, le délégué à la protection des données si des données personnelles sont concernées, et un représentant de la direction juridique.
  sha256: f9bb85bd1c362b55fc8b8bfba124c85644c03427b2aa1fd84893212f9c3b14af
- id: L1-charte_messagerie_v1#1
  level: 1
  children: [charte_messagerie_v1#1, charte_messagerie_v2#1, note_changement_messagerie#1, note_changement_messagerie#3]
  sources: [charte_messagerie_v1, charte_messagerie_v2, note_changement_messagerie]
  audience: all
  summary_text: 'Cette version remplace la version 1 depuis le 1er janvier 2026, à la suite du changement de fournisseur de messagerie décrit dans la note de changement associée : c''est la version en vigueur. La version 1 de la charte reste consultable comme archive, pour comprendre les décisions prises avant ce changement, mais elle ne s''applique plus depuis le 1er janvier 2026.'
  sha256: e9e8364466221431ab2ac19b7d7583482a8b240712eb450155f6a9fb25ee0507
- id: L1-charte_messagerie_v1#2
  level: 1
  children: [charte_messagerie_v1#2, charte_messagerie_v2#2, note_changement_messagerie#2]
  sources: [charte_messagerie_v1, charte_messagerie_v2, note_changement_messagerie]
  audience: all
  summary_text: Un message envoyé par erreur à un mauvais destinataire externe reste signalé à la cellule de réponse aux incidents dans l'heure, surtout s'il contient des informations confidentielles ou des données personnelles. Ensuite, la durée de conservation dans la boîte principale passe de 1 an à 3 ans, pour répondre à une nouvelle obligation réglementaire du secteur.
  sha256: e978ce758be6fd0c51b49a3bfcf54ba8a4dbc0d2f45d639f38d0aff1595f419b
- id: L1-rundschreiben_usb#1
  level: 1
  children: [rundschreiben_usb#1, rundschreiben_usb#2, rundschreiben_usb#3]
  sources: [rundschreiben_usb]
  audience: all
  summary_text: Jede Mitarbeiterin und jeder Mitarbeiter, der einen USB-Speicher benötigt, erhält auf Anfrage einen von der IT-Abteilung ausgegebenen, verschlüsselten USB-Stick mit 256-Bit-Verschlüsselung. Externe Besucher und Lieferanten dürfen an der Zentrale keinen eigenen USB-Speicher anschließen; für einen Datenaustausch steht ein gesicherter Übertragungsdienst zur Verfügung, der vom Empfang vermittelt wird.
  sha256: e654a5dc2f84a2d5e79a7c9eaca2aa3f0b67080987f6754c5105fdae7081babd
- id: L1-uk_visitor_badges#1
  level: 1
  children: [uk_visitor_badges#1, uk_visitor_badges#2]
  sources: [uk_visitor_badges]
  audience: all
  summary_text: The badge must be worn visibly at all times on site, and the visitor must be escorted by an Exemplia employee in any restricted or secure zone, exactly as in the general physical access policy. The visitor register, with the visitor's name, company, host and times of arrival and departure, is kept for 90 days, in line with the data retention rules of the physical access policy, then deleted.
  sha256: ab67ba725cb3bb384ca50c368bb90393d7662f43a067ef2154fe8a9e279f8dcf
- id: L1-plan_continuite_lyon#1
  level: 1
  children: [plan_continuite_lyon#1, plan_continuite_lyon#2]
  sources: [plan_continuite_lyon]
  audience: all
  summary_text: Si le site principal de Lyon devient inaccessible, pour cause d'incendie, de panne électrique prolongée ou d'évacuation, le site de repli de Villeurbanne est activé dans les 4 heures qui suivent la décision du directeur de site. L'activation du plan est décidée par le directeur de site de Lyon, ou par la cellule de crise si l'incident dépasse ce seul site.
  sha256: 0941410456a8b5dbb2755b8c6859dd78418d94b55a511a7a94d1ec92bf162b9d
- id: L1-grille_remunerations#1
  level: 1
  children: [grille_remunerations#1, grille_remunerations#2, grille_remunerations#3]
  sources: [grille_remunerations]
  audience: hr
  summary_text: Toute question sur son propre positionnement dans la grille est adressée à son responsable des ressources humaines ; la grille complète, avec les montants, n'est jamais diffusée hors des ressources humaines et de la direction, pour préserver la confidentialité des rémunérations individuelles.
  sha256: e7a6328d29c1232f5b99aeeb58b4794ca29b51980450b0a681fa7e08606620fd
