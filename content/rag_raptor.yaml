  sources: [classification, incidents, ia_generative, charte_messagerie_v1, charte_messagerie_v2, note_changement_messagerie]
  audience: all
  summary_text: Un message envoyé par erreur à un mauvais destinataire externe reste signalé à la cellule de réponse aux incidents dans l'heure, surtout s'il contient des informations confidentielles ou des données personnelles. La version 1 de la charte reste consultable comme archive, pour comprendre les décisions prises avant ce changement, mais elle ne s'applique plus depuis le 1er janvier 2026.
  sha256: ba26ad4d757cad9973ed9283cdd6efa152a584ae5157b671e3b339cea47765ca
