traps:
- id: two_judges
  kind: two_judges
  question_id: q_fact_badge
  criterion: faithfulness
  title_text: Deux juges, deux verdicts
  explain_text: 'Même question, même réponse : le juge local la dit fidèle, le juge cloud non. Chacun
    a sa justification, et les deux sont plausibles.'
  answer_text: Le badge est désactivé sous une semaine.
  verdicts:
    local:
      verdict: 'yes'
      why_text: 'La réponse reste dans le thème du contexte : un badge désactivé après le départ.'
    cloud:
      verdict: 'no'
      why_text: Le contexte ne dit rien d'une semaine ; la règle livrée est de 24 heures, donc la durée
        est inventée.
- id: variance
  kind: variance
  question_id: q_temporal_taille
  criterion: accuracy
  title_text: Variance d'un même juge
  explain_text: 'Le même juge, sur le même cas, deux fois : deux verdicts. Rien n''a changé dans le cas
    ; la température et l''ordre des passages suffisent.'
  answer_text: Une pièce jointe ne dépasse pas 10 Mo.
  causes:
  - temperature
  - passage_order
  passes:
  - verdict: 'yes'
    why_text: La réponse donne une taille de pièce jointe, comme attendu.
  - verdict: 'no'
    why_text: La taille donnée, 10 Mo, est celle de l'ancienne version, pas des 25 Mo attendus.
- id: two_tools
  kind: two_tools
  question_id: q_multi_crise
  title_text: Deux outils, deux définitions
  explain_text: '« Fidélité » n''a pas une définition : Ragas compte les affirmations soutenues, DeepEval
    celles qui ne sont pas contredites. Sur la même réponse, les deux notes diffèrent ; elles sont recalculées
    ici depuis les mêmes affirmations étiquetées.'
  answer_text: Appelez le numéro unique d'astreinte, le 06 07 08 09 10, à toute heure. L'astreinte répond
    sous 30 minutes. Elle relève de la direction financière.
  claims:
  - text: Il existe un numéro unique d'astreinte.
    label: supported
  - text: Ce numéro est le 06 07 08 09 10.
    label: supported
  - text: On peut l'appeler à toute heure.
    label: supported
  - text: L'astreinte répond sous 30 minutes.
    label: unsupported
  - text: L'astreinte relève de la direction financière.
    label: contradicted
- id: ranking
  kind: ranking
  title_text: Le juge change le classement
  explain_text: Sur le même jeu, le juge local classe « dense » avant « hybrid » et le juge cloud l'inverse.
    Choisir le juge, c'est choisir le gagnant.
