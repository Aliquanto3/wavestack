      unsupported: non soutenue
      contradicted: contredite
    ragas_text: 'Fidélité au sens de Ragas : affirmations soutenues par le contexte / affirmations = {value}'
    deepeval_text: 'Fidélité au sens de DeepEval : affirmations non contredites par le contexte / affirmations
      = {value}'
    ranking_text: 'Classement recalculé à partir des verdicts enregistrés, moyenne de tous les verdicts
      du juge sur l''architecture :'
    rank_line_text: '{rank}. {preset} ({value}, n = {n})'
  sheet:
    title_text: Fiche de la vue Évaluer
    body_text: 'Un juge LLM est un modèle qui note la réponse d''un autre. Il se trompe, et pas toujours
      comme un humain. Biais d''auto-préférence : un modèle note mieux les réponses de sa propre famille,
      donc un juge n''évalue jamais un modèle de son éditeur (la famille est l''éditeur selon la table
      des éditeurs ; Gemma et Gemini y sont deux familles distinctes, ce qui est une limite). Le jeu livré
      est construit pour la démonstration : n est petit, les agrégats ne prouvent rien. Une annotation
      « proposée » n''est pas une annotation humaine tant qu''elle n''est pas validée.'
  prompts:
    context_precision: Tu es un juge. Les passages ci-dessous sont-ils pertinents pour répondre à la question
      ? Réponds « yes » si tous le sont, « partly » si une partie l'est, « no » si aucun ne l'est.
    faithfulness: Tu es un juge. La réponse ne dit-elle que ce que le contexte soutient ? Réponds « yes
      » si chaque affirmation est dans le contexte, « partly » si certaines n'y sont pas, « no » si la
      réponse contredit ou invente.
    relevance: Tu es un juge. La réponse traite-t-elle la question posée ? Réponds « yes », « partly »
      ou « no ».
    accuracy: Tu es un juge. La réponse s'accorde-t-elle avec la réponse attendue ? Réponds « yes », «
      partly » (incomplète) ou « no » (contradictoire).
    correct_refusal: Tu es un juge. La documentation ne contient pas la réponse à cette question. La réponse
      refuse-t-elle de répondre ? Réponds « yes » si elle refuse, « partly » si elle hésite, « no » si
      elle invente une réponse.
    labels:
      question: 'Question :'
      context: 'Contexte :'
      answer: 'Réponse :'
      expected: 'Réponse attendue :'
    format: 'Réponds uniquement par un objet JSON {"verdict": "yes|partly|no", "why": "une phrase"}.'
refusal_markers:
- je ne sais pas
- pas couvert
- ne couvre pas
- n'est pas dans la documentation
- aucune information
