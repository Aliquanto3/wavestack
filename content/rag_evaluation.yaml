    judge_text: avec
    criterion_text: sur
    busy_text: Jugement en cours…
    refused_text: 'Jugement refusé : {reason}'
    unavailable_text: L'évaluation n'est pas joignable.
    no_answer_text: Cette exécution n'a pas de réponse à juger.
    failed_text: 'Le jugement a échoué : {reason}'
  traps:
    title_text: Quatre pièges des juges
    hint_text: 'Quatre cas livrés, rejoués depuis leur enregistrement : aucun modèle, aucun réseau.'
    badge_text: Cas enregistré, aucun appel au modèle
    failed_text: Piège introuvable.
