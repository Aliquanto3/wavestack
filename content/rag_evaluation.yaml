# Story 15 (CAP-11) : textes de la vue Évaluer, jeu enregistré, annotations de référence et
# quatre pièges des juges. Les verdicts, rangs, étiquettes d'affirmations et préréglages sont
# communs aux trois langues (le test le vérifie) ; seuls les textes et réponses sont traduits.
# PROVENANCE : `constructed` = jeu écrit à la main pour la démonstration (aucun modèle réel n'a
# été lancé) ; Anaël le réenregistre avec un vrai juge local non Qwen et un vrai juge cloud, puis
# passe `provenance.kind` à `recorded` avec sa date. Les annotations (`annotated_by: draft`) sont
# proposées par le développeur, à valider par Anaël.
texts:
  title_text: 'Évaluer : des juges face à la référence'
  hint_text: 'Pour chaque question préparée, chaque architecture et chaque critère : le verdict de chaque
    juge, l''annotation de référence, l''accord ou le désaccord. Les moyennes ne vivent que dans cet onglet,
    toujours avec leur n. Les jugements en direct se demandent un à un, jamais « tout évaluer ».'
  banner_text: 'Démonstration, pas un banc : n = {n} questions, {a} architectures, {j} juges'
  reference_text: Référence
  annotation_draft_text: Annotation de référence proposée, à valider
  annotation_human_text: Annotée par {by} le {on}
  provenance_constructed_text: Cas construit pour la démonstration (à enregistrer avec {local} et {cloud})
  provenance_recorded_text: Enregistré le {date} avec {local} et {cloud}
  translated_text: Justifications traduites de l'enregistrement ({lang})
  session_source_text: Exécution de cette session
  recorded_source_text: Jeu enregistré
  question_col_text: Question
  architecture_col_text: Architecture
  roles:
    local: local
    cloud: cloud
  recall_text: rappel@{k}
  mrr_text: MRR
  not_applicable_text: sans objet
  rule_text: 'règle : refus {value}'
  rule_values:
    'yes': oui
    'no': non
  criteria:
    context_precision:
      label_text: Précision du contexte
      explain_text: Les passages du contexte sont-ils pertinents pour la question ?
    faithfulness:
      label_text: Fidélité
      explain_text: La réponse ne dit-elle que ce que le contexte soutient ?
    relevance:
      label_text: Pertinence
      explain_text: La réponse traite-t-elle la question posée ?
    accuracy:
      label_text: Exactitude
      explain_text: La réponse s'accorde-t-elle avec la réponse attendue ?
    correct_refusal:
      label_text: Refus correct
      explain_text: Sur une question sans réponse dans le corpus, la réponse refuse-t-elle de répondre
        ?
  verdicts:
    'yes': oui
    partly: en partie
    'no': non
    unreadable: illisible
  agreement:
    agree_text: accord
    disagree_text: 'désaccord : juge {judge}, référence {reference}'
    unannotated_text: non annoté
    unreadable_text: illisible, compté à part
    none_text: pas de verdict
  why:
    context_precision:
      yes_text: Les passages fournis traitent bien la question.
      partly_text: Une partie des passages est hors sujet ou manque.
      no_text: Les passages fournis ne permettent pas de répondre.
    faithfulness:
      yes_text: Chaque affirmation de la réponse figure dans le contexte.
      partly_text: Certaines affirmations ne figurent pas dans le contexte.
      no_text: La réponse affirme des choses que le contexte ne soutient pas.
    relevance:
      yes_text: La réponse traite la question posée.
      partly_text: La réponse n'en traite qu'une partie.
      no_text: La réponse est à côté de la question.
    accuracy:
      yes_text: La réponse s'accorde avec la réponse attendue.
      partly_text: La réponse est incomplète par rapport à la réponse attendue.
      no_text: La réponse contredit la réponse attendue.
    correct_refusal:
      yes_text: La réponse refuse, comme il le faut sans passage utile.
      partly_text: La réponse hésite entre refuser et répondre.
      no_text: La réponse invente au lieu de refuser.
  aggregates:
    title_text: Agrégats par architecture
    hint_text: Moyenne des verdicts (oui = 1, en partie = 0,5, non = 0), pour chaque juge et pour la référence.
      Les verdicts illisibles sont comptés à part, hors moyenne.
    n_text: n = {n}
    too_few_text: trop peu pour conclure
    unreadable_text: '{n} illisible(s), hors moyenne'
    agreement_text: 'accord avec la référence : {rate}'
    who:
      reference: Référence
      rule: Règle
      local: Juge local
      cloud: Juge cloud
    none_text: Rien à agréger.
  panel:
    title_text: Panel de juges
    generator_text: 'Modèle jugé : {model} ({family})'
    no_generator_text: 'Aucune exécution de cette session à juger : le panel s''applique au modèle qui
