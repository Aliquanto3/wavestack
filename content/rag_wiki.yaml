  sha256: 4c75e409d59c251c1f75e381ecb495cf25a645b35e959c8703547929dbc1fa70
  text: '# Sauvegardes


    Les données d''Exemplia suivent la règle 3-2-1 : au moins 3 copies de chaque donnée, sur 2 supports différents, dont 1 copie conservée hors du site principal. Cette règle s''applique aux serveurs de fichiers, aux bases de données des applications et à la messagerie.


    ## Points clés

    - La sauvegarde complète des serveurs a lieu chaque dimanche à 2 h du matin.

    - Chaque nuit de la semaine, à 22 h, une sauvegarde incrémentale copie uniquement ce qui a changé depuis la veille.

    - Les bases de données critiques, comme la comptabilité et la gestion des clients, sont en plus sauvegardées toutes les 4 heures en journée.

    - Les sauvegardes quotidiennes sont conservées 35 jours, les sauvegardes hebdomadaires 12 semaines et une sauvegarde mensuelle est gardée 7 ans pour les obligations comptables.


