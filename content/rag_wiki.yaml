    - Chaque incident de niveau 2 ou 3 donne lieu à un retour d''expérience écrit, rédigé sous 15 jours ouvrés, qui décrit la chronologie, la cause et les mesures prises pour éviter qu''il ne se reproduise. ([[source/incidents]])

    - À la fin d''un contrat, le prestataire efface les données d''Exemplia et le confirme par écrit dans un délai fixé par les clauses du contrat. ([[source/prestataires]])

    - Le passage d''un échelon à l''autre est automatique après 2 ans, sauf gel motivé par écrit. ([[source/grille_remunerations]])

    - Une anomalie de comportement ou un manquement donne lieu, selon sa gravité, à l''une de ces mesures : un rappel oral, un avertissement écrit versé au dossier, une mise à pied de 1 à 5 jours sans salaire, ou un licenciement pour faute. ([[source/dossier_disciplinaire]])'
