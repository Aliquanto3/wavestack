  sha256: d670ca2a1e6810a092ca3a9dcec6392022eb4d4f547d7c6c74234fded6db53b4
  text: '# Usage de l''IA générative


    Exemplia encourage l''usage de l''intelligence artificielle générative pour gagner du temps sur la rédaction, la synthèse et la traduction, dans le respect de cette charte. Elle s''applique aux assistants conversationnels, aux générateurs d''images et aux outils de complétion de code.


    ## Points clés

    - Avant d''obtenir l''accès à ExempliaGPT, chaque collaborateur suit une formation en ligne de 3 heures, puis valide un questionnaire avec au moins 8 bonnes réponses sur 10.

    - Un rappel de 45 minutes est obligatoire chaque année.

    - Le comité IA, composé de 6 membres issus de la sécurité, du juridique, des ressources humaines et des métiers, examine chaque nouvel outil avant son adoption, dans un délai de 6 semaines.


