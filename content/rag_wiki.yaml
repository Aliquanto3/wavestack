  text: '# incident


    Une erreur de classification n''est pas une faute, mais une information Secret diffusée par erreur doit être signalée comme un incident de sécurité.


    ## Ce qu''en disent les sources

    - Une erreur de classification n''est pas une faute, mais une information Secret diffusée par erreur doit être signalée comme un incident de sécurité. ([[source/classification]])

    - Un incident de sécurité est tout événement qui menace la confidentialité, l''intégrité ou la disponibilité des informations d''Exemplia : un courriel d''hameçonnage ouvert, un ordinateur portable perdu, un virus détecté, un document confident… ([[source/incidents]])

    - Le résultat de chaque test est consigné dans le registre de l''équipe d''exploitation ; un échec est traité comme un incident de niveau 2. ([[source/sauvegardes]])

    - Tout incident de sécurité survenu chez un prestataire doit être signalé à Exemplia, selon le délai fixé dans son contrat. ([[source/prestataires]])

    - Clause de notification : un prestataire signale à Exemplia tout incident de sécurité touchant les données ou les systèmes d''Exemplia dans les 24 heures qui suivent sa découverte, même en cas de doute. ([[source/clauses_contrats]])

    - Cette procédure prend le relais de la procédure de signalement des incidents dès qu''un incident de niveau 3 est déclaré, ou quand plusieurs sites d''Exemplia sont touchés en même temps. ([[source/gestion_crise]])

    - Astreinte sécurité, à joindre en premier pour tout incident majeur de nuit ou le week-end : le numéro unique d''astreinte est le 06 07 08 09 10, suivi d''un répondeur qui bascule vers la personne de la semaine. ([[source/astreinte]])

    - L''activation du plan est décidée par le directeur de site de Lyon, ou par la cellule de crise si l''incident dépasse ce seul site. ([[source/plan_continuite_lyon]])'
