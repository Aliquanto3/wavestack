- id: source/deplacements
  kind: source
  title_text: Déplacements et notes de frais
  synthesis_text: Tout déplacement professionnel est validé à l'avance par le manager dans l'outil de réservation Voyagex, qui applique automatiquement les règles ci-dessous. Une réservation faite en dehors de Voyagex n'est remboursée qu'à titre exceptionnel, sur justification écrite.
  sources:
  - deplacements
  audience: all
  sha256: 52c277ad56aa4194c4e993894a781ff4bd82cc43ace53ca04e7adc34cfc0d804
  text: '# Déplacements et notes de frais


    Tout déplacement professionnel est validé à l''avance par le manager dans l''outil de réservation Voyagex, qui applique automatiquement les règles ci-dessous. Une réservation faite en dehors de Voyagex n''est remboursée qu''à titre exceptionnel, sur justification écrite.


    ## Points clés

    - Le train est obligatoire pour tout trajet de moins de 4 heures et demie, en seconde classe.

    - La première classe est admise pour un trajet de plus de 3 heures réservé la veille du départ ou le jour même, quand elle ne coûte pas plus de 20 % de plus que la seconde.

    - L''avion n''est autorisé qu''au-delà de 4 heures et demie de train, en classe économique, et la classe affaires est réservée aux vols de plus de 7 heures.

    - La nuit d''hôtel est remboursée dans la limite de 130 euros à Paris et de 95 euros dans les autres villes, petit déjeuner compris.


