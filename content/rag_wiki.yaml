  text: '# Politique de sécurité des prestataires


    Exemplia classe chaque prestataire qui traite des informations de l''entreprise dans l''un de deux niveaux : critique, quand il héberge des données ou accède au réseau interne, ou standard pour les autres. Le niveau est fixé par la cellule fournisseurs avant la signature du contrat, et révisé chaque…


