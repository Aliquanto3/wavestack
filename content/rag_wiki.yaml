  sha256: 4c4819021ac9721cd95ff1c1bf084d4988ddcd8f8ac7ff40c725af73a71f979a
  text: '# Accord de télétravail


    Tout collaborateur en contrat à durée indéterminée peut télétravailler jusqu''à 3 jours par semaine, après une période d''intégration de 2 mois. Les stagiaires et les alternants sont limités à 1 jour par semaine, pour garder le contact avec leur tuteur.


    ## Points clés

    - Un manager peut demander une présence exceptionnelle avec un préavis de 48 heures.

    - Exemplia verse une indemnité de 2,50 euros par jour télétravaillé, dans la limite de 55 euros par mois.

    - Un équipement est fourni à la demande : un écran de 27 pouces, un clavier, une souris et un casque.

    - Le télétravail depuis l''étranger est limité à 20 jours par année civile, avec l''accord écrit du manager et de la direction des ressources humaines, pour des raisons fiscales et de protection sociale.


