  sha256: 27d5075ecd72cce32fde939d13ec0c7aa8c12d9de01feb4a0cdb45546a1aa067
  text: '# Incidents de sécurité


    Un incident de sécurité est tout événement qui menace la confidentialité, l''intégrité ou la disponibilité des informations d''Exemplia : un courriel d''hameçonnage ouvert, un ordinateur portable perdu, un virus détecté, un document confidentiel envoyé au mauvais destinataire, une connexion suspecte.…


    ## Points clés

    - Elle est joignable jour et nuit au numéro interne 4242, ou à l''adresse de messagerie dédiée indiquée sur l''intranet.

    - La CERT-Ex classe chaque incident selon 3 niveaux de gravité.

    - Un incident de niveau 1 est traité dans la journée par l''équipe de support.

    - Un incident de niveau 2 mobilise la CERT-Ex, qui informe le responsable de la sécurité des systèmes d''information dans l''heure.


