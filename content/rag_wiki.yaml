- id: source/mots_de_passe
  kind: source
  title_text: Politique des mots de passe
  synthesis_text: 'Chez Exemplia, un mot de passe de compte utilisateur compte au minimum 14 caractères. La longueur compte davantage que la complexité : une phrase de passe de quatre ou cinq mots sans lien entre eux est recommandée, par exemple une suite de mots tirés au hasard et séparés par des tirets.'
  sources:
  - mots_de_passe
  audience: all
  sha256: e7be9cc0bdaedadacab09a48cbf543fc87acd17665b22b1c83a53efa7ab3cf1c
  text: '# Politique des mots de passe


    Chez Exemplia, un mot de passe de compte utilisateur compte au minimum 14 caractères. La longueur compte davantage que la complexité : une phrase de passe de quatre ou cinq mots sans lien entre eux est recommandée, par exemple une suite de mots tirés au hasard et séparés par des tirets.


    ## Points clés

    - Les comptes d''administration, eux, exigent au moins 20 caractères, et leur mot de passe est généré par le coffre-fort de l''équipe d''exploitation.

    - Dans ces cas, le changement doit intervenir dans les 12 heures qui suivent l''alerte de l''équipe sécurité.

    - Après 5 tentatives de connexion échouées, un compte est verrouillé pendant 15 minutes.

    - Au troisième verrouillage dans la même journée, le compte reste bloqué jusqu''à l''intervention du support, joignable au poste 3100.


