  sha256: 87553f1242f5a8765c1ab1202e5774a205b1e8949a6c6f1d513db4bc5d72677c
  text: '# Classification de l''information


    Toute information produite ou reçue par Exemplia porte l''un des 4 niveaux de classification suivants : Public, Interne, Confidentiel et Secret. Par défaut, un document sans marquage est traité comme Interne.


    ## Points clés

    - Un document Confidentiel ne quitte le réseau d''Exemplia que chiffré, avec l''outil de partage sécurisé Transvault ; le lien de partage expire au bout de 7 jours.

    - Les documents papier Confidentiel et Secret sont rangés dans une armoire fermée à clé et détruits au broyeur de niveau P-5.

    - Chaque année, en janvier, le responsable de chaque service revoit la classification des 20 documents les plus consultés de son périmètre.


