  text: '# Conservation des données personnelles


    Une donnée personnelle n''est conservée que le temps nécessaire à la finalité pour laquelle elle a été collectée. Le registre des traitements d''Exemplia fixe pour chaque traitement une durée active, pendant laquelle les services utilisent la donnée, puis une durée d''archivage, pendant laquelle seul…


    ## Points clés

    - Les candidatures non retenues sont conservées 2 ans après le dernier contact avec le candidat, qui en est informé et peut demander leur suppression plus tôt.

    - Les données des prospects qui n''ont jamais répondu sont supprimées au bout de 3 ans sans contact.

    - Les données des clients sont conservées pendant toute la relation contractuelle, puis archivées 5 ans après la fin du contrat.

    - Les journaux de connexion aux applications sont gardés 12 mois, les enregistrements de la vidéosurveillance des locaux 30 jours, et les badges d''accès désactivés sont effacés 3 mois après le départ du collaborateur.


