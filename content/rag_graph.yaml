  summary_text: 'Annexe des contacts d''astreinte ; Procédure de gestion de crise ; Incidents de sécurité : Un incident de niveau 1 est traité dans la journée par l''équipe de support. Chaque incident de niveau 2 ou 3 donne lieu à un retour d''expérience écrit, rédigé sous 15 jours ouvrés, qui décrit la chronologie, la cause et les mesures prises pour éviter qu''il ne se reproduise. Le résultat de chaque test est con…'
  sha256: 07310273e56ac60928f83adda2699d57bbff65710042fbe1ddd0534f8277647e
