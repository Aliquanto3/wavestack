  summary_text: 'Revue des habilitations ; Accès physique aux locaux ; Formation à la sécurité : Chaque accès, badge accepté ou refusé, est enregistré et conservé 6 mois, consulté lors d''une enquête de sécurité ou de la revue des habilitations. Une fois par an, l''équipe sécurité mène une revue complète de toutes les habilitations sensibles, celles qui donnent accès aux données personnelles, à la comptabilité ou a…'
  sha256: 02110eb1d18285c50c7ee873587acb5c2d1ff9ce7a53f6f798cb5d400719f09a
- id: accord
  entities: [accord, besoins, besoins-de-formation, direct, entretien, formation, objectifs]
  audience: hr
  sources: [entretiens_annuels, formation_securite, dossier_disciplinaire, teletravail, acces_physique, grille_remunerations, ia_generative, prestataires, sauvegardes]
  summary_text: 'Procédure des entretiens annuels ; Formation à la sécurité ; Procédure disciplinaire : L''entretien couvre l''atteinte des objectifs de l''année écoulée, les besoins de formation, et les objectifs de l''année à venir, fixés d''un commun accord. Les comptes rendus sont conservés 3 ans par les ressources humaines, pour suivre l''évolution des objectifs et des besoins de formation d''un collaborateur sur p…'
  sha256: 9d691bf34eb0ae8c5707539c9b89646b3ecea1adbf010d6d4566a3a2a3c69830
- id: admise
  entities: [admise, applications, fichiers, perte, serveurs]
