  summary_text: 'Sauvegardes ; Conservation des données personnelles ; Accès physique aux locaux : Pour les applications critiques, la perte de données maximale admise est de 4 heures et le service doit repartir en moins de 8 heures. Cette règle s''applique aux serveurs de fichiers, aux bases de données des applications et à la messagerie.'
  sha256: bd583f6818ddb601354e34747c830007912b58424707bfcdf21bf8e302c17d7b
