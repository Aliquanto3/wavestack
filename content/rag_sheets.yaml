# V1.2 story 19 (CAP-16, CAP-17), l'onglet Fiches : textes de l'onglet et fiches des 11 architectures.
# Les identifiants, niveaux, classes de localisation, `demo`, `story`, `hypotheses` et URL sont communs
# aux trois langues ; seuls les textes diffèrent (surcouches `content/i18n/{en,de}/rag_sheets.yaml`).
# Le libellé de l'architecture, ses endroits d'effacement et son coût de remise en ordre ne sont pas
# ici : la session les lit de `rag_erasure.yaml` (story 18). Les niveaux sont des PROPOSITIONS d'exposition,
# tirées de `architectures.md` et d'`attaques-et-conformite.md`, à relire (jamais un verdict de
# conformité). L'axe réglementaire n'a pas de niveau. Les sources sont celles de `litterature.md`.

texts:
  title_text: Fiches de composant et d'architecture
  hint_text: 'Pour chaque composant ou architecture : à quoi il sert, ce qu''il coûte, ce que dit la littérature, et pour une architecture ses risques de conformité sur sept axes.'
  banner_text: Grille pédagogique, pas un avis juridique ; à examiner avec le juriste ou le DPO de votre organisation.
  levels_note_text: 'Niveaux d''exposition : proposition, à relire.'
  level_hint_text: 'Le niveau dit une exposition (faible : peu exposée, élevé : très exposée), jamais un verdict de conformité.'
