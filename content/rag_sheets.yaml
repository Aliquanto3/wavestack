    url: https://arxiv.org/abs/2508.04276
  - label_text: Microsoft Research
    url: https://www.microsoft.com/en-us/research/publication/enterprise-ai-must-enforce-participant-aware-access-control
  axes:
    location:
      level: low
      text: 'Documents et arbre tournent dans l''atelier. Les résumés de l''arbre et la descente sont écrits par le modèle actif : chez un fournisseur si c''est un modèle cloud.'
      components:
      - id: documents
        class: local
      - id: derived
        class: local
      - id: generation
        class: depends_on_provider
      - id: trace_export
        class: depends_on_provider
    copies:
      level: mid
      text: 'Les résumés de l''arbre sont des copies dérivées du texte, écrites par un modèle : ils peuvent garder une information que le document ne contient plus.'
    erasure:
      level: mid
      text: Il faut recalculer l'arbre du document modifié et de ses sections, puis vérifier que les résumés ne gardent plus le contenu retiré.
      demo: rag-erasure-card
    rights:
      level: mid
      text: 'L''arbre est propre à chaque document : on peut ne pas l''ouvrir pour un profil. Mais un résumé de niveau haut mêle des sections de droits différents.'
      demo: rag-access-card
      before_search: true
    injection:
      level: mid
      text: 'Un titre ou un résumé piégé dans l''arbre guide la descente du modèle : il peut l''envoyer vers une mauvaise section.'
      demo: rag-atk-title
    traceability:
      level: low
      text: 'Le chemin suivi dans l''arbre est une suite de décisions lisibles : on voit quelles sections ont été ouvertes.'
    regulatory:
