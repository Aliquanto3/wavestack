    url: https://www.microsoft.com/en-us/research/publication/enterprise-ai-must-enforce-participant-aware-access-control
  axes:
    location:
      level: low
      text: 'Les documents restent dans l''atelier. Chaque extrait lu par un outil est envoyé au modèle actif à chaque tour : chez un fournisseur si c''est un modèle cloud.'
      components:
      - id: documents
        class: local
      - id: generation
        class: depends_on_provider
      - id: trace_export
        class: depends_on_provider
    copies:
      level: low
      text: 'Aucune copie ni dérivé : la source est lue telle quelle. L''état se limite à l''historique de la boucle, propre à chaque requête.'
    erasure:
      level: low
      text: 'Rien à reconstruire : retirer le document de la source suffit, la requête suivante ne le trouve plus.'
      demo: rag-erasure-card
    rights:
      level: mid
      text: 'Les droits reposent sur les permissions des outils : un outil qui lit tout le dossier lit aussi les documents interdits. Un contrôle avant l''outil est possible.'
      demo: rag-access-card
      before_search: true
    injection:
      level: high
      text: 'C''est l''architecture la plus exposée : un texte piégé lu par un outil peut pousser le modèle à appeler d''autres outils ou à faire sortir des données.'
      demo: rag-atk-title
    traceability:
      level: low
      text: 'Chaque appel d''outil et chaque lecture sont des événements du journal : le chemin de lecture se reconstitue en entier.'
    regulatory:
      text: 'Questions à poser, pas un verdict. RGPD : quelle base légale, quelle minimisation, et comment exercer le droit à l''effacement sur l''historique de la boucle d''outils ? AI Act : quelle classification selon l''usage ? DORA ou NIS2 : selon le secteur de l''organisation. Dépendance fournisseur : que quitte l''atelier avec l''utilisation du modèle qui lit les extraits à chaque tour ?'
- id: pageindex
  story: 11
  hypotheses:
  - H4
  - H12
  purpose_text: Construire un arbre des sections du document (titres, résumés courts) et laisser le modèle y descendre jusqu'à la section utile, sans vecteurs.
  when_text: 'À utiliser sur des documents longs et structurés (rapports, contrats). À éviter sur des textes courts ou sans titres : l''arbre n''apporte rien et coûte des appels de modèle.'
  cost_text: 'Construction : l''arbre des sections, avec des résumés écrits par le modèle. Mise à jour : recalculer l''arbre du document modifié. Requête : une descente dans l''arbre, par le modèle.'
  literature_text: 'H4 (PageIndex gagne sur les documents longs et structurés) : partiellement soutenue, surtout par l''éditeur. H12 (les architectures dérivées compliquent l''effacement et les droits, et élargissent la surface d''attaque) : partiellement soutenue.'
  bench_text: ''
  sources:
  - label_text: PageIndex
    url: https://github.com/VectifyAI/PageIndex
