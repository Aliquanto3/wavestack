architectures:
- id: dense
  hypotheses:
  - H1
  - H12
  purpose_text: Chercher les passages dont le vecteur est le plus proche de celui de la question, puis les donner au modèle.
  when_text: 'À utiliser comme point de départ : simple, bon marché, un seul index. À éviter quand les questions portent sur des termes exacts (codes, noms) que le sens ne retrouve pas.'
  cost_text: 'Construction : découper et vectoriser le corpus. Mise à jour : retirer et ajouter les passages du document. Requête : une vectorisation de la question et une recherche.'
  literature_text: 'H1 (l''hybride avec reranker domine le dense seul) : partiellement soutenue. H12 (les architectures dérivées compliquent l''effacement et les droits, et élargissent la surface d''attaque) : partiellement soutenue.'
  bench_text: ''
  sources:
  - label_text: arXiv 2604.01733
    url: https://arxiv.org/html/2604.01733
  - label_text: arXiv 2609.22770
    url: https://arxiv.org/abs/2609.22770
  - label_text: arXiv 2508.04276
    url: https://arxiv.org/abs/2508.04276
  - label_text: Microsoft Research
    url: https://www.microsoft.com/en-us/research/publication/enterprise-ai-must-enforce-participant-aware-access-control
  axes:
    location:
      level: low
      text: 'Documents, index et vecteurs tournent dans l''atelier. La génération passe par le modèle actif : si c''est un modèle cloud, les passages et la question partent chez le fournisseur.'
      components:
      - id: documents
        class: local
      - id: index
        class: local
      - id: generation
        class: depends_on_provider
      - id: trace_export
        class: depends_on_provider
    copies:
      level: mid
      text: 'Chaque passage existe deux fois : son texte et son vecteur, dans le magasin. Une copie de plus à suivre, mais chacune se retire par identifiant.'
    erasure:
      level: mid
      text: 'Retirer les passages du document suffit : le vecteur part avec son passage. Reste à vérifier les copies hors de l''architecture (contextes recalculés, sauvegardes).'
      demo: rag-erasure-card
    rights:
      level: mid
      text: 'Sans contrôle avant la recherche, les passages interdits sont lus puis retirés : ils ont déjà influencé le classement. Un filtre sur l''index avant la recherche est possible.'
      demo: rag-access-card
      before_search: true
    injection:
      level: mid
      text: Un passage piégé retrouvé par la recherche arrive dans le prompt tel quel. Pas d'outil à détourner, mais le texte de la consigne cachée est lu par le modèle.
      demo: rag-atk-title
    traceability:
      level: low
      text: 'Les passages retenus et leurs scores sont dans le journal de l''exécution : on peut dire quelles sources ont nourri la réponse.'
    regulatory:
      text: 'Questions à poser, pas un verdict. RGPD : quelle base légale, quelle minimisation, et comment exercer le droit à l''effacement sur les vecteurs et les passages du magasin ? AI Act : quelle classification selon l''usage ? DORA ou NIS2 : selon le secteur de l''organisation. Dépendance fournisseur : que quitte l''atelier avec l''utilisation du modèle de génération ?'
- id: hybrid
  hypotheses:
  - H1
  - H12
  purpose_text: Combiner la recherche par le sens et la recherche par mots exacts (BM25), puis fusionner les deux classements par rangs réciproques.
  when_text: 'À utiliser quand le corpus mêle prose et termes exacts (codes, sigles). À éviter si un seul index suffit : la fusion non réglée peut faire moins bien que le dense.'
  cost_text: 'Construction : l''index des vecteurs et l''index BM25. Mise à jour : retirer les passages des deux. Requête : deux recherches et une fusion, sans appel de modèle de plus.'
  literature_text: 'H1 (l''hybride avec reranker domine le dense seul) : partiellement soutenue. H12 (les architectures dérivées compliquent l''effacement et les droits, et élargissent la surface d''attaque) : partiellement soutenue.'
  bench_text: ''
  sources:
  - label_text: arXiv 2604.01733
    url: https://arxiv.org/html/2604.01733
  - label_text: arXiv 2609.22770
    url: https://arxiv.org/abs/2609.22770
  - label_text: arXiv 2508.04276
    url: https://arxiv.org/abs/2508.04276
  - label_text: Microsoft Research
    url: https://www.microsoft.com/en-us/research/publication/enterprise-ai-must-enforce-participant-aware-access-control
  axes:
    location:
      level: low
      text: Documents, deux index et fusion tournent dans l'atelier. Seule la génération peut partir chez un fournisseur si le modèle actif est un modèle cloud.
      components:
      - id: documents
        class: local
      - id: index
        class: local
      - id: generation
        class: depends_on_provider
      - id: trace_export
        class: depends_on_provider
    copies:
      level: mid
      text: 'Le texte vit dans deux index : celui des vecteurs et celui des mots. Deux endroits à tenir à jour, tous deux retirables par identifiant.'
    erasure:
      level: mid
      text: Il faut retirer le document des deux index ; en oublier un laisse le texte cherchable. Le coût de remise en ordre reste faible.
      demo: rag-erasure-card
    rights:
      level: mid
      text: 'Comme le dense : sans contrôle avant la recherche, les deux classements lisent des passages interdits. Le filtre doit s''appliquer aux deux index.'
      demo: rag-access-card
      before_search: true
    injection:
      level: mid
      text: Un passage piégé peut remonter par l'un ou l'autre classement, et la recherche par mots exacts retrouve facilement un texte qui cite les mots de la question.
      demo: rag-atk-title
    traceability:
      level: low
      text: 'Les deux classements et la fusion sont visibles dans l''exécution : on peut dire par quelle voie une source est arrivée.'
    regulatory:
      text: 'Questions à poser, pas un verdict. RGPD : quelle base légale, quelle minimisation, et comment exercer le droit à l''effacement sur les deux index (vecteurs et mots) ? AI Act : quelle classification selon l''usage ? DORA ou NIS2 : selon le secteur de l''organisation. Dépendance fournisseur : que quitte l''atelier avec l''utilisation du modèle de génération ?'
- id: rerank
  hypotheses:
  - H1
  - H12
  purpose_text: Chercher largement par le sens, puis réordonner les candidats avec un modèle qui lit la question et chaque passage ensemble.
  when_text: À utiliser quand les bons passages sont dans les premiers candidats mais mal classés. À éviter quand le temps de requête compte plus que la précision.
  cost_text: 'Construction : celle du dense. Mise à jour : retirer les passages, le reranking ne garde rien. Requête : une recherche plus un passage du reranker sur chaque candidat.'
  literature_text: 'H1 (l''hybride avec reranker domine le dense seul) : partiellement soutenue. H12 (les architectures dérivées compliquent l''effacement et les droits, et élargissent la surface d''attaque) : partiellement soutenue.'
  bench_text: ''
  sources:
  - label_text: arXiv 2604.01733
    url: https://arxiv.org/html/2604.01733
  - label_text: arXiv 2609.22770
    url: https://arxiv.org/abs/2609.22770
  - label_text: arXiv 2508.04276
    url: https://arxiv.org/abs/2508.04276
  - label_text: Microsoft Research
    url: https://www.microsoft.com/en-us/research/publication/enterprise-ai-must-enforce-participant-aware-access-control
  axes:
    location:
      level: low
      text: Documents, index et reranker tournent dans l'atelier. La génération peut partir chez un fournisseur si le modèle actif est un modèle cloud.
      components:
      - id: documents
        class: local
      - id: index
        class: local
      - id: generation
        class: depends_on_provider
      - id: trace_export
        class: depends_on_provider
    copies:
      level: mid
      text: Les mêmes copies que le dense ; le reranker ne stocke rien, il note les candidats au moment de la requête.
    erasure:
      level: mid
      text: Retirer les passages du magasin suffit, le reranking ne garde rien. Reste à vérifier les copies hors de l'architecture.
      demo: rag-erasure-card
    rights:
      level: mid
      text: 'Le reranker lit les candidats avant tout filtre d''audience s''il n''y a pas de contrôle avant la recherche : un passage interdit peut donc être lu puis écarté.'
      demo: rag-access-card
      before_search: true
    injection:
      level: mid
      text: Un passage piégé bien rédigé peut gagner des places au reranking, puisque le modèle juge sa proximité avec la question.
      demo: rag-atk-title
    traceability:
      level: low
      text: 'Les rangs avant et après reranking sont dans l''exécution : on voit ce que le reranker a changé.'
    regulatory:
      text: 'Questions à poser, pas un verdict. RGPD : quelle base légale, quelle minimisation, et comment exercer le droit à l''effacement sur les vecteurs et les passages du magasin ? AI Act : quelle classification selon l''usage ? DORA ou NIS2 : selon le secteur de l''organisation. Dépendance fournisseur : que quitte l''atelier avec l''utilisation du modèle de génération ?'
- id: long_context
  story: 10
  hypotheses:
  - H11
  - H12
  purpose_text: 'Ne pas chercher : mettre tout le corpus dans le prompt et laisser le modèle y retrouver la réponse.'
  when_text: 'À utiliser sur un petit corpus qui tient dans la fenêtre : rien à construire. À éviter dès que le corpus grossit ou que le modèle est petit : tout est relu à chaque requête.'
  cost_text: 'Construction : aucune. Mise à jour : aucune. Requête : tout le corpus dans le prompt, soit environ 12 000 tokens à chaque question.'
  literature_text: 'H11 (le contexte long est une baseline difficile à battre sur petit corpus) : soutenue avec un modèle fort. H12 (les architectures dérivées compliquent l''effacement et les droits, et élargissent la surface d''attaque) : partiellement soutenue.'
  bench_text: ''
  sources:
  - label_text: arXiv 2407.16833
    url: https://arxiv.org/html/2407.16833v1
  - label_text: LaRA
    url: https://arxiv.org/html/2502.09977v1
  - label_text: arXiv 2508.04276
    url: https://arxiv.org/abs/2508.04276
  - label_text: Microsoft Research
    url: https://www.microsoft.com/en-us/research/publication/enterprise-ai-must-enforce-participant-aware-access-control
  axes:
    location:
      level: low
      text: 'Les documents et le cache du préfixe tournent dans l''atelier. Le corpus entier part avec chaque question vers le modèle actif : chez un fournisseur si ce modèle est un modèle cloud.'
      components:
      - id: documents
        class: local
      - id: cache
        class: local
      - id: generation
        class: depends_on_provider
      - id: trace_export
        class: depends_on_provider
    copies:
      level: low
      text: 'Aucun index ni dérivé : le seul état est le préfixe mis en cache par le moteur. Peu de copies, mais le corpus entier voyage.'
    erasure:
      level: low
      text: Rien à reconstruire en dehors du préfixe en cache, à recharger. Retirer le document de la source le retire du prompt suivant.
      demo: rag-erasure-card
    rights:
      level: high
      text: 'Tous les documents sont dans le prompt : aucun filtre par audience n''est possible sans choisir à l''avance ce qu''on y met. Le modèle voit tout.'
      demo: rag-access-card
      before_search: false
    injection:
      level: high
      text: 'Un document piégé est lu avec tout le reste, sans que la recherche l''ait trié : la surface d''exposition est le corpus entier.'
      demo: rag-atk-title
    traceability:
      level: mid
      text: 'On ne sait pas quel passage a servi : tout était dans le prompt. La traçabilité de la source se réduit à « le corpus entier ».'
    regulatory:
      text: 'Questions à poser, pas un verdict. RGPD : quelle base légale, quelle minimisation, et comment exercer le droit à l''effacement sur le préfixe mis en cache ? AI Act : quelle classification selon l''usage ? DORA ou NIS2 : selon le secteur de l''organisation. Dépendance fournisseur : que quitte l''atelier avec l''utilisation du modèle qui lit tout le corpus ?'
- id: cag
  story: 10
  hypotheses:
  - H11
  - H12
  purpose_text: Précharger le corpus dans le cache du modèle une fois, puis ne poser que la question après ce préfixe.
  when_text: 'À utiliser sur un corpus stable et petit, interrogé souvent : la requête ne coûte presque rien. À éviter quand les documents changent : tout le cache se recharge.'
  cost_text: 'Construction : corpus préchargé dans le cache (préfixe). Mise à jour : recharger tout le cache. Requête : la question seule après le préfixe en cache.'
  literature_text: 'H11 (le contexte long est une baseline difficile à battre sur petit corpus) : soutenue avec un modèle fort. H12 (les architectures dérivées compliquent l''effacement et les droits, et élargissent la surface d''attaque) : partiellement soutenue.'
  bench_text: ''
  sources:
  - label_text: arXiv 2407.16833
    url: https://arxiv.org/html/2407.16833v1
  - label_text: LaRA
    url: https://arxiv.org/html/2502.09977v1
  - label_text: arXiv 2508.04276
    url: https://arxiv.org/abs/2508.04276
  - label_text: Microsoft Research
    url: https://www.microsoft.com/en-us/research/publication/enterprise-ai-must-enforce-participant-aware-access-control
  axes:
    location:
      level: low
      text: 'Documents et cache du modèle tournent dans l''atelier. Le préfixe est rejoué au modèle actif : chez un fournisseur si ce modèle est un modèle cloud.'
      components:
      - id: documents
        class: local
      - id: cache
        class: local
      - id: generation
        class: depends_on_provider
      - id: trace_export
        class: depends_on_provider
    copies:
      level: mid
      text: 'Le cache du modèle contient le corpus sous une forme que personne ne lit : une copie dérivée de tout le corpus.'
    erasure:
      level: high
      text: 'Il faut recharger tout le cache, car le préfixe contient le document : retirer un seul texte oblige à tout recalculer.'
      demo: rag-erasure-card
    rights:
      level: high
      text: 'Un seul cache pour tous : tout ce qu''il contient est lisible par toute question, quel que soit le profil. Un cache par profil multiplie le coût.'
      demo: rag-access-card
      before_search: false
    injection:
      level: high
      text: Un document piégé entre dans le préfixe et y reste pour toutes les questions suivantes tant que le cache n'est pas rechargé.
      demo: rag-atk-title
    traceability:
      level: mid
      text: Comme le contexte long, on ne sait pas quel passage a servi ; en plus le cache est un état caché entre deux requêtes.
    regulatory:
      text: 'Questions à poser, pas un verdict. RGPD : quelle base légale, quelle minimisation, et comment exercer le droit à l''effacement sur le cache du modèle, qui contient tout le corpus ? AI Act : quelle classification selon l''usage ? DORA ou NIS2 : selon le secteur de l''organisation. Dépendance fournisseur : que quitte l''atelier avec l''utilisation du modèle qui rejoue le préfixe ?'
- id: agentic
  story: 11
  hypotheses:
  - H5
  - H12
  purpose_text: Laisser le modèle chercher lui-même dans les fichiers du corpus avec des outils (lister, chercher un motif, lire), en boucle, jusqu'à répondre.
  when_text: 'À utiliser quand les documents changent souvent : la source est relue à chaque requête. À éviter quand la latence et les tokens comptent : la boucle coûte plus que le RAG.'
  cost_text: 'Construction : aucune. Mise à jour : aucune. Requête : une boucle d''appels d''outils et de modèle, de plusieurs tours, bien plus de tokens qu''une recherche simple.'
  literature_text: 'H5 (la recherche agentique égale le RAG mais coûte plus) : partiellement soutenue. H12 (les architectures dérivées compliquent l''effacement et les droits, et élargissent la surface d''attaque) : partiellement soutenue.'
  bench_text: ''
