# Atelier RAG (story 30, AD-19) : les textes de la page /rag, validés par pydantic
# (wavestack.rag.lab.RagLabContent). Un fichier invalide : la page reste servie et dit
# pourquoi. `{…}` : une valeur que la session ou la page place.

title_text: "Atelier recherche documentaire : l'architecture de recherche à manipuler"
intro_text: >-
  Un RAG (Retrieval-Augmented Generation : le modèle répond à partir de passages retrouvés
  dans des documents) fonctionne en deux temps. L'indexation (build) découpe une fois pour
  toutes le corpus, l'ensemble des documents à interroger, en chunks (des morceaux de
  quelques paragraphes), et range leurs vecteurs (des listes de nombres qui résument le
  sens d'un texte) dans un vector store (une base qui retrouve vite les vecteurs les plus
  proches). La requête (run), à chaque question, y cherche les chunks utiles et les place
  dans le prompt du modèle. Lancez la chaîne sur une question pour voir ce que chaque
  étape reçoit, produit, et ce qu'elle coûte. C'est un bac à sable : la brique RAG de l'atelier
  ne change pas.
busy_text: "Indisponible pour l'instant : {raison}"

chain_title_text: "La chaîne RAG, étape par étape"
chain_help_text: >-
  La séquence des étapes, les composants qu'elle sollicite et le focus sur l'étape choisie. En
  mode Dérouler, les étapes et leurs composants arrivent un à un, à la main (◀ ▶) ou au fil
  d'une exécution. En mode Composer, les étapes du segment de récupération (Dense retrieval :
  recherche par le sens ; BM25 : recherche par mots-clés ; Fusion des deux classements ;
  Reranking : nouveau tri par un second modèle) se retirent, s'ajoutent et se déplacent ; la Generation envoie le
  prompt augmenté au modèle actif de l'atelier, ou ne génère pas si vous le choisissez.

