# Lot 5a : les lignes de la séquence (vues-atelier-rag.md §2). Le nom technique est le même
# dans les trois langues ; l'action et l'explication sont dans la langue de la page. Sans
# `explain_text`, le focus reprend celui de l'étape de la chaîne.
steps:
  documents:
    label_text: "Documents"
    action_text: "Charger le corpus"
    explain_text: >-
      Le corpus que le RAG rend consultable : les documents d'une entreprise fictive, Exemplia.
      Il ne change pas d'une question à l'autre ; c'est pourquoi tout le travail sur lui se fait
      une fois, avant les questions : c'est l'indexation.
  chunking:
    label_text: "Chunking"
    action_text: "Découper les documents en chunks"
  embed_passages:
    label_text: "Embedding"
    action_text: "Vectoriser chaque chunk"
    explain_text: >-
      Le modèle d'embedding transforme chaque chunk en un vecteur de nombres. Deux textes au
      sens proche donnent des vecteurs proches, même sans mot commun. Ce calcul est fait une
      fois : les vecteurs de l'index de la brique RAG sont relus sans être recalculés.
      Chaque modèle proposé a son propre cache de vecteurs. Un chunk plus long que ce que le
      modèle lit d'un coup (max_tokens) est tronqué : l'étape dit combien.
  vector_store:
    label_text: "Indexing"
    action_text: "Ranger les vecteurs dans le vector store"
  # B2 (2026-10-05): BM25's inverted index, built at BUILD (only with a BM25 stage).
  lexical_index:
    label_text: "Lexical indexing"
    action_text: "Construire l'index lexical (BM25) des chunks"
    explain_text: >-
      BM25 n'a pas de modèle appris : c'est un algorithme statistique. À l'indexation, il
      découpe chaque chunk en termes (casse — majuscules et minuscules —, accents et mots
      vides ignorés, sigles gardés),
      compte combien de fois chaque terme y paraît et la longueur du chunk, puis, pour chaque
      terme, combien de
      chunks le contiennent (sa fréquence documentaire) : c'est l'index inversé, comme celui
      d'un moteur de recherche (Elasticsearch, Lucene). À chaque question, BM25 relit ces
      comptes au lieu de reparcourir le texte. L'atelier reconstruit cet index à chaque
      exécution (il est rapide) ; un moteur de recherche le garde sur disque.
  question:
    label_text: "Question"
    action_text: "Recevoir la question"
    explain_text: >-
      La question posée en langage naturel. Elle part vers l'Embedding pour une recherche par le
      sens, telle quelle vers BM25 si la chaîne en a un, et rejoint enfin le prompt du modèle.
  embed_query:
    label_text: "Embedding"
    action_text: "Vectoriser la question"
    explain_text: >-
      Le même modèle d'embedding transforme la question en vecteur. Il doit être le même que pour
      les chunks : deux modèles différents ne rangent pas les sens dans le même espace, leurs
      vecteurs ne se comparent pas.
  vector_search:
    label_text: "Dense retrieval"
    action_text: "Chercher les chunks les plus proches"
  lexical_search:
    label_text: "BM25"
    action_text: "Chercher par mots-clés"
  fusion:
    label_text: "Fusion (RRF)"
    action_text: "Fusionner les deux classements"
  rerank:
    label_text: "Reranking"
    action_text: "Reclasser les candidats"
  context:
    label_text: "Prompt augmentation"
    action_text: "Construire le prompt avec les chunks retenus"
  generation:
    label_text: "Generation"
    action_text: "Générer la réponse"
  query:
    label_text: "Query understanding"
    action_text: "Produire les requêtes à chercher"
    note_text: "L'atelier n'a pas de conversation : la question de suivi lit les questions posées plus tôt dans cette session (trois au plus)."
  cache_prefix:
    label_text: "Prefix caching"
    action_text: "Garder la consigne et le corpus entier dans la mémoire du modèle"
    explain_text: >-
      Le CAG évalue une fois le début du prompt (la consigne et tout le corpus) et garde l'état
      du modèle qui en résulte. À chaque question, cet état est remis en mémoire : le modèle ne
      lit plus que la question. Ce préfixe est un découpage en tokens du prompt envoyé, jusqu'à
      la dernière fin de ligne avant la question. Toute mise à jour du corpus le recharge en
      entier, et l'état occupe la mémoire tant qu'il est gardé.
  # V1.2 story 11: PageIndex's tree built once, gone down at each question; the agent's calls.
  tree_build:
    label_text: "Tree building"
    action_text: "Construire l'arbre des sections des documents"
    explain_text: "PageIndex construit une fois un arbre du corpus : la racine, un nœud par document, un par section, chacun avec un titre et un résumé court. L'arbre livré est calculé par une règle, sans modèle ; « Reconstruire » fait écrire les résumés par le modèle actif. Mettre à jour un document recalcule son seul sous-arbre."
  agent_calls:
    label_text: "Tool calls"
    action_text: "Le modèle choisit une action, l'outil la lit dans le corpus"
    explain_text: "À chaque tour, le modèle répond par une ligne ACTION: list_files, grep <mots>, read_file <nom> ou ANSWER. Les outils lisent la copie de travail en mémoire, jamais le disque : un nom hors du corpus est refusé et dit au modèle. Chaque résultat d'outil devient un élément du contexte. La boucle s'arrête sur ANSWER, au 6e tour ou après deux réponses illisibles."
  tree_levels:
    label_text: "Tree descent"
    action_text: "Le modèle choisit, niveau par niveau, les nœuds à ouvrir"
    explain_text: "À chaque niveau, le modèle lit la liste numérotée des enfants des nœuds retenus (titre et résumé) et répond CHOICE: 3, 7 (deux au plus) ou CHOICE: NONE. Un appel par niveau : deux sur le corpus livré (les documents, puis les sections). Le texte entier des sections atteintes devient le contexte."
  # V1.2 story 8 (CAP-6): System One's lines, in the chain's order.
  router:
    label_text: "Strategy router"
    action_text: "Choisir la stratégie de recherche de la question"
  passage_filter:
    label_text: "Passage filter"
    action_text: "Garder ou rejeter chaque passage"
  grounding_check:
    label_text: "Grounding check"
    action_text: "Contrôler l'ancrage de chaque phrase de la réponse"
  # V1.2 story 13: GraphRAG's graph built once, then queried at each question.
  graph_build:
    label_text: "Graph building"
    action_text: "Construire le graphe des entités, de leurs relations et de leurs communautés"
    explain_text: "GraphRAG construit une fois un graphe de connaissances : les entités du corpus, leurs relations, leurs communautés résumées ; chaque entité et relation garde ses preuves (le passage et son empreinte). Le graphe livré est calculé par une règle, sans modèle (termes-clés, sigles, codes, co-occurrence dans une phrase) ; « Reconstruire » le fait extraire par le modèle actif, un appel par passage puis un par communauté. Mettre à jour un document refait son extraction, la fusion, les communautés et les seuls résumés touchés."
  graph_query:
    label_text: "Graph query"
    action_text: "Le modèle nomme les entités de la question, ou lit les communautés proches"
    explain_text: "En mode local, un appel donne les entités de la question (ENTITIES: a, b) ; le graphe les relie à leurs voisins à un saut, et les passages-preuves de ces relations deviennent le contexte. En mode global, les trois communautés les plus proches de la question passent chacune par un appel « map » (POINTS: … ou POINTS: NONE) ; la génération fait le « reduce ». Aucune audience n'est filtrée : chaque élément dit la sienne."
  # V1.2 story 12: RAPTOR's tree built once, then searched on every level;
  # Corrective RAG's fallback.
  raptor_build:
    label_text: "Summary tree building"
    action_text: "Regrouper les passages et résumer chaque groupe, niveau par niveau"
    explain_text: "RAPTOR construit une fois un arbre : les passages du corpus sont regroupés par la proximité de leurs mots, chaque groupe est résumé, puis les résumés sont regroupés et résumés à leur tour, jusqu'à trois niveaux. L'arbre livré est calculé par une règle, sans modèle (résumés extractifs : la phrase de chaque enfant la plus proche du groupe) ; « Reconstruire » fait écrire chaque résumé par le modèle actif, un appel par nœud. Mettre à jour un document place ses passages dans l'arbre et refait les seuls résumés touchés."
  raptor_query:
    label_text: "Summary tree search"
    action_text: "Chercher sur tous les niveaux de l'arbre à la fois"
    explain_text: "L'arbre est aplati : passages et résumés de tous les niveaux sont notés ensemble par BM25, et les cinq meilleurs nœuds deviennent le contexte, sans appel au modèle. Une question de vue d'ensemble trouve un résumé, une question factuelle un passage. Aucune audience n'est filtrée : chaque élément dit la sienne."
  fallback:
    label_text: "Corrective fallback"
    action_text: "Réécrire la question et chercher de nouveau si le filtre n'a rien gardé"

