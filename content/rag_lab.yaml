# Lot 5b : les architectures toutes faites ; appliquer l'une remplace le segment de
# récupération seulement, ses étapes aux réglages livrés. L'explication est l'infobulle.
presets:
  dense:
    label_text: "RAG dense"
    explain_text: >-
      Une seule recherche, par le sens (Dense retrieval) : le RAG le plus simple. Rapide, mais
      il peut manquer un sigle ou un nombre exact.
  hybrid:
    label_text: "RAG hybride (BM25 + dense)"
    explain_text: >-
      Une recherche par le sens (Dense retrieval) et une par mots-clés (BM25), puis la Fusion
      (RRF) de leurs deux classements : le sigle exact et la paraphrase se retrouvent tous deux.
      Deux recherches au lieu d'une : plus lent que le RAG dense. Un Reranking s'ajoute à la
      main après la Fusion.
  rerank:
    label_text: "RAG + reranking"
    explain_text: >-
      Le Dense retrieval retient des candidats, puis le Reranker les relit avec la question et
      les réordonne : plus juste, plus lent. Seul le segment de récupération revient à celui de
      la chaîne livrée : les réglages du Chunking, de l'Embedding, du vector store et du prompt
      restent les vôtres.
  long_context:
    label_text: "Contexte long"
    explain_text: >-
      Aucun index, aucune recherche : tout le corpus va dans le prompt, à chaque question. Rien
      à construire ni à mettre à jour, mais chaque requête relit tout le corpus. Il faut une
      fenêtre de 16 384 tokens.
  cag:
    label_text: "CAG (cache du modèle)"
    explain_text: >-
      Aucun index, aucune recherche : le corpus est évalué une fois et gardé dans la mémoire du
      modèle local ; chaque requête n'évalue que la question. Toute mise à jour recharge tout le
      préfixe. Il faut un modèle local et une fenêtre de 16 384 tokens.
  agentic:
    label_text: "Recherche agentique"
    explain_text: >-
      Aucun index : le modèle fouille lui-même le corpus avec trois outils (lister, chercher des
      mots, lire un document), une action par tour, jusqu'à six. Rien à construire ni à mettre
      à jour, mais plusieurs appels au modèle à chaque requête.
  pageindex:
    label_text: "PageIndex"
    explain_text: >-
      Aucun vecteur : un arbre des documents et de leurs sections, construit une fois, que le
      modèle descend niveau par niveau en lisant titres et résumés. Un arbre à construire et à
      refaire à chaque mise à jour, peu d'appels à la requête.
  graphrag:
    label_text: "GraphRAG"
    explain_text: >-
      Aucun vecteur : un graphe des entités du corpus, de leurs relations et de leurs
      communautés résumées, construit une fois. En local, le modèle nomme les entités de la
      question et lit les preuves de leurs voisins ; en global, il lit les communautés proches.
      Coûteux à construire et à mettre à jour avec un modèle, plusieurs appels à la requête.
  raptor:  # V1.2 story 12
    label_text: "RAPTOR"
    explain_text: "Aucun vecteur : un arbre de résumés construit une fois, les passages regroupés et résumés, puis les résumés regroupés et résumés. La requête cherche sur tous les niveaux à la fois, sans appel au modèle. Coûteux à construire avec un modèle, des résumés à refaire à chaque mise à jour."
  crag:  # V1.2 story 12
    label_text: "Corrective RAG"
    explain_text: "Le RAG hybride, puis le filtre de passages de System One ; si le filtre ne garde rien, le modèle réécrit la question et la recherche repasse une fois, puis l'atelier répond « je ne sais pas ». Sans recherche web : l'atelier est hors ligne."
