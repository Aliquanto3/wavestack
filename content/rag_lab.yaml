# Lot 5a : les lignes de la séquence (vues-atelier-rag.md §2). Le nom technique est le même
# dans les trois langues ; l'action et l'explication sont dans la langue de la page. Sans
# `explain_text`, le focus reprend celui de l'étape de la chaîne.
steps:
  documents:
    label_text: "Documents"
    action_text: "Charger le corpus"
    explain_text: >-
      Le corpus que le RAG rend consultable : les documents d'une entreprise fictive, Exemplia.
      Il ne change pas d'une question à l'autre ; c'est pourquoi tout le travail sur lui se fait
      une fois, avant les questions : c'est l'indexation.
  chunking:
    label_text: "Chunking"
    action_text: "Découper les documents en chunks"
  embed_passages:
    label_text: "Embedding"
    action_text: "Vectoriser chaque chunk"
    explain_text: >-
      Le modèle d'embedding transforme chaque chunk en un vecteur de nombres. Deux textes au
      sens proche donnent des vecteurs proches, même sans mot commun. Ce calcul est fait une
      fois : les vecteurs de l'index de la brique RAG sont relus sans être recalculés.
      Chaque modèle proposé a son propre cache de vecteurs. Un chunk plus long que ce que le
      modèle lit d'un coup (max_tokens) est tronqué : l'étape dit combien.
  vector_store:
    label_text: "Indexing"
    action_text: "Ranger les vecteurs dans le vector store"
  # B2 (2026-10-05): BM25's inverted index, built at BUILD (only with a BM25 stage).
  lexical_index:
    label_text: "Lexical indexing"
    action_text: "Construire l'index lexical (BM25) des chunks"
    explain_text: >-
      BM25 n'a pas de modèle appris : c'est un algorithme statistique. À l'indexation, il
      découpe chaque chunk en termes (casse — majuscules et minuscules —, accents et mots
      vides ignorés, sigles gardés),
      compte combien de fois chaque terme y paraît et la longueur du chunk, puis, pour chaque
      terme, combien de
      chunks le contiennent (sa fréquence documentaire) : c'est l'index inversé, comme celui
      d'un moteur de recherche (Elasticsearch, Lucene). À chaque question, BM25 relit ces
      comptes au lieu de reparcourir le texte. L'atelier reconstruit cet index à chaque
      exécution (il est rapide) ; un moteur de recherche le garde sur disque.
  question:
    label_text: "Question"
    action_text: "Recevoir la question"
    explain_text: >-
      La question posée en langage naturel. Elle part vers l'Embedding pour une recherche par le
      sens, telle quelle vers BM25 si la chaîne en a un, et rejoint enfin le prompt du modèle.
  embed_query:
    label_text: "Embedding"
    action_text: "Vectoriser la question"
    explain_text: >-
      Le même modèle d'embedding transforme la question en vecteur. Il doit être le même que pour
      les chunks : deux modèles différents ne rangent pas les sens dans le même espace, leurs
      vecteurs ne se comparent pas.
  vector_search:
    label_text: "Dense retrieval"
    action_text: "Chercher les chunks les plus proches"
  lexical_search:
    label_text: "BM25"
    action_text: "Chercher par mots-clés"
  fusion:
    label_text: "Fusion (RRF)"
    action_text: "Fusionner les deux classements"
  rerank:
    label_text: "Reranking"
    action_text: "Reclasser les candidats"
  context:
    label_text: "Prompt augmentation"
    action_text: "Construire le prompt avec les chunks retenus"
  generation:
    label_text: "Generation"
    action_text: "Générer la réponse"
  query:
    label_text: "Query understanding"
    action_text: "Produire les requêtes à chercher"
    note_text: "L'atelier n'a pas de conversation : la question de suivi lit les questions posées plus tôt dans cette session (trois au plus)."

