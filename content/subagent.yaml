# Sous-agent (story 19, AD-11, AD-25). `delegate.description` et `delegate.task` sont lus
# par le modèle, dans la variable `tools` du gabarit ; le reste s'affiche dans l'interface.
delegate:
  description: >-
    Confie une sous-tâche à un sous-agent qui travaille dans un contexte séparé, avec ses
    propres outils (lecture de fichier par exemple). À utiliser pour lire ou analyser un
    long document : seul le résultat du sous-agent revient ici, pas le document entier.
  task: >-
    La tâche du sous-agent, complète et autonome : il ne voit pas la conversation. Par
    exemple : Lis le fichier guide_harnais.md et résume-le en cinq points d'une ligne, 80 mots
    au plus.
# Libellé de la phase en cours (indicateur de travail) pendant la délégation.
phase_label_text: Appel au sous-agent
# Cause d'un dépassement du contexte du sous-agent (AD-9, AD-11).
overflow_cause_text: >-
  Cause : le contexte du sous-agent est plein, le plus souvent à cause du résultat d'un
  outil (un document trop long). Pour continuer la démo : confiez-lui un document plus
  court, ou une tâche qui en lit moins. Le tour principal continue sans ce résultat.
