name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # shortcut: no macOS, the abetlen CPU index has no llama-cpp-python wheel for it
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - if: runner.os == 'Windows'  # Git Bash, not the WSL bash.exe, for the install.sh tests
        run: echo "C:\Program Files\Git\bin" >> $env:GITHUB_PATH
      - run: uv run pytest -q --tb=short
